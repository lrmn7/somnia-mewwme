features:
  PLAY_COMMAND_ENGINE: ["youtube_music", "youtube", "spotify", "soundcloud"] # play commands engine
  SEARCH_COMMAND_ENGINE: ["youtube_music", "youtube", "spotify", "soundcloud"] # Search commands engine
  AUTOCOMPLETE_SEARCH: ["twice", "blackpink", "vvup"] # Default search suggestion for auto complete, leave it empty will use default
  MAX_QUEUE: 50 # max queue for member 
  LIMIT_TRACK: 50 # The number of tracks you want to limit (playlist features)
  LIMIT_PLAYLIST: 20 # The number of playlist you want to limit (playlist features)
  DELETE_MSG_TIMEOUT: 3000
  LEAVE_TIMEOUT: 90000 # The number of leave time you want
  SEARCH_TIMEOUT: 30000 #timeout collector search command
  AUTO_RESUME: false
  AUTOPLAY_SUPPORT: true
  YOUTUBE_LINK: true
  YOUTUBE_MUSIC_LINK: true
  HIDE_LINK: false # Enable this to hide the source link
  REPLACE_LINK: false # Enable this to replace the source link with support server link
  CONVERT_LINK: 
    Enable: false # # Enable this to convert the source link (e.g., from Spotify to Apple) and search/play with the set source, e.g., Apple
    Engine: "spsearch" # The source you want to convert to (e.g., dzsearch, amsearch, scsearch, spsearch. tdsearch)
  # set ui player settings for track start 
  FilterMenu: true
  ButtonLabel: true
  MusicCard:
    # available themes1 - themes20 or mewwme, mewwme1, miko, kobokanaeru, vestiazeta, yui, cute
    Enable: true
    Themes: "mewwme"

  DATABASE:
    driver: "json" # mongodb, mysql, json, postgres
    config: { path: "./mewwme.database.json" }
    ClearCache: "*/60 * * * * *" #clear cache for 1minutes
    # Database backup only works if you are using the MySQL driver
    MYSQLBACKUP:
      Enable: false
      Schedule: "0 0 * * *"
      Timezone: "Asia/Jakarta"
      ChannelId: "1156234673966563338"

  MESSAGE_CONTENT:
    enable: true
    commands:
      enable: true
      prefix: "me" # The prefix you want

  AUTOFIX_LAVALINK: # Fix the Lavalink server when the current is down
    enable: false
    retryCount: 5
    retryTimeout: 1000
    defaultSearchEngine: "soundcloud" #youtube, youtube_music, spotify or soundcloud

  RestAPI: # Configuration for the REST API server
    enable: true # Enable or disable the REST API (true to enable, false to disable)
    auth: "mewwme" # Auth token for internal WebSocket & API communication
    port: 4302 # Default port — overridden by RESTAPI_PORT in .env if set
    whitelist: [] # List of domains or IPs allowed to access the REST API (example: ["meww.me"]). Uses req.hostname — use plain hostnames, not full URLs.
