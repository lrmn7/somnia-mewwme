### About commands
about_desc1: "**歌いたい人はいつでも歌を見つけられる ♪\n今日からあなたのDiscordサーバーでメロディーに参加しましょう！**"
about_desc2: |
  ・このサーバーのBotプレフィックスは `%{prefix}` です
  ・プレフィックスの変更は `%{prefix} prefix <新しいプレフィックス>` で
  ・リンクまたは検索語で曲を再生 `%{prefix} play`
  詳しいコマンドは**[ウェブサイト](%{website})**をご覧いただくか、`%{prefix} help` コマンドをお使いください。
about_desc3: |
  **ご注意！**
  できれば`Administrator`権限をいただけると助かりますが...
  その権限がなくても動作しますが、すべての機能を利用できない場合があります。ご了承ください！

  **ヘルプとサポート**
  ヘルプが必要な場合、アップデートや問題に関する情報を得たい場合、またはコミュニティに参加したい場合は、**[サポートサーバー](%{serversupport})**にご参加ください！

