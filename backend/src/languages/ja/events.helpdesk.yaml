### BUTTON HELPDESK 1 ###
helpdesk1_title: "歌いたい人はいつでも歌を見つけられる ♪"
helpdesk1_desc: |
  **%{bot}は、Discordでの音楽体験を革新するDiscordボットです。最もクリーンなユーザーインターフェース、高音質オーディオ、幅広い音楽関連機能を提供します。**

  **なぜ%{bot}？**
  - **定期的なアップデート**: %{bot}は常に更新されており、最新の機能や修正をいつでもご利用いただけます。
  - **包括的な機能**: %{bot}のシンプルな音楽システムにより、複数のソースからスムーズに再生できます。
  - **専用サポートコミュニティ**: 私たちはDiscordで比較的新しいボットです。ぜひご参加ください！ボットがスムーズに動作することが最優先事項です。そのため、フィードバックや提案にご協力ください。ご質問がある場合は、サポートチケットを開いてください。

  **便利なリンク**
  - %{server}
  - %{vote}
  - %{website}
  - %{premium}

  **サポートが必要ですか？**
  - 追加のサポートが必要な場合はチケットを送信してください

  **何をお待ちですか？今日%{bot}をあなたのDiscordサーバーに招待して、比類のない無限の音楽体験をお楽しみください！**
  **[こちらをクリックして招待](%{invite})**

helpdesk2_title: "%{bot}をサーバーに追加する"
helpdesk2_desc: |
  **この[リンク](%{invite})を使って%{bot}を招待できます。**
    追加したいサーバーを選択し、**認証**をクリックしてください

  > %{bot}の`Administrator`権限を無効にすると、機能に影響を与える可能性があることにご注意ください。基本的な音楽機能にはアクセスできますが、一部の機能が正しく動作しない場合があります。

helpdesk3_title: "%{bot}音楽ボットの使い方は？"
helpdesk3_desc: |
  ボイスチャンネルまたはステージチャンネルに参加し、テキストチャンネルで /play <曲名/URL> と入力してください。
  停止、ループなどのコントロールボタンで直接操作できます。
  / （または /help）と入力し、%{bot}のアイコンを選択すると、利用可能なすべてのコマンド一覧が表示されます。

helpdesk4_title: "24/7機能を有効にするには？"
helpdesk4_desc: |
  ボイスチャンネルまたはステージチャンネルに参加し、テキストチャンネルで`/247 <enable/disable>`と入力してください。

  **注意:** *この機能は`manage server`権限をお持ちの場合に利用でき、事前にボットが音楽を再生中であることが確認されている必要があります。*

helpdesk5_title: "%{bot}が応答しない/オフラインです"
helpdesk5_desc: |
  コマンドを使おうとしても失敗し続けますか？おそらく応答できない状態ですが、以下の手順で修正してみてください。

  **%{bot}はスラッシュコマンドを使用するようになりました！**
  Discordが全ボットにスラッシュコマンドの使用を義務付けているため、スラッシュコマンドを使用していることを確認してください。
  `/play`と`/help`で始めてみてください

  **%{bot}がまだ応答しない場合は？**
  その状況で残された唯一のシナリオは、Discord側または私たち側の問題です。サーバーで%{bot}がオフラインでないか確認してください。オフラインの場合は、最大5分待って%{bot}がオンラインに戻るか確認してください。オンラインで必要な権限もすべて揃っている場合は、サポートメンバーにお問い合わせください。

helpdesk6_title: "%{bot}の音質が遅延しています"
helpdesk6_desc: |
  遅延した音楽は誰も好みませんが、Discordで音楽ボットを聴いているときに起こることがあります。以下にいくつかの解決策を示します。

  **どうすればいいですか？**
  まずインターネット接続を確認してください。Discordは左下に最新および平均のpingを表示しています。「ボイス接続済み」をクリックして、pingが安定しているか（赤いグラフが大きく変動している場合は不安定です！）、最新と平均のpingが250ミリ秒未満であることを確認してください。両方の指標が接続不良を示している場合は、WiFi/LANを確認してください。ルーターの再起動で問題が解消されることもあります。

  **5msのpingでGTA 5を2分でダウンロードできる環境ですか？**
  インターネット接続が問題ではないようです。%{bot}が遅延するケースの95%は、Discordのボイスサーバーに一時的な問題が発生しています。通常は再起動されますが、[サーバーリージョンの切り替え](https://support.discord.com/hc/en-us/articles/1500007645701-Voice-Regions-on-Discord-FAQ#h_01F3RXJ4YCHYS652ETKWJ499Y3)を試して、新しいDiscordボイスサーバーに接続してみてください。
  それでも同じ問題がある場合は、/report で問題を報告してください。

helpdesk7_title: "リクエストチャンネルをセットアップするには？"
helpdesk7_desc: |
  **リクエストチャンネルの作成方法は？**
  %{bot}に`manage server`権限が付与されていることを確認し、/setup で`create`オプションを選択すると、ボットが曲リクエスト用の専用チャンネルを自動的に作成します。

  ```注意: 正常に動作するため、%{bot}が作成したメッセージを削除しないでください。```

  **リクエストチャンネルの削除方法は？**
  同様にオプションで`delete`を選択してください。

helpdesk8_title: "%{bot}が権限不足と表示し続けます。"
helpdesk8_desc: |
  特定のコマンドを実行しようとすると、%{bot}に必要な権限がない場合があります。その場合、%{bot}はこれらの問題が解決されるまでコマンドの実行を拒否します。これらの権限はオプションではなく、%{bot}がコマンドを実行するために必要です。

  ボットに必要な権限があると思われる場合は、チャンネルのロールオーバーライドを確認してください。これらのオーバーライドにより、特定のチャンネルでロールの権限が変更される場合があります。

  %{bot}に必要な権限がない理由がまだわからない場合は、%{bot}にAdministrator権限を付与することをご検討ください。これにより、Discordの権限に関する問題が解決されるはずです。

helpdesk9_title: "Mewwmeがボイスチャンネルから自動的に切断されます"
helpdesk9_desc: |
  非常にまれなケースですが、24/7モードが有効でも、/stopやDiscordの切断ボタンを使用せずにMewwmeがボイスチャンネルから切断される場合があります。最も一般的な原因と解決策を以下に示します。

  **24/7モードが有効になっていません。**
  デフォルトでは、Mewwmeはボイスチャンネルが空になると3分後に切断されます。

  **修正方法:** 最初のヘルプの「4. 24/7機能を有効にするには？」を参照して24/7モードを有効にしてください。

  **権限不足。**
  サーバーの再起動やAPI障害によりDiscordがボイスチャンネルへの再接続を求める場合、ボットの権限を再確認して、チャンネルに参加して発言できることを確認します。不足している場合は、/playを使用して別のチャンネルまたは必要な権限を追加した後に同じチャンネルにボットを招待する必要があります。

  **修正方法:** ボットを別のチャンネルから移動するのではなく、/playコマンドを使用してボイスチャンネルに追加するようにしてください。これにより、必要に応じてボットが再接続するために必要な権限がすべて確保されます。

  **サーバーリージョンの問題。**
  特定のケースでは、一部のボイスリージョンでネットワークや安定性の問題が発生し、ボットがボイスチャンネルに参加できない場合があります。

  **修正方法:** ボイスチャンネルの設定を使用して別のボイスリージョンに切り替えてください（お住まいの国に最も近いものを選択してください）。

  **その他の問題。**
  上記のすべての修正を試しても問題が解決しない場合は、`report`と入力するか、サポート https://discord.com/channels/1088032923443277824/1169558722738147378 でチケットを開いてください。

helpdesk10_title: "プレミアムの入手/有効化方法と特典は？"
helpdesk10_desc: |
  **プレミアム特典の引き換え方法は？**

  プレミアムメンバーシップの特典を有効化するには、以下の手順に従ってください：
  1. **まずDiscordアカウントを連携してください**
    - 購入前に、ご利用のプラットフォーム（PatreonまたはKo-fi）にDiscordアカウントが接続されていることを確認してください。
    - これにより、システムが自動的にお支払いを検出できるようになります。
  2. **メンバーシップを購入してください**
  - Discordを連携した後、ご希望のプランに基づいてメンバーシップのお支払いを完了してください。
  3. **同期をお待ちください**
    - お支払いが成功したら、システムがメンバーシップを同期するまで数分お待ちください。
  4. **サーバーでプレミアムを申請してください**
    - アップグレードしたいDiscordサーバーに行き、以下のコマンドを使用してください：
      `/premium claim`
      プロンプトが表示されたら、正しいプラットフォームオプション（PatreonまたはKo-fi）を選択してください。
      プレミアムを有効化したいサーバー内でコマンドを実行してください。
      申請が完了すると、プレミアムが即座に有効化されます。

  上記の手順に従うことで、提供されるすべてのプレミアム特典を有効化してお楽しみいただけます。問題が発生したり、ご質問がある場合は、サポートチームまでお気軽にお問い合わせください。

helpdesk10_footer: "私たちの旅に参加してくださりありがとうございます！素敵な時間をお過ごしください。"
