## RULES Events ##
rules_title: "%{guild}コミュニティのサーバールール！"
rules_desc: |
  - **敬意を持って行動してください**
    常にDiscordの[利用規約](https://discord.com/terms)と[ガイドライン](https://discord.com/guidelines)に従ってください。
  - **ヘルプコード**
    助けを求める際は、エラーを含めてできるだけ詳しい情報を提供してください。
  - **ヘイトスピーチやハラスメント禁止**
    個人やグループに対するヘイトスピーチやハラスメントを含む会話は禁止です。
  - **荒らしや煽り禁止**
    いかなる方法でも混乱を招いたり対立を引き起こそうとする行為は禁止です。
  - **知的財産の尊重**
    著作権、商標、特許を含むがこれらに限定されない知的財産権を尊重してください。
  - **ネタバレ禁止（警告なし）**
    全メンバーがまだ消費していないコンテンツについて話し合う場合は、がっかりさせないようにネタバレ警告を提供してください。
  - **適切なチャンネルを使用してください**
    特定のトピックには関連するチャンネルを使用し、無関係なチャンネルでオフトピックの議論は避けてください。
  - **過度な大文字やスパム禁止**
    大文字の過度な使用や、メッセージを連続して素早く送信することは避けてください。
  - **ボイスチャンネルをクリーンに保ってください**
    ボイスチャンネルを使用する場合は、邪魔になるノイズがないことを確認し、丁寧に話してください。
  - **無許可のボットや自動化禁止**
    モデレーターが承認したボットのみがサーバーで動作を許可されています。
  - **違反の報告**
    ルール違反を目撃した場合は、モデレーターまたは管理者に報告してください。
  - **楽しんでください！**
    最も重要なことは、すべてのメンバーを尊重し、ポジティブな環境を維持しながら、このサーバーでの時間を楽しむことです。

  ご参加ありがとうございます。素敵な時間をお過ごしください。

