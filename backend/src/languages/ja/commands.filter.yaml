### Equalizer command!
eq_author: "イコライザー"
eq_icon: "https://i.pinimg.com/originals/cb/17/b8/cb17b80a942d7c317a35ff1324fae12f.gif"
eq_desc: |
  **-10**から**10**まで設定できる**10バンド**があります。
  すべてを入力する必要はなく、変更したいものだけで構いません。
  スキップしたい場合は**0**のままにしてください。
eq_field_title: "例:"
eq_field_value: "%{prefix}eq 2 3 0 8 0 5 0 -5 0 0"
eq_footer: "イコライザーをリセット • %{prefix}eq reset"
eq_on: "EQが**%{bands}**に設定されました！"
eq_number: "有効な数値を入力してください！"
eq_greater: "数値は**-10**より大きくしてください"
eq_than: "数値は**10**より小さくしてください"

