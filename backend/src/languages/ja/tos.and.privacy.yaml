### privacy policy commands
privacy_title: "%{bot}のプライバシーポリシー"
privacy_label: プライバシーポリシー
privacy_desc: |
  **ユーザー同意**
  サーバーで[%{bot}](%{serversupport})（「ボット」）を使用するには、特定のユーザーデータの収集が必要です。収集されるデータには、ユーザーのDiscord ID、Discordユーザー名、サーバーロールが含まれますが、これらに限定されません。ボットを使用することで、このポリシーの条件に同意したものとみなされます。

  **データアクセス**
  データへのアクセスは、ボット開発者およびホスティングサービスのみに許可され、ボットの開発、テスト、機能実装に必要な範囲内でのみ行われます。データは、法律または利用規約の合意により要求される場合を除き、第三者に販売、提供、または共有されません。[開発者](%{developer})にリクエストすることで、ご自身のデータを閲覧できます。

  **データ保存**
  データは[MYSQL](https://www.mysql.com/)データベースに保存されます。データベースは外部アクセスを防ぐためにセキュリティが確保されています。ただし、保証は提供されず、ボットオーナーは意図しないまたは悪意のあるデータ侵害について責任を負いません。不正なデータアクセスがあった場合、サーバースタッフはサポートサーバーを通じてユーザーに通知します。

  **ユーザーの権利**
  いつでも、ご自身のDiscordアカウントデータの閲覧をリクエストする権利があります。関連データの削除をリクエストする権利があります。これを行うには、サポートサーバーを通じてリクエストを送信してください。

  **ご質問**
  アカウントからどのようなデータが保存されている可能性があるかについてご質問やご懸念がある場合は、[スタッフ](%{serversupport})にお問い合わせください。詳細については、Discordの利用規約をご確認ください。

### The following terms and conditions apply to the use of the bot.
### terms of services commands
termsofservice_title: "%{bot}の利用規約"
tos_label: "利用規約"
termsofservice_desc: |
  **利用契約**
  [%{bot}](%{serversupport})（「ボット」）を招待し、その機能を使用することにより、ボットの利用規約およびプライバシーポリシーに同意したものとみなされます。

  共有するすべてのDiscordサーバーでボットを自由に使用できることを認識しています。「サーバー管理」権限を持つすべてのサーバーに招待でき、このボットの利用規約またはプライバシーポリシー、またはDiscord Inc.の利用規約、プライバシーポリシー、コミュニティガイドラインに違反した場合、この特権は取り消される場合があります。

  招待を通じて、ボットはプライバシーポリシーに記載されている特定のデータを収集する場合があります。このデータの使用目的は、コマンドの実行などのボットのコア機能です。

  **提携関係**
  ボットは、Discord Inc.と提携、サポート、または作成されたものではありません。Discordまたはその商標オブジェクトとの直接的な関連は純粋に偶然です。Discordの資産、商標、またはその他の知的財産の著作権の所有を主張しません。

  **未成年ユーザー**
  ボットは、13歳未満またはその国の法的同意年齢未満の未成年者による使用は許可されていません。これはDiscordの利用規約に準拠しています。未成年ユーザーの情報は故意に保存されません。ユーザーが未成年であることが判明した場合、保存されたデータを削除するために必要なすべての措置を講じます。

  **責任**
  ボットの開発者およびオーナーは、いかなる時点でもこれらの規約に違反した個人に対して責任を負いません。これらの規約を更新する権利は当方の裁量で留保されており、1週間（7日間）のオプトアウト期間が設けられます。ユーザーは、ボットを削除する権利を持つすべてのサーバーからボットを削除することでオプトアウトできます。
