### BUTTON HELPDESK 1 ###
helpdesk1_title: "जो गाना चाहते हैं उन्हें हमेशा एक गीत मिलता है ♪"
helpdesk1_desc: |
  **%{bot} एक Discord बॉट है जो Discord पर आपके संगीत अनुभव को क्रांतिकारी बनाता है, सबसे स्वच्छ यूज़र इंटरफ़ेस, उच्च-गुणवत्ता ऑडियो और संगीत-संबंधी सुविधाओं की विस्तृत श्रृंखला प्रदान करता है।**

  **%{bot} क्यों?**
  - **नियमित अपडेट**: %{bot} लगातार अपडेट किया जाता है, जिससे आपको हमेशा नवीनतम सुविधाएँ और सुधार मिलते हैं।
  - **व्यापक सुविधाएँ**: %{bot} की सरल संगीत प्रणाली कई स्रोतों से आसान प्लेबैक की अनुमति देती है।
  - **समर्पित सपोर्ट समुदाय**: हम Discord पर अपेक्षाकृत नया बॉट हैं, और हम चाहेंगे कि आप हमसे जुड़ें! बॉट सुचारू रूप से चले यह सुनिश्चित करना हमारी प्राथमिकता है, इसलिए हमें आपकी प्रतिक्रिया और सुझावों की आवश्यकता है। यदि आपके कोई प्रश्न हैं, तो बेझिझक सपोर्ट टिकट खोलें।

  **उपयोगी लिंक**
  - %{server}
  - %{vote}
  - %{website}
  - %{premium}

  **सहायता चाहिए?**
  - अतिरिक्त सहायता के लिए टिकट सबमिट करें

  **आप किसका इंतज़ार कर रहे हैं? आज ही %{bot} को अपने Discord सर्वर में आमंत्रित करें और असीमित संगीत अनुभव का आनंद लें!**
  **[आमंत्रित करने के लिए यहाँ क्लिक करें](%{invite})**

helpdesk2_title: "%{bot} को अपने सर्वर में जोड़ना"
helpdesk2_desc: |
  **आप इस [लिंक](%{invite}) का उपयोग करके %{bot} को आमंत्रित कर सकते हैं।**
    वह सर्वर चुनें जिसमें आप इसे जोड़ना चाहते हैं और **Authorize** पर क्लिक करें

  > ध्यान दें कि यदि आप %{bot} के लिए `Administrator` अनुमतियाँ अक्षम करना चाहते हैं, तो यह इसकी कार्यक्षमता को प्रभावित कर सकता है। हालाँकि आप अभी भी बुनियादी संगीत सुविधाओं का उपयोग कर पाएँगे, कुछ कार्यक्षमताएँ ठीक से काम नहीं कर सकतीं।

helpdesk3_title: "%{bot} म्यूज़िक बॉट का उपयोग कैसे करें?"
helpdesk3_desc: |
  एक वॉइस या स्टेज चैनल में शामिल हों फिर एक टेक्स्ट चैनल में /play <गाने का नाम/url> टाइप करें।
  आप स्टॉप, लूप आदि के लिए कंट्रोल बटन का सीधे उपयोग कर सकते हैं।
  सभी उपलब्ध कमांड की सूची प्राप्त करने के लिए / (या /help) टाइप करें और %{bot} का आइकन चुनें।

helpdesk4_title: "24/7 सुविधा कैसे सक्षम करें?"
helpdesk4_desc: |
  एक वॉइस या स्टेज चैनल में शामिल हों फिर एक टेक्स्ट चैनल में `/247 <enable/disable>` टाइप करें।

  **नोट:** *इस सुविधा का उपयोग तब किया जा सकता है जब आपके पास `manage server` अनुमति हो, और यह पहले से सुनिश्चित हो कि बॉट वर्तमान में संगीत बजा रहा है।*

helpdesk5_title: "%{bot} प्रतिक्रिया नहीं दे रहा/ऑफ़लाइन है"
helpdesk5_desc: |
  आप कोई कमांड इस्तेमाल करने की कोशिश कर रहे हैं लेकिन यह लगातार विफल हो रहा है? खैर, शायद यह जवाब देने में सक्षम नहीं है, लेकिन इसे ठीक करने के लिए नीचे दिए गए चरणों का पालन करें।

  **%{bot} अब स्लैश कमांड का उपयोग करता है!**
  सुनिश्चित करें कि आप स्लैश कमांड का उपयोग कर रहे हैं क्योंकि Discord अब सभी बॉट्स को उनका उपयोग करने की आवश्यकता रखता है।
  `/play` और `/help` टाइप करके शुरू करें

  **%{bot} अभी भी जवाब नहीं दे रहा?**
  उस स्थिति में एकमात्र शेष परिदृश्य Discord या हमारी ओर से समस्या है। सत्यापित करें कि %{bot} आपके सर्वर में ऑफ़लाइन तो नहीं है। यदि यह ऑफ़लाइन है, तो 5 मिनट तक प्रतीक्षा करें और देखें कि %{bot} वापस ऑनलाइन आता है या नहीं। यदि यह ऑनलाइन है, सभी आवश्यक अनुमतियाँ हैं, तो आपको निश्चित रूप से हमारी सपोर्ट टीम के किसी सदस्य से संपर्क करना चाहिए।

helpdesk6_title: "%{bot} की ऑडियो गुणवत्ता धीमी लग रही है"
helpdesk6_desc: |
  कोई भी धीमा संगीत पसंद नहीं करता, लेकिन Discord पर म्यूज़िक बॉट्स सुनते समय कभी-कभी ऐसा होता है। इसे ठीक करने में मदद के लिए यहाँ कुछ संभावित समाधान हैं।

  **मुझे क्या करना चाहिए?**
  सबसे पहले आपको अपना इंटरनेट कनेक्शन जाँचना चाहिए। Discord नीचे बाईं ओर आपका अंतिम और औसत पिंग दिखाता है, बस "Voice Connected" पर क्लिक करें और सत्यापित करें कि आपका पिंग स्थिर है (यदि लाल ग्राफ़ बहुत हिल रहा है तो इसका मतलब यह स्थिर नहीं है!) और अंतिम तथा औसत पिंग 250 मिलीसेकंड से कम है। यदि ये दोनों संकेतक दिखाते हैं कि आपका कनेक्शन खराब है तो आपको अपना WiFi/LAN जाँचना चाहिए। अपना राउटर पुनः आरंभ करने से भी कुछ समस्याएँ दूर हो सकती हैं।

  **आपका पिंग 5ms है और आप 2 मिनट में GTA 5 डाउनलोड कर सकते हैं?**
  तो आपका इंटरनेट कनेक्शन समस्या नहीं लगता। 95% मामलों में जहाँ %{bot} धीमा है, Discord को अपने वॉइस सर्वर में अस्थायी समस्याएँ हो रही हैं। वे आमतौर पर किसी बिंदु पर उन्हें पुनः आरंभ करते हैं लेकिन आप अपने क्षेत्र में एक अलग सर्वर पर स्विच कर सकते हैं। एक नया और ताज़ा Discord वॉइस सर्वर प्राप्त करने के लिए [अपना सर्वर क्षेत्र बदलने](https://support.discord.com/hc/en-us/articles/1500007645701-Voice-Regions-on-Discord-FAQ#h_01F3RXJ4YCHYS652ETKWJ499Y3) का प्रयास करें।
  यदि आपको अभी भी वही समस्या हो रही है तो बेझिझक /report टाइप करके अपनी समस्या की रिपोर्ट करें।

helpdesk7_title: "गाना अनुरोध चैनल कैसे सेट करें?"
helpdesk7_desc: |
  **अनुरोध चैनल कैसे बनाएँ?**
  सुनिश्चित करें कि %{bot} को `manage server` अनुमति दी गई है फिर `create` विकल्प के साथ /setup टाइप करें तो बॉट स्वचालित रूप से गाना अनुरोधों के लिए एक विशेष चैनल बनाएगा।

  ```नोट: मेरे ठीक से काम करने के लिए कृपया %{bot} द्वारा बनाए गए किसी भी संदेश को न हटाएँ।```

  **अनुरोध चैनल कैसे हटाएँ?**
  पहले की तरह केवल विकल्पों में आप `delete` चुन सकते हैं।

helpdesk8_title: "%{bot} कहता रहता है कि अनुमतियाँ नहीं हैं।"
helpdesk8_desc: |
  कुछ कमांड चलाने की कोशिश करते समय, %{bot} के पास कुछ अनुमतियों की कमी हो सकती है। ऐसे मामलों में, %{bot} इन समस्याओं के हल होने तक कमांड चलाने से मना कर देगा। यह ध्यान रखना महत्वपूर्ण है कि ये अनुमतियाँ वैकल्पिक नहीं हैं; %{bot} को कमांड निष्पादित करने के लिए इनकी आवश्यकता है।

  यदि आपको लगता है कि बॉट के पास आवश्यक अनुमतियाँ हैं, तो चैनल की रोल ओवरराइड की जाँच करना सुनिश्चित करें। ये ओवरराइड विशिष्ट चैनलों में रोल अनुमतियों को संशोधित कर सकते हैं।

  यदि आप अभी भी यह निर्धारित करने में असमर्थ हैं कि %{bot} के पास आवश्यक अनुमतियाँ क्यों नहीं हैं, तो %{bot} को Administrator अनुमति देने पर विचार करें। इससे कोई भी Discord अनुमति समस्या हल हो जानी चाहिए।

helpdesk9_title: "Mewwme वॉइस चैनल से खुद ही डिस्कनेक्ट हो जाता है"
helpdesk9_desc: |
  बहुत असामान्य मामलों में, 24/7 मोड सक्षम होने पर भी, Mewwme बिना किसी के /stop या Discord के Disconnect बटन का उपयोग किए वॉइस चैनल से डिस्कनेक्ट हो सकता है। कुछ सबसे सामान्य कारण और संभावित समाधान नीचे सूचीबद्ध हैं।

  **24/7 मोड सक्षम नहीं है।**
  डिफ़ॉल्ट रूप से, Mewwme खाली होने पर 3 मिनट में वॉइस चैनल से डिस्कनेक्ट हो जाता है।

  **समाधान:** 24/7 मोड सक्षम करने के लिए पहले हेल्प एम्बेड में "4. 24/7 सुविधा कैसे सक्षम करें?" देखें।

  **अनुमतियाँ गायब हैं।**
  जब भी Discord हमें वॉइस चैनल से पुनः कनेक्ट करने के लिए कहता है, चाहे सर्वर पुनः आरंभ या API आउटेज के कारण, हम बॉट अनुमतियों की दोबारा जाँच करते हैं ताकि यह सुनिश्चित हो सके कि यह चैनल में शामिल हो सकता है और बोल सकता है। यदि कुछ गायब है, तो आपको बॉट को किसी अन्य चैनल या आवश्यक अनुमतियाँ जोड़ने के बाद उसी चैनल में आमंत्रित करने के लिए /play का पुनः उपयोग करना होगा।

  **समाधान:** बॉट को वॉइस चैनल में जोड़ने के लिए किसी अन्य चैनल से स्थानांतरित करने के बजाय /play कमांड का उपयोग करना सुनिश्चित करें। ऐसा करके, आप यह सुनिश्चित करेंगे कि बॉट के पास आवश्यकता होने पर पुनः कनेक्ट करने के लिए सभी आवश्यक अनुमतियाँ हैं।

  **सर्वर क्षेत्र समस्याएँ।**
  कुछ मामलों में, कुछ वॉइस क्षेत्रों में नेटवर्क और स्थिरता समस्याएँ हो सकती हैं जो बॉट को वॉइस चैनल में शामिल होने से रोक सकती हैं।

  **समाधान:** वॉइस चैनल सेटिंग्स का उपयोग करके किसी अन्य वॉइस क्षेत्र पर स्विच करें (अपने देश के सबसे नज़दीक वाला चुनें)।

  **कुछ और गलत हो गया।**
  यदि आपने उपरोक्त सभी समाधान आज़मा लिए हैं और समस्या बनी रहती है, तो कृपया `report` टाइप करें या सपोर्ट में टिकट खोलें https://discord.com/channels/1088032923443277824/1169558722738147378

helpdesk10_title: "प्रीमियम कैसे प्राप्त/सक्रिय करें और क्या लाभ मिलेंगे?"
helpdesk10_desc: |
  **अपने प्रीमियम लाभ कैसे रिडीम करें?**

  अपनी प्रीमियम सदस्यता के लाभ सक्रिय करने के लिए, कृपया इन चरणों का पालन करें:
  1. **पहले अपना discord खाता लिंक करें**
    - खरीदने से पहले, सुनिश्चित करें कि आपका discord खाता उस प्लेटफ़ॉर्म से जुड़ा है जिसका आप उपयोग कर रहे हैं (patreon या ko-fi)।
    - यह आवश्यक है ताकि सिस्टम आपके भुगतान का स्वचालित रूप से पता लगा सके।
  2. **अपनी सदस्यता खरीदें**
  - अपना discord लिंक करने के बाद, अपनी इच्छित योजना के अनुसार सदस्यता भुगतान पूरा करें।
  3. **सिंक्रोनाइज़ेशन की प्रतीक्षा करें**
    - आपका भुगतान सफल होने के बाद, कृपया सिस्टम द्वारा आपकी सदस्यता सिंक करने के लिए कुछ मिनट प्रतीक्षा करें।
  4. **अपने सर्वर में प्रीमियम क्लेम करें**
    - उस discord सर्वर पर जाएँ जिसे आप अपग्रेड करना चाहते हैं, फिर यह कमांड उपयोग करें:
      `/premium claim`
      पूछे जाने पर सही प्लेटफ़ॉर्म विकल्प (patreon या ko-fi) चुनें।
      सुनिश्चित करें कि आप कमांड उस सर्वर के अंदर चलाएँ जिसके लिए आप प्रीमियम सक्रिय करना चाहते हैं।
      क्लेम करने के बाद, प्रीमियम तुरंत सक्रिय हो जाएगा।

  उपरोक्त चरणों का पालन करके, आप प्रदान किए गए सभी प्रीमियम लाभों को सक्रिय और उनका आनंद ले पाएँगे। यदि आपको कोई समस्या आती है या और प्रश्न हैं, तो बेझिझक हमारी सपोर्ट टीम से संपर्क करें।

