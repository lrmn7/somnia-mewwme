### About commands
about_desc1: "**जहाँ गाने की इच्छा रखने वालों को हमेशा एक गीत मिलता है ♪\nआज ही अपने Discord सर्वर में संगीत की धुन से जुड़ें!**"
about_desc2: |
  ・इस सर्वर के लिए बॉट प्रीफ़िक्स `%{prefix}` है
  ・प्रीफ़िक्स बदलने के लिए `%{prefix} prefix <new prefix>` का उपयोग करें
  ・लिंक या सर्च टर्म से ट्रैक बजाएँ `%{prefix} play`
  अधिक कमांड्स के लिए हमारी **[वेबसाइट](%{website})** पर जाएँ या `%{prefix} help` कमांड का उपयोग करें।
about_desc3: |
  **ध्यान दें!**
  मुझे प्राथमिक रूप से `Administrator` अनुमतियाँ चाहिए, लेकिन...
  अगर आप मुझे वो अनुमतियाँ नहीं भी देते हैं, तो भी मैं काम कर सकता हूँ, लेकिन हो सकता है मैं वो सब कुछ न कर पाऊँ जो मैं कर सकता हूँ। बस बता रहा हूँ!

  **सहायता और समर्थन**
  अगर आपको मदद चाहिए, अपडेट और समस्याओं के बारे में जानकारी पाना चाहते हैं या समुदाय से जुड़ना चाहते हैं तो हमारे **[सपोर्ट सर्वर](%{serversupport})** से जुड़ें!

