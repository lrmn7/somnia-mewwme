## RULES Events ##
rules_title: "%{guild} समुदाय के सर्वर नियम!"
rules_desc: |
  - **सम्मानजनक रहें**
    हमेशा Discord [ToS](https://discord.com/terms) और [दिशानिर्देशों](https://discord.com/guidelines) का पालन करें।
  - **सहायता कोड**
    जब आप मदद माँग रहे हों, तो त्रुटियों के साथ यथासंभव अधिक विवरण प्रदान करना सुनिश्चित करें।
  - **कोई घृणा भाषण या उत्पीड़न नहीं**
    व्यक्तियों या समूहों के प्रति घृणा भाषण या उत्पीड़न वाली कोई बातचीत नहीं।
  - **कोई ट्रोलिंग या फ़्लेमिंग नहीं**
    किसी भी तरह से विवाद भड़काने या बाधित करने के उद्देश्य से कोई कार्रवाई नहीं।
  - **बौद्धिक संपदा का सम्मान करें**
    कॉपीराइट, ट्रेडमार्क और पेटेंट सहित बौद्धिक संपदा अधिकारों का सम्मान करें।
  - **बिना चेतावनी के कोई स्पॉइलर नहीं**
    यदि ऐसी सामग्री पर चर्चा कर रहे हैं जो सभी सदस्यों ने अभी तक नहीं देखी है, तो निराशा से बचने के लिए स्पॉइलर चेतावनी दें।
  - **उचित चैनलों का उपयोग करें**
    विशिष्ट विषयों के लिए प्रासंगिक चैनलों का उपयोग करें, असंबंधित चैनलों में ऑफ़-टॉपिक चर्चा से बचें।
  - **अत्यधिक कैपिटलाइज़ेशन या स्पैमिंग नहीं**
    बड़े अक्षरों के अत्यधिक उपयोग या तेज़ी से बार-बार संदेश भेजने से बचें।
  - **वॉइस चैनल साफ़ रखें**
    यदि वॉइस चैनल का उपयोग कर रहे हैं, तो सुनिश्चित करें कि कोई विघटनकारी शोर न हो और विनम्रता से बोलें।
  - **कोई अनधिकृत बॉट या ऑटोमेशन नहीं**
    सर्वर पर केवल मॉडरेटर्स द्वारा अधिकृत बॉट्स को ही संचालित करने की अनुमति है।
  - **उल्लंघन की रिपोर्ट करें**
    यदि आप नियम उल्लंघन देखते हैं, तो किसी मॉडरेटर या एडमिन को रिपोर्ट करें।
  - **मज़े करें!**
    सबसे महत्वपूर्ण बात, सभी सदस्यों का सम्मान करते हुए और सकारात्मक माहौल बनाए रखते हुए इस सर्वर पर अपने समय का आनंद लें।

  शामिल होने के लिए धन्यवाद, हम आशा करते हैं कि आपका यहाँ अच्छा समय बीतेगा।

