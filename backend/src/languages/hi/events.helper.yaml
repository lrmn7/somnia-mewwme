## Helper setup ##
setup_helper_content: |
  ## %{guild} समुदाय में आपका स्वागत है!
  *यदि आप Discord में नए हैं, तो आप सही जगह पर आए हैं! यह चैनल आपको सर्वर में नेविगेट करने में मदद करने के लिए समर्पित है।*
  ⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤
  %{bot} एक Discord बॉट है जो एक स्वच्छ इंटरफ़ेस, उच्च-गुणवत्ता ऑडियो और विभिन्न संगीत सुविधाओं के साथ आपके संगीत अनुभव को बेहतर बनाता है।

  यह Discord सर्वर %{guild} समुदाय के केंद्र में घूमने के लिए सबसे अच्छी जगह है।
  चैट का आनंद लें, संगीत की सिफ़ारिशें साझा करें, और %{bots} बॉट द्वारा प्रदान की गई सभी सुविधाओं का अन्वेषण करें!

  क्या आप अपने दोस्तों को सर्वर पर आमंत्रित करना चाहते हैं? उन्हें यह लिंक भेजें: %{serversupport}

