### privacy policy commands
privacy_title: "%{bot} की गोपनीयता नीति"
privacy_label: गोपनीयता नीति
privacy_desc: |
  **उपयोगकर्ता समझौता**
  सर्वर पर [%{bot}](%{serversupport}) ("बॉट") का उपयोग करने के लिए कुछ उपयोगकर्ता डेटा के संग्रह की आवश्यकता होती है। एकत्र किए गए डेटा में उपयोगकर्ता की Discord ID, Discord उपयोगकर्ता नाम और सर्वर भूमिकाएँ शामिल हैं लेकिन इन्हीं तक सीमित नहीं हैं। बॉट का उपयोग इन नीति शर्तों की स्वीकृति मानी जाती है।

  **डेटा एक्सेस**
  डेटा तक पहुँच केवल बॉट डेवलपर्स और होस्टिंग सेवाओं को और केवल बॉट विकास, परीक्षण और सुविधा कार्यान्वयन के लिए आवश्यक दायरे में अनुमत है। डेटा किसी भी तृतीय पक्ष को बेचा, दिया या साझा नहीं किया जाता है, सिवाय कानून या सेवा की शर्तों के समझौते द्वारा आवश्यक होने पर। आप [डेवलपर](%{developer}) से अनुरोध पर अपना डेटा देख सकते हैं।

  **डेटा संग्रहण**
  डेटा [MYSQL](https://www.mysql.com/) डेटाबेस में संग्रहीत किया जाता है। डेटाबेस बाहरी पहुँच को रोकने के लिए सुरक्षित है। हालाँकि, कोई गारंटी प्रदान नहीं की जाती है, और बॉट का मालिक अनजाने या दुर्भावनापूर्ण डेटा उल्लंघनों के लिए ज़िम्मेदार नहीं है। यदि अनधिकृत डेटा पहुँच होती है, तो सर्वर स्टाफ़ सपोर्ट सर्वर के माध्यम से उपयोगकर्ताओं को सूचित करेगा।

  **उपयोगकर्ता अधिकार**
  किसी भी समय, आपके पास अपने Discord खाता डेटा को देखने का अनुरोध करने का अधिकार है। आपके पास प्रासंगिक डेटा को हटाने का अनुरोध करने का अधिकार है। ऐसा करने के लिए, उपयोगकर्ताओं को सपोर्ट सर्वर के माध्यम से अनुरोध सबमिट करना होगा।

  **प्रश्न**
  यदि आपके पास इस बारे में प्रश्न या चिंताएँ हैं कि आपके खाते से कौन सा डेटा संग्रहीत किया जा सकता है, तो कृपया [स्टाफ़](%{serversupport}) से संपर्क करें। अधिक जानकारी के लिए, Discord की सेवा की शर्तें देखें।

### The following terms and conditions apply to the use of the bot.
### terms of services commands
termsofservice_title: "%{bot} की सेवा की शर्तें"
tos_label: "सेवा की शर्तें"
termsofservice_desc: |
  **उपयोग समझौता**
  [%{bot}](%{serversupport}) ("बॉट") को आमंत्रित करके और इसकी सुविधाओं का उपयोग करके, आप बॉट की सेवा की शर्तों और गोपनीयता नीति से सहमत होते हैं।

  आप स्वीकार करते हैं कि आप किसी भी Discord सर्वर पर जिसे आप साझा करते हैं, बॉट का स्वतंत्र रूप से उपयोग कर सकते हैं। आप इसे किसी भी ऐसे सर्वर पर आमंत्रित कर सकते हैं जहाँ आपके पास "Manage Server" अधिकार हैं, और यह विशेषाधिकार रद्द किया जा सकता है यदि आप इस बॉट की सेवा की शर्तों या गोपनीयता नीति या Discord Inc. की सेवा की शर्तों, गोपनीयता नीति या सामुदायिक दिशानिर्देशों का उल्लंघन करते हैं।

  आमंत्रित करने के माध्यम से, बॉट अपनी गोपनीयता नीति में वर्णित विशिष्ट डेटा एकत्र कर सकता है। इस डेटा का इच्छित उपयोग बॉट की मुख्य कार्यक्षमताओं के लिए है, जैसे कि कमांड निष्पादित करना।

  **संबद्धता**
  बॉट Discord Inc. से संबद्ध, समर्थित या निर्मित नहीं है। Discord या इसके किसी भी ट्रेडमार्क ऑब्जेक्ट से कोई भी सीधा संबंध पूरी तरह से संयोग है। हम Discord की संपत्तियों, ट्रेडमार्क या अन्य बौद्धिक संपदा पर कॉपीराइट स्वामित्व का दावा नहीं करते हैं।

  **अवयस्क उपयोगकर्ता**
  13 वर्ष से कम उम्र के या अपने देश की कानूनी सहमति से कम उम्र के नाबालिगों को बॉट का उपयोग करने की अनुमति नहीं है। यह Discord की सेवा की शर्तों का पालन करता है। किसी अवयस्क उपयोगकर्ता से जानबूझकर कोई जानकारी संग्रहीत नहीं की जाएगी। यदि पता चलता है कि कोई उपयोगकर्ता अवयस्क है, तो हम संग्रहीत डेटा को हटाने के लिए सभी आवश्यक कदम उठाएँगे।

  **दायित्व**
  बॉट के डेवलपर्स और मालिक को किसी भी समय इन शर्तों का उल्लंघन करने वाले व्यक्तियों के लिए उत्तरदायी नहीं ठहराया जा सकता। इन शर्तों को अपडेट करने का अधिकार हमारे विवेक पर सुरक्षित है, जिसमें इन शर्तों से बाहर निकलने के लिए 1-सप्ताह (7 दिन) की अवधि दी जाती है। उपयोगकर्ता किसी भी सर्वर से बॉट को हटाकर ऑप्ट-आउट कर सकता है जहाँ उपयोगकर्ता के पास बॉट हटाने का अधिकार है।
