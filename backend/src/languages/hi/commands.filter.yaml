bassboost_limit: "कृपया **-10** और **10** के बीच की संख्या का उपयोग करें"

### Equalizer command!
eq_author: "इक्वलाइज़र"
eq_icon: "https://i.pinimg.com/originals/cb/17/b8/cb17b80a942d7c317a35ff1324fae12f.gif"
eq_desc: |
  **10 बैंड** हैं जिन्हें **-10** से **10** तक सेट किया जा सकता है।
  आपको सभी को इनपुट करने की ज़रूरत नहीं है, बस वो जिन्हें आप बदलना चाहते हैं।
  तो अगर आप किसी एक को छोड़ना चाहते हैं, तो बस उसे **0** रहने दें।
eq_field_title: "उदाहरण:"
eq_field_value: "%{prefix}eq 2 3 0 8 0 5 0 -5 0 0"
eq_footer: "इक्वलाइज़र रीसेट करें • %{prefix}eq reset"
eq_on: "EQ **%{bands}** पर सेट किया गया है!"
eq_number: "कृपया एक मान्य संख्या दें!"
eq_greater: "संख्या **-10** से बड़ी होनी चाहिए"
eq_than: "संख्या **10** से कम होनी चाहिए"

