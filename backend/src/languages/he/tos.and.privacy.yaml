### privacy policy commands
privacy_title: "מדיניות הפרטיות של %{bot}"
privacy_label: מדיניות פרטיות
privacy_desc: |
  **הסכם משתמש**
  שימוש ב-[%{bot}](%{serversupport}) ("בוט") בשרת דורש איסוף מידע משתמש מסוים. המידע הנאסף כולל אך לא מוגבל למזהה הדיסקורד של המשתמש, שם המשתמש בדיסקורד ותפקידי השרת. שימוש בבוט נחשב כקבלת תנאי מדיניות אלה.

  **גישה למידע**
  גישה למידע מותרת רק למפתחי הבוט ולשירותי אירוח ורק בהיקף הנדרש לפיתוח הבוט, בדיקות ויישום תכונות. המידע אינו נמכר, ניתן או משותף עם צד שלישי כלשהו, למעט כנדרש על פי חוק או הסכם תנאי השירות. תוכלו לצפות במידע שלכם לפי בקשה מ[מפתח](%{developer}).

  **אחסון מידע**
  המידע מאוחסן במסד נתונים [MYSQL](https://www.mysql.com/). מסד הנתונים מאובטח למניעת גישה חיצונית. עם זאת, אין ערבויות, ובעל הבוט אינו אחראי לפריצות מידע בלתי מכוונות או זדוניות. אם תהיה גישה לא מורשית למידע, צוות השרת יודיע למשתמשים דרך שרת התמיכה.

  **זכויות משתמש**
  בכל עת, יש לכם את הזכות לבקש לצפות בנתוני חשבון הדיסקורד שלכם. יש לכם את הזכות לבקש מחיקת מידע רלוונטי. לשם כך, על המשתמשים לשלוח בקשה דרך שרת התמיכה.

  **שאלות**
  אם יש לכם שאלות או חששות לגבי המידע שעשוי להיות מאוחסן מחשבונכם, אנא פנו ל[צוות](%{serversupport}). למידע נוסף, עיינו בתנאי השירות של דיסקורד.

### The following terms and conditions apply to the use of the bot.
### terms of services commands
termsofservice_title: "תנאי השירות של %{bot}"
tos_label: "תנאי שירות"
termsofservice_desc: |
  **הסכם שימוש**
  על ידי הזמנת [%{bot}](%{serversupport}) ("בוט") ושימוש בתכונות שלו, אתם מסכימים לתנאי השירות ומדיניות הפרטיות של הבוט.

  אתם מכירים בכך שתוכלו להשתמש בבוט בחופשיות בכל שרת דיסקורד שאתם חולקים אותו. תוכלו להזמין אותו לכל שרת שיש לכם בו זכויות "Manage Server", וזכות זו עשויה להישלל אם תפרו את תנאי השירות או מדיניות הפרטיות של בוט זה או את תנאי השירות, מדיניות הפרטיות או הנחיות הקהילה של Discord Inc.

  באמצעות ההזמנה, הבוט עשוי לאסוף מידע ספציפי כמתואר במדיניות הפרטיות שלו. השימוש המיועד במידע זה הוא עבור הפונקציונליות הליבתית של הבוט, כגון ביצוע פקודות.

  **שיוך**
  הבוט אינו משויך, נתמך או מיוצר על ידי Discord Inc. כל קשר ישיר לדיסקורד או לאובייקטים של סימניהם המסחריים הוא מקרי בלבד. אנחנו לא טוענים לבעלות על זכויות יוצרים על נכסים, סימנים מסחריים או קניין רוחני אחר של דיסקורד.

  **משתמשים קטינים**
  הבוט אינו מורשה לקטינים מתחת לגיל 13 או מתחת לגיל ההסכמה החוקי במדינתם. זה עומד בתנאי השירות של דיסקורד. לא יאוחסן מידע ביודעין ממשתמש קטין. אם יתגלה שמשתמש הוא קטין, ננקוט בכל הפעולות הנדרשות למחיקת המידע המאוחסן.

  **אחריות**
  מפתחי הבוט ובעליו אינם ניתנים לתביעה על הפרת תנאים אלה על ידי אנשים בכל זמן נתון. הזכות לעדכן תנאים אלה שמורה לשיקול דעתנו, עם תקופה של שבוע אחד (7 ימים) לביטול הסכמה לתנאים אלה. משתמש רשאי לבטל הסכמה על ידי הסרת הבוט מכל שרת בו למשתמש יש זכות להסיר את הבוט.
