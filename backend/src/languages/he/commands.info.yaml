### About commands
about_desc1: "**איפה שמי שרוצה לשיר תמיד מוצא שיר ♪\nהצטרפו למנגינה בשרת הדיסקורד שלכם היום!**"
about_desc2: |
  ・קידומת הבוט לשרת זה היא `%{prefix}`
  ・שנו קידומת עם `%{prefix} prefix <new prefix>`
  ・הפעילו שיר לפי קישור או מונח חיפוש `%{prefix} play`
  בקרו ב**[אתר](%{website})** שלנו או השתמשו בפקודה `%{prefix} help` לפקודות נוספות.
about_desc3: |
  **שימו לב!**
  אני מעדיף הרשאות `Administrator`, אבל...
  גם אם לא תתנו לי את ההרשאות האלה, אני עדיין יכול לעבוד, אבל ייתכן שלא אוכל לעשות הכל. רק אומר!

  **עזרה ותמיכה**
  הצטרפו ל**[שרת התמיכה](%{serversupport})** שלנו אם אתם צריכים עזרה, רוצים לקבל מידע על עדכונים ובעיות או רוצים להשתתף בקהילה!

