## RULES Events ##
rules_title: "חוקי השרת לקהילת %{guild}!"
rules_desc: |
  - **כבדו אחרים**
    תמיד עקבו אחרי [תנאי השימוש](https://discord.com/terms) ו[ההנחיות](https://discord.com/guidelines) של דיסקורד.
  - **קוד עזרה**
    כשאתם מבקשים עזרה, ודאו לספק כמה שיותר פרטים עם שגיאות.
  - **אין שיח שנאה או הטרדה**
    אין שיחות המכילות שיח שנאה או הטרדה כלפי אנשים או קבוצות.
  - **אין טרולינג או הסתה**
    אין פעולות שנועדו לשבש או לעורר קונפליקטים בכל צורה שהיא.
  - **כבדו קניין רוחני**
    כבדו זכויות קניין רוחני, כולל אך לא מוגבל לזכויות יוצרים, סימנים מסחריים ופטנטים.
  - **אין ספוילרים ללא אזהרה**
    אם דנים בתוכן שעדיין לא נצפה על ידי כל החברים, ספקו אזהרות ספוילר כדי למנוע אכזבה.
  - **השתמשו בערוצים מתאימים**
    השתמשו בערוצים רלוונטיים לנושאים ספציפיים, הימנעו מדיונים שלא קשורים בערוצים לא רלוונטיים.
  - **אין שימוש מוגזם באותיות גדולות או ספאם**
    הימנעו משימוש מוגזם באותיות גדולות או שליחת הודעות חוזרות במהירות.
  - **שמרו על ערוצי קול נקיים**
    אם משתמשים בערוצי קול, ודאו שאין רעש משבש ודברו בנימוס.
  - **אין בוטים או אוטומציה לא מורשים**
    רק בוטים שאושרו על ידי מנהלים מורשים לפעול בשרת.
  - **דווחו על הפרות**
    אם אתם עדים להפרת חוקים, דווחו למנהל או אדמין.
  - **תהנו!**
    הדבר החשוב ביותר, תהנו מהזמן שלכם בשרת זה על ידי כיבוד כל החברים ושמירה על סביבה חיובית.

  תודה שהצטרפתם, מקווים שתהנו כאן.

