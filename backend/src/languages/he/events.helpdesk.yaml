### BUTTON HELPDESK 1 ###
helpdesk1_title: "מי שרוצה לשיר תמיד מוצא שיר ♪"
helpdesk1_desc: |
  **%{bot} הוא בוט דיסקורד שמחולל מהפכה בחוויית המוזיקה שלכם בדיסקורד, ומציע את הממשק הנקי ביותר, אודיו באיכות גבוהה, ומגוון רחב של תכונות מוזיקליות.**

  **למה %{bot}?**
  - **עדכונים שוטפים**: %{bot} מתעדכן כל הזמן, ומבטיח שתמיד תקבלו את המיטב של התכונות והתיקונים האחרונים.
  - **תכונות מקיפות**: מערכת המוזיקה הפשוטה של %{bot} מאפשרת השמעה חלקה ממקורות מרובים.
  - **קהילת תמיכה ייעודית**: אנחנו בוט חדש יחסית בדיסקורד, ונשמח שתצטרפו אלינו! להבטיח שהבוט פועל בצורה חלקה היא העדיפות שלנו, ולכן אנחנו צריכים את עזרתכם עם משוב והצעות. אם יש לכם שאלות, אל תהססו לפתוח כרטיס תמיכה.

  **קישורים שימושיים**
  - %{server}
  - %{vote}
  - %{website}
  - %{premium}

  **צריכים תמיכה?**
  - שלחו כרטיס לקבלת סיוע נוסף

  **מה אתם מחכים? הזמינו את %{bot} לשרת הדיסקורד שלכם היום ותהנו מחוויית מוזיקה חסרת תקדים וללא הגבלות!**
  **[לחצו כאן להזמנה](%{invite})**

helpdesk2_title: "הוספת %{bot} לשרת שלכם"
helpdesk2_desc: |
  **תוכלו להזמין את %{bot} באמצעות [קישור](%{invite}) זה.**
    בחרו את השרת שאליו רוצים להוסיף ולחצו על **Authorize**

  > שימו לב שאם תשביתו הרשאות `Administrator` עבור %{bot}, זה עלול להשפיע על הפונקציונליות. למרות שעדיין תוכלו לגשת לתכונות מוזיקה בסיסיות, חלק מהפונקציות עשויות לא לעבוד כראוי.

helpdesk3_title: "איך להשתמש בבוט המוזיקה %{bot}?"
helpdesk3_desc: |
  הצטרפו לערוץ קולי או ערוץ במה ואז הקלידו /play <שם שיר/קישור> בערוץ טקסט.
  תוכלו לתקשר ישירות באמצעות כפתורי השליטה לעצירה, לופ וכו'.
  הקלידו / (או /help) ובחרו את הסמל של %{bot} כדי לקבל רשימה של כל הפקודות הזמינות.

helpdesk4_title: "איך להפעיל את תכונת 24/7?"
helpdesk4_desc: |
  הצטרפו לערוץ קולי או ערוץ במה ואז הקלידו `/247 <enable/disable>` בערוץ טקסט.

  **הערה:** *ניתן להשתמש בתכונה זו אם יש לכם הרשאת `manage server`, ומובטח מראש שהבוט מנגן מוזיקה כרגע.*

helpdesk5_title: "%{bot} לא מגיב/לא מחובר"
helpdesk5_desc: |
  אתם מנסים להשתמש בפקודה אבל זה ממשיך להיכשל? ובכן, כנראה שהוא לא מצליח לענות, אבל עקבו אחרי הצעדים הבאים כדי לתקן את זה.

  **%{bot} משתמש כעת בפקודות סלאש!**
  ודאו שאתם משתמשים בפקודות סלאש כי דיסקורד דורש כעת מכל הבוטים להשתמש בהן.
  התחילו על ידי הקלדת `/play` ו-`/help`

  **%{bot} עדיין לא מגיב?**
  התרחיש היחיד שנותר במצב זה הוא בעיה מצד דיסקורד או מצדנו. ודאו ש-%{bot} אינו מנותק בשרת שלכם. אם הוא מנותק, הדבר הטוב ביותר הוא לחכות עד 5 דקות ולראות אם %{bot} חוזר למצב מחובר. אם הוא מחובר, יש לו את כל ההרשאות הנדרשות, בהחלט כדאי ליצור קשר עם אחד מאנשי התמיכה שלנו.

helpdesk6_title: "איכות השמע של %{bot} נשמעת מגומגמת"
helpdesk6_desc: |
  אף אחד לא אוהב מוזיקה מגומגמת, אבל זה קורה לפעמים כשמאזינים לבוטי מוזיקה בדיסקורד. הנה כמה פתרונות אפשריים שיעזרו לכם לתקן את זה.

  **מה עלי לעשות?**
  קודם כל כדאי לבדוק את חיבור האינטרנט שלכם. דיסקורד מציג את הפינג האחרון והממוצע שלכם בפינה השמאלית התחתונה, פשוט לחצו על "Voice Connected" וודאו שהפינג שלכם יציב (אם הגרף האדום מגמגם הרבה זה אומר שהוא לא יציב!) והפינג האחרון וגם הממוצע נמוך מ-250 אלפיות השנייה. אם שני המדדים מראים שהחיבור שלכם גרוע, כדאי לבדוק את ה-WiFi/LAN שלכם. הפעלה מחדש של הנתב עשויה גם לפתור כמה בעיות.

  **יש לכם פינג של 5ms ואתם יכולים להוריד GTA 5 ב-2 דקות?**
  אז חיבור האינטרנט שלכם לא נראה כבעיה. ב-95% מהמקרים בהם %{bot} מגמגם, לדיסקורד יש בעיות זמניות עם שרתי הקול שלהם. בדרך כלל הם פשוט מפעילים אותם מחדש בשלב מסוים אבל תוכלו לכפות מעבר לשרת אחר באזור שלכם. [נסו להחליף את אזור השרת](https://support.discord.com/hc/en-us/articles/1500007645701-Voice-Regions-on-Discord-FAQ#h_01F3RXJ4YCHYS652ETKWJ499Y3) כדי לקבל שרת קול חדש ורענן של דיסקורד.
  אם עדיין יש לכם את אותה בעיה, אל תהססו להקליד /report לדווח על הבעיה שלכם.

helpdesk7_title: "איך להגדיר ערוץ בקשות שירים?"
helpdesk7_desc: |
  **איך יוצרים ערוץ בקשות?**
  ודאו ש-%{bot} קיבל הרשאת `manage server` ואז הקלידו /setup עם אפשרות `create` ואז הבוט ייצור אוטומטית ערוץ מיוחד לבקשות שירים.

  ```הערה: אל תמחקו הודעות ש-%{bot} יצר כדי שאוכל לפעול כראוי.```

  **איך מוחקים ערוץ בקשות?**
  כמו קודם, רק באפשרויות תוכלו לבחור `delete`.

helpdesk8_title: "%{bot} ממשיך לומר שחסרות לו הרשאות."
helpdesk8_desc: |
  כשמנסים להריץ פקודות מסוימות, ל-%{bot} עלולות לחסור הרשאות מסוימות. במקרים כאלה, %{bot} יסרב להריץ את הפקודה עד שבעיות אלה ייפתרו. חשוב לציין שהרשאות אלה אינן אופציונליות; %{bot} זקוק להן כדי לבצע את הפקודה.

  אם אתם מאמינים שלבוט יש את ההרשאות הנדרשות, ודאו שבדקתם את דריסות התפקידים בערוץ. דריסות אלה יכולות לשנות הרשאות תפקידים בערוצים ספציפיים.

  אם עדיין אינכם מצליחים לקבוע מדוע ל-%{bot} אין את ההרשאות הנדרשות, שקלו לתת ל-%{bot} הרשאת Administrator. זה אמור לפתור כל בעיית הרשאות בדיסקורד.

helpdesk9_title: "Mewwme מתנתק מערוץ הקול בעצמו"
helpdesk9_desc: |
  במקרים נדירים מאוד, גם עם מצב 24/7 מופעל, Mewwme עלול להתנתק מערוץ הקול ללא שמישהו משתמש ב-/stop או בכפתור ניתוק של דיסקורד. כמה מהסיבות הנפוצות ביותר ותיקון אפשרי מפורטים להלן.

  **מצב 24/7 אינו מופעל.**
  כברירת מחדל, Mewwme מתנתק מערוץ הקול כשהוא ריק תוך 3 דקות.

  **תיקון:** עיינו ב-"4. איך להפעיל את תכונת 24/7?" באמבד העזרה הראשון כדי להפעיל את מצב 24/7.

  **הרשאות חסרות.**
  בכל פעם שדיסקורד מבקש מאיתנו להתחבר מחדש לערוץ קולי, בין אם בגלל הפעלה מחדש של שרת או הפסקת API, אנחנו בודקים שוב את הרשאות הבוט כדי לוודא שהוא יכול להצטרף ולדבר בערוץ. אם משהו חסר, תצטרכו להשתמש ב-/play שוב כדי להזמין את הבוט לערוץ אחר או לאותו ערוץ לאחר הוספת ההרשאות הנדרשות.

  **תיקון:** ודאו להשתמש בפקודות /play כדי להוסיף את הבוט לערוץ הקולי במקום להעביר אותו מערוץ אחר. על ידי כך, תבטיחו שלבוט יש את כל ההרשאות הנדרשות להתחברות מחדש בעת הצורך.

  **בעיות אזור שרת.**
  במקרים מסוימים, חלק מאזורי הקול עלולים לחוות בעיות רשת ויציבות שעשויות למנוע מהבוט להצטרף לערוץ הקולי.

  **תיקון:** עברו לאזור קול אחר באמצעות הגדרות ערוץ הקול (בחרו את הקרוב ביותר למדינה שלכם).

  **משהו אחר השתבש.**
  אם ניסיתם את כל התיקונים למעלה והבעיה נמשכת, אנא הקלידו `report` או פתחו כרטיס בתמיכה https://discord.com/channels/1088032923443277824/1169558722738147378

helpdesk10_title: "איך מקבלים/מפעילים פרימיום ומה ההטבות?"
helpdesk10_desc: |
  **איך לממש את הטבות הפרימיום שלי?**

  כדי להפעיל את הטבות חברות הפרימיום שלכם, אנא עקבו אחרי הצעדים הבאים:
  1. **קשרו את חשבון הדיסקורד שלכם תחילה**
    - לפני הרכישה, ודאו שחשבון הדיסקורד שלכם מחובר לפלטפורמה שאתם משתמשים בה (patreon או ko-fi).
    - זה נדרש כדי שהמערכת תוכל לזהות את התשלום שלכם אוטומטית.
  2. **רכשו את החברות**
  - לאחר קישור הדיסקורד, השלימו את תשלום החברות לפי התוכנית שאתם רוצים.
  3. **המתינו לסנכרון**
    - לאחר שהתשלום יצליח, אנא המתינו כמה דקות שהמערכת תסנכרן את החברות שלכם.
  4. **מימשו פרימיום בשרת שלכם**
    - עברו לשרת הדיסקורד שאתם רוצים לשדרג, ואז השתמשו בפקודה:
      `/premium claim`
      בחרו את אפשרות הפלטפורמה הנכונה (patreon או ko-fi) כשתתבקשו.
      ודאו שאתם מריצים את הפקודה בתוך השרת שאתם רוצים להפעיל בו פרימיום.
      לאחר המימוש, הפרימיום יופעל מיידית.

  על ידי מעקב אחר הצעדים למעלה, תוכלו להפעיל וליהנות מכל הטבות הפרימיום המוצעות. אם נתקלתם בבעיות או שיש לכם שאלות נוספות, אל תהססו לפנות לצוות התמיכה שלנו.

helpdesk10_footer: "תודה שאתם חלק מהמסע שלנו!, מקווים שתהנו כאן."
