## RULES Events ##
rules_title: "\u00a1Reglas del Servidor para la Comunidad de %{guild}!"
rules_desc: |
  - **S\u00e9 respetuoso**
    Sigue siempre los [T\u00e9rminos de Servicio](https://discord.com/terms) y las [Directrices](https://discord.com/guidelines) de Discord.
  - **C\u00f3digo de Ayuda**
    Cuando pidas ayuda, aseg\u00farate de proporcionar el mayor detalle posible con los errores.
  - **Sin Discurso de Odio ni Acoso**
    No se permiten conversaciones que contengan discurso de odio o acoso hacia individuos o grupos.
  - **Sin Trolleo ni Provocaciones**
    No se permiten acciones destinadas a interrumpir o provocar conflictos de ninguna manera.
  - **Respeta la Propiedad Intelectual**
    Respeta los derechos de propiedad intelectual, incluyendo pero no limitado a derechos de autor, marcas registradas y patentes.
  - **Sin Spoilers Sin Advertencia**
    Si se discute contenido que a\u00fan no ha sido consumido por todos los miembros, proporciona advertencias de spoiler para evitar decepciones.
  - **Usa los Canales Apropiados**
    Usa los canales relevantes para temas espec\u00edficos, evita discusiones fuera de tema en canales no relacionados.
  - **Sin May\u00fasculas Excesivas ni Spam**
    Evita el uso excesivo de letras may\u00fasculas o env\u00edo de mensajes repetidos r\u00e1pidamente.
  - **Mant\u00e9n los Canales de Voz Limpios**
    Si usas canales de voz, aseg\u00farate de que no haya ruido disruptivo y habla con educaci\u00f3n.
  - **Sin Bots o Automatizaci\u00f3n No Autorizados**
    Solo los bots autorizados por los moderadores pueden operar en el servidor.
  - **Reporta Violaciones**
    Si presencias violaciones de reglas, rep\u00f3rtalas a un moderador o administrador.
  - **\u00a1Divi\u00e9rtete!**
    Lo m\u00e1s importante, disfruta tu tiempo en este servidor respetando a todos los miembros y manteniendo un ambiente positivo.

  Gracias por unirte, esperamos que la pases bien aqu\u00ed.

