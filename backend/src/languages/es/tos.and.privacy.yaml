### privacy policy commands
privacy_title: "Pol\u00edtica de Privacidad de %{bot}"
privacy_label: Pol\u00edtica de Privacidad
privacy_desc: |
  **Acuerdo de Usuario**
  El uso de [%{bot}](%{serversupport}) ("bot") en el servidor requiere la recopilaci\u00f3n de ciertos datos del usuario. Los datos recopilados incluyen, pero no se limitan a, el ID de Discord del usuario, el nombre de usuario de Discord y los roles del servidor. El uso del Bot se considera aceptaci\u00f3n de estos t\u00e9rminos de la pol\u00edtica.

  **Acceso a los Datos**
  El acceso a los datos solo est\u00e1 permitido para los desarrolladores del bot y los servicios de alojamiento, y solo dentro del alcance necesario para el desarrollo, pruebas e implementaci\u00f3n de funciones del bot. Los datos no se venden, entregan ni comparten con terceros, excepto seg\u00fan lo requiera la ley o el acuerdo de T\u00e9rminos de Servicio. Puedes ver tus datos previa solicitud al [desarrollador](%{developer}).

  **Almacenamiento de Datos**
  Los datos se almacenan en la base de datos [MYSQL](https://www.mysql.com/). La base de datos est\u00e1 protegida para prevenir el acceso externo. Sin embargo, no se proporcionan garant\u00edas, y el propietario del Bot no es responsable de filtraciones de datos no intencionales o maliciosas. Si hay acceso no autorizado a los datos, el personal del servidor notificar\u00e1 a los usuarios a trav\u00e9s del Servidor de Soporte.

  **Derechos del Usuario**
  En cualquier momento, tienes derecho a solicitar ver los datos de tu cuenta de Discord. Tienes derecho a solicitar la eliminaci\u00f3n de los datos relevantes. Para hacerlo, los usuarios deben enviar una solicitud a trav\u00e9s del Servidor de Soporte.

  **Preguntas**
  Si tienes preguntas o inquietudes sobre qu\u00e9 datos pueden estar almacenados de tu cuenta, por favor contacta al [personal](%{serversupport}). Para m\u00e1s informaci\u00f3n, consulta los T\u00e9rminos de Servicio de Discord.

### The following terms and conditions apply to the use of the bot.
### terms of services commands
termsofservice_title: "T\u00e9rminos de Servicio de %{bot}"
tos_label: "T\u00e9rminos de Servicio"
termsofservice_desc: |
  **Acuerdo de Uso**
  Al invitar a [%{bot}](%{serversupport}) ("bot") y usar sus funciones, aceptas los T\u00e9rminos de Servicio y la Pol\u00edtica de Privacidad del bot.

  Reconoces que puedes usar el bot libremente en cualquier Servidor de Discord en el que lo compartas. Puedes invitarlo a cualquier Servidor en el que tengas derechos de "Gestionar Servidor", y este privilegio puede ser revocado si est\u00e1s sujeto a violar los t\u00e9rminos de servicio o la pol\u00edtica de privacidad de este bot o los T\u00e9rminos de Servicio, Pol\u00edtica de Privacidad o Directrices de la Comunidad de Discord Inc.

  A trav\u00e9s de la invitaci\u00f3n, el bot puede recopilar datos espec\u00edficos como se describe en su Pol\u00edtica de Privacidad. El uso previsto de estos datos es para las funcionalidades principales del bot, como la ejecuci\u00f3n de comandos.

  **Afiliaci\u00f3n**
  El bot no est\u00e1 afiliado, respaldado ni creado por Discord Inc. Cualquier conexi\u00f3n directa con Discord o cualquiera de sus objetos de marca registrada es puramente coincidencia. No reclamamos propiedad de derechos de autor sobre los activos, marcas registradas u otra propiedad intelectual de Discord.

  **Usuarios menores de edad**
  El bot no est\u00e1 permitido para menores de 13 a\u00f1os o menores de la edad de consentimiento legal de su pa\u00eds. Esto cumple con los T\u00e9rminos de Servicio de Discord. No se almacenar\u00e1 informaci\u00f3n de un usuario menor de edad a sabiendas. Si se descubre que un usuario es menor de edad, tomaremos todas las acciones necesarias para eliminar los datos almacenados.

  **Responsabilidad**
  Los desarrolladores y el propietario del bot no podr\u00e1n ser responsabilizados por personas que incumplan estos T\u00e9rminos en cualquier momento. El derecho de actualizar estos t\u00e9rminos est\u00e1 reservado a nuestra discreci\u00f3n, otorgando un per\u00edodo de 1 Semana (7 d\u00edas) para desistir de estos t\u00e9rminos. Un usuario puede desistir eliminando el bot de cualquier servidor donde tenga el derecho de eliminar el bot.
