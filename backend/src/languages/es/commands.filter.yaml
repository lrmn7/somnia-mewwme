### Equalizer command!
eq_author: "Ecualizador"
eq_icon: "https://i.pinimg.com/originals/cb/17/b8/cb17b80a942d7c317a35ff1324fae12f.gif"
eq_desc: |
  Hay **10 Bandas** que se pueden configurar de **-10** a **10**.
  No tienes que introducir todas, solo las que quieras cambiar.
  Si quieres saltar una, puedes dejarla como **0**.
eq_field_title: "Ejemplo:"
eq_field_value: "%{prefix}eq 2 3 0 8 0 5 0 -5 0 0"
eq_footer: "Restablecer Ecualizador \u2022 %{prefix}eq reset"
eq_on: "\u00a1El EQ se ha configurado en **%{bands}**!"
eq_number: "\u00a1Por favor proporciona un n\u00famero v\u00e1lido!"
eq_greater: "El n\u00famero debe ser mayor que **-10**"
eq_than: "El n\u00famero debe ser menor que **10**"

