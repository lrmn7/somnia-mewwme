## RULES Events ##
rules_title: "Правила сервера сообщества %{guild}!"
rules_desc: |
  - **Будьте уважительны**
    Всегда соблюдайте [Условия использования](https://discord.com/terms) и [Правила сообщества](https://discord.com/guidelines) Discord.
  - **Код помощи**
    Когда вы просите помощь, предоставляйте как можно больше деталей и описания ошибок.
  - **Без разжигания ненависти и домогательств**
    Запрещены разговоры, содержащие ненависть или домогательства в отношении отдельных лиц или групп.
  - **Без троллинга и провокаций**
    Запрещены действия, направленные на нарушение порядка или провоцирование конфликтов.
  - **Уважайте интеллектуальную собственность**
    Уважайте права интеллектуальной собственности, включая авторские права, товарные знаки и патенты.
  - **Без спойлеров без предупреждения**
    Если обсуждаете контент, который ещё не все участники видели, используйте предупреждения о спойлерах.
  - **Используйте подходящие каналы**
    Используйте соответствующие каналы для конкретных тем, избегайте обсуждений не по теме в нерелевантных каналах.
  - **Без чрезмерного использования заглавных букв и спама**
    Избегайте чрезмерного использования заглавных букв и быстрой отправки повторяющихся сообщений.
  - **Соблюдайте порядок в голосовых каналах**
    При использовании голосовых каналов убедитесь, что нет постороннего шума, и говорите вежливо.
  - **Без неавторизованных ботов и автоматизации**
    На сервере разрешены только боты, авторизованные модераторами.
  - **Сообщайте о нарушениях**
    Если вы стали свидетелем нарушения правил, сообщите об этом модератору или администратору.
  - **Получайте удовольствие!**
    Самое главное — наслаждайтесь временем на этом сервере, уважая всех участников и поддерживая позитивную атмосферу.

  Спасибо, что присоединились, надеемся, вам здесь понравится.

