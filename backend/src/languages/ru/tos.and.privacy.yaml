### privacy policy commands
privacy_title: "Политика конфиденциальности %{bot}"
privacy_label: Политика конфиденциальности
privacy_desc: |
  **Пользовательское соглашение**
  Использование [%{bot}](%{serversupport}) («бот») на сервере требует сбора определённых пользовательских данных. Собираемые данные включают, но не ограничиваются: Discord ID пользователя, имя пользователя Discord и роли на сервере. Использование бота считается принятием условий данной политики.

  **Доступ к данным**
  Доступ к данным разрешён только разработчикам бота и хостинг-сервисам и только в рамках, необходимых для разработки, тестирования и реализации функций бота. Данные не продаются, не передаются и не предоставляются третьим лицам, за исключением случаев, предусмотренных законом или Условиями использования. Вы можете просмотреть свои данные по запросу к [разработчику](%{developer}).

  **Хранение данных**
  Данные хранятся в базе данных [MYSQL](https://www.mysql.com/). База данных защищена от внешнего доступа. Однако гарантии не предоставляются, и владелец бота не несёт ответственности за непреднамеренные или злонамеренные утечки данных. В случае несанкционированного доступа к данным персонал сервера уведомит пользователей через сервер поддержки.

  **Права пользователей**
  В любое время вы имеете право запросить просмотр данных вашего аккаунта Discord. Вы имеете право запросить удаление соответствующих данных. Для этого пользователи должны отправить запрос через сервер поддержки.

  **Вопросы**
  Если у вас есть вопросы или сомнения по поводу того, какие данные могут храниться из вашего аккаунта, свяжитесь с [персоналом](%{serversupport}). Для получения дополнительной информации ознакомьтесь с Условиями использования Discord.

### The following terms and conditions apply to the use of the bot.
### terms of services commands
termsofservice_title: "Условия использования %{bot}"
tos_label: "Условия использования"
termsofservice_desc: |
  **Соглашение об использовании**
  Приглашая [%{bot}](%{serversupport}) («бот») и используя его функции, вы соглашаетесь с Условиями использования и Политикой конфиденциальности бота.

  Вы подтверждаете, что можете свободно использовать бота на любом сервере Discord, к которому у вас есть доступ. Вы можете пригласить его на любой сервер, на котором у вас есть право «Управление сервером», и эта привилегия может быть отозвана, если вы нарушите условия использования или политику конфиденциальности этого бота, либо Условия использования, Политику конфиденциальности или Правила сообщества Discord Inc.

  При приглашении бот может собирать определённые данные, описанные в его Политике конфиденциальности. Эти данные предназначены для основных функций бота, таких как выполнение команд.

  **Аффилиация**
  Бот не связан с Discord Inc., не поддерживается и не создан ею. Любая прямая связь с Discord или любыми его объектами товарных знаков является чисто случайной. Мы не заявляем авторских прав на активы, товарные знаки или иную интеллектуальную собственность Discord.

  **Несовершеннолетние пользователи**
  Бот запрещён для использования несовершеннолетними в возрасте до 13 лет или не достигшими возраста согласия в их стране. Это соответствует Условиям использования Discord. Данные несовершеннолетних пользователей сознательно не хранятся. Если будет обнаружено, что пользователь является несовершеннолетним, мы предпримем все необходимые действия для удаления сохранённых данных.

  **Ответственность**
  Разработчики и владелец бота не несут ответственности за нарушение данных Условий отдельными лицами. Мы оставляем за собой право обновлять данные условия по своему усмотрению, предоставляя 1-недельный (7 дней) период для отказа от этих условий. Пользователь может отказаться, удалив бота с любого сервера, на котором он имеет право удалить бота.
