### About commands
about_desc1: "**Там, где желающие петь, всегда находят песню ♪\nПрисоединяйтесь к мелодии на вашем сервере Discord уже сегодня!**"
about_desc2: |
  ・Префикс бота для этого сервера: `%{prefix}`
  ・Изменить префикс: `%{prefix} prefix <новый префикс>`
  ・Воспроизвести трек по ссылке или поисковому запросу: `%{prefix} play`
  Посетите наш **[сайт](%{website})** или используйте команду `%{prefix} help` для просмотра всех команд.
about_desc3: |
  **Обратите внимание!**
  Желательно предоставить мне права `Администратора`, но...
  Даже без этих прав я смогу работать, но некоторые функции могут быть недоступны. Просто имейте в виду!

  **Помощь и поддержка**
  Присоединяйтесь к нашему **[серверу поддержки](%{serversupport})**, если вам нужна помощь, хотите узнать об обновлениях и проблемах или хотите пообщаться с сообществом!

