### BUTTON HELPDESK 1 ###
helpdesk1_title: "Там, где желающие петь, всегда находят песню ♪"
helpdesk1_desc: |
  **%{bot} — это бот для Discord, который революционизирует ваш музыкальный опыт, предлагая чистый интерфейс, высококачественное аудио и широкий спектр музыкальных функций.**

  **Почему %{bot}?**
  - **Регулярные обновления**: %{bot} постоянно обновляется, обеспечивая вам доступ к новейшим функциям и исправлениям.
  - **Полный набор функций**: Простая музыкальная система %{bot} обеспечивает плавное воспроизведение из множества источников.
  - **Преданное сообщество поддержки**: Мы относительно новый бот в Discord, и мы будем рады, если вы присоединитесь к нам! Обеспечение бесперебойной работы бота — наш приоритет, поэтому нам нужна ваша помощь с отзывами и предложениями. Если у вас есть вопросы, не стесняйтесь открыть тикет поддержки.

  **Полезные ссылки**
  - %{server}
  - %{vote}
  - %{website}
  - %{premium}

  **Нужна поддержка?**
  - Отправьте тикет для получения дополнительной помощи

  **Чего вы ждёте? Пригласите %{bot} на ваш сервер Discord уже сегодня и наслаждайтесь непревзойдённым, безграничным музыкальным опытом!**
  **[Нажмите здесь, чтобы пригласить](%{invite})**

helpdesk2_title: "Добавление %{bot} на ваш сервер"
helpdesk2_desc: |
  **Вы можете пригласить %{bot} по этой [ссылке](%{invite}).**
    Выберите сервер, на который хотите добавить бота, и нажмите **Авторизовать**

  > Обратите внимание: если вы отключите права `Администратора` для %{bot}, это может повлиять на его функциональность. Хотя базовые музыкальные функции останутся доступны, некоторые возможности могут работать некорректно.

helpdesk3_title: "Как использовать музыкального бота %{bot}?"
helpdesk3_desc: |
  Присоединитесь к голосовому каналу или сцене, затем введите /play <название песни/URL> в текстовом канале.
  Вы можете взаимодействовать напрямую с помощью кнопок управления: стоп, повтор и т.д.
  Введите / (или /help) и выберите значок %{bot}, чтобы увидеть список всех доступных команд.

helpdesk4_title: "Как включить функцию 24/7?"
helpdesk4_desc: |
  Присоединитесь к голосовому каналу или сцене, затем введите `/247 <enable/disable>` в текстовом канале.

  **Примечание:** *Эта функция доступна при наличии права `управление сервером`, и необходимо предварительно убедиться, что бот в данный момент воспроизводит музыку.*

helpdesk5_title: "%{bot} не отвечает/не в сети"
helpdesk5_desc: |
  Вы пытаетесь использовать команду, но она не работает? Возможно, бот не может ответить, но следуйте приведённым ниже шагам, чтобы исправить это.

  **%{bot} теперь использует слэш-команды!**
  Убедитесь, что вы используете слэш-команды, так как Discord теперь требует, чтобы все боты их использовали.
  Начните с ввода `/play` и `/help`

  **%{bot} всё ещё не отвечает?**
  Единственный оставшийся сценарий — проблема на стороне Discord или на нашей стороне. Проверьте, не находится ли %{bot} в офлайне на вашем сервере. Если бот не в сети, лучше всего подождать до 5 минут и проверить, вернётся ли %{bot} в онлайн. Если бот в сети и имеет все необходимые права, вам определённо стоит связаться с одним из наших сотрудников поддержки.

helpdesk6_title: "Качество звука %{bot} с помехами"
helpdesk6_desc: |
  Никто не любит прерывистую музыку, но такое иногда случается при прослушивании музыкальных ботов в Discord. Вот несколько возможных решений.

  **Что мне делать?**
  Прежде всего, проверьте ваше интернет-соединение. Discord отображает ваш последний и средний пинг в левом нижнем углу — просто нажмите на «Голосовое подключение» и убедитесь, что ваш пинг стабилен (если красный график сильно прыгает — значит соединение нестабильно!) и последний, а также средний пинг ниже 250 миллисекунд. Если оба показателя указывают на плохое соединение, проверьте ваш WiFi/LAN. Перезагрузка роутера тоже может помочь.

  **У вас пинг 5мс и вы скачиваете GTA 5 за 2 минуты?**
  Значит, проблема не в вашем интернет-соединении. В 95% случаев, когда %{bot} лагает, у Discord временные проблемы с голосовыми серверами. Обычно они перезагружают их через некоторое время, но вы можете принудительно переключиться на другой сервер в вашем регионе. [Попробуйте сменить регион сервера](https://support.discord.com/hc/en-us/articles/1500007645701-Voice-Regions-on-Discord-FAQ#h_01F3RXJ4YCHYS652ETKWJ499Y3), чтобы получить новый голосовой сервер Discord.
  Если проблема не устранена, используйте /report, чтобы сообщить о проблеме.

helpdesk7_title: "Как настроить канал для запроса песен?"
helpdesk7_desc: |
  **Как создать канал запросов?**
  Убедитесь, что %{bot} имеет право `управление сервером`, затем введите /setup с опцией `create`, и бот автоматически создаст специальный канал для запроса песен.

  ```Примечание: Не удаляйте сообщения, созданные %{bot}, чтобы я мог работать корректно.```

  **Как удалить канал запросов?**
  Как и раньше, только в опциях выберите `delete`.

helpdesk8_title: "%{bot} сообщает об отсутствии прав."
helpdesk8_desc: |
  При попытке выполнить определённые команды %{bot} может не хватать прав. В таких случаях %{bot} откажется выполнять команду, пока проблема не будет решена. Важно отметить, что эти права не являются необязательными — %{bot} нуждается в них для выполнения команды.

  Если вы считаете, что бот имеет необходимые права, проверьте переопределения ролей в канале. Эти переопределения могут изменять права ролей в конкретных каналах.

  Если вы всё ещё не можете определить, почему %{bot} не имеет необходимых прав, рассмотрите возможность предоставления %{bot} права Администратора. Это должно решить все проблемы с правами Discord.

helpdesk9_title: "Mewwme самостоятельно отключается от голосового канала"
helpdesk9_desc: |
  В очень редких случаях, даже при включённом режиме 24/7, Mewwme может отключиться от голосового канала без использования /stop или кнопки «Отключить» в Discord. Вот некоторые наиболее распространённые причины и возможные решения.

  **Режим 24/7 не включён.**
  По умолчанию Mewwme отключается от голосового канала, когда он пуст в течение 3 минут.

  **Решение:** Обратитесь к пункту «4. Как включить функцию 24/7?» в первом справочном сообщении, чтобы включить режим 24/7.

  **Отсутствие прав.**
  Когда Discord просит нас переподключиться к голосовому каналу, будь то из-за перезагрузки сервера или сбоя API, мы повторно проверяем права бота, чтобы убедиться, что он может присоединиться и говорить в канале. Если чего-то не хватает, вам придётся использовать /play снова, чтобы пригласить бота в другой канал или в тот же после добавления необходимых прав.

  **Решение:** Используйте команды /play для добавления бота в голосовой канал вместо перемещения его из другого. Таким образом вы гарантируете, что бот имеет все необходимые права для переподключения при необходимости.

  **Проблемы с регионом сервера.**
  В некоторых случаях определённые голосовые регионы могут испытывать проблемы с сетью и стабильностью, которые не позволяют боту присоединиться к голосовому каналу.

  **Решение:** Переключитесь на другой голосовой регион в настройках голосового канала (выберите ближайший к вашей стране).

  **Что-то ещё пошло не так.**
  Если вы попробовали все вышеуказанные решения и проблема сохраняется, пожалуйста, введите `report` или откройте тикет в поддержке https://discord.com/channels/1088032923443277824/1169558722738147378

helpdesk10_title: "Как получить/активировать Premium и какие бонусы я получу?"
helpdesk10_desc: |
  **Как активировать мои Premium-привилегии?**

  чтобы активировать привилегии premium-подписки, выполните следующие шаги:
  1. **сначала привяжите аккаунт discord**
    - перед покупкой убедитесь, что ваш аккаунт discord привязан к платформе, которую вы используете (patreon или ko-fi).
    - это необходимо для автоматического обнаружения вашего платежа системой.
  2. **оформите подписку**
  - после привязки discord завершите оплату подписки по выбранному плану.
  3. **дождитесь синхронизации**
    - после успешной оплаты подождите несколько минут для синхронизации подписки.
  4. **активируйте premium на вашем сервере**
    - перейдите на сервер discord, который хотите улучшить, и используйте команду:
      `/premium claim`
      выберите правильную платформу (patreon или ko-fi) при запросе.
      убедитесь, что выполняете команду на том сервере, на котором хотите активировать premium.
      после активации premium заработает мгновенно.

  Следуя приведённым выше шагам, вы сможете активировать и наслаждаться всеми преимуществами Premium. Если у вас возникнут проблемы или вопросы, не стесняйтесь обращаться в нашу службу поддержки.

helpdesk10_footer: "Спасибо, что вы с нами! Надеемся, вам здесь понравится."
