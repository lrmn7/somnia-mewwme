### Equalizer command!
eq_author: "Эквалайзер"
eq_icon: "https://i.pinimg.com/originals/cb/17/b8/cb17b80a942d7c317a35ff1324fae12f.gif"
eq_desc: |
  Есть **10 полос**, которые можно настроить от **-10** до **10**.
  Необязательно вводить все — только те, которые хотите изменить.
  Если хотите пропустить одну, просто оставьте её как **0**.
eq_field_title: "Пример:"
eq_field_value: "%{prefix}eq 2 3 0 8 0 5 0 -5 0 0"
eq_footer: "Сбросить эквалайзер • %{prefix}eq reset"
eq_on: "Эквалайзер настроен на **%{bands}**!"
eq_number: "Пожалуйста, введите допустимое число!"
eq_greater: "Число должно быть больше **-10**"
eq_than: "Число должно быть меньше **10**"

