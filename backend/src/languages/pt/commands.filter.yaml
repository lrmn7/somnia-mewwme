### Equalizer command!
eq_author: "Equalizador"
eq_icon: "https://i.pinimg.com/originals/cb/17/b8/cb17b80a942d7c317a35ff1324fae12f.gif"
eq_desc: |
  Existem **10 Bandas** que podem ser definidas de **-10** a **10**.
  Voce nao precisa inserir todas, apenas as que deseja alterar.
  Entao, se quiser pular uma, pode deixar como **0**.
eq_field_title: "Exemplo:"
eq_field_value: "%{prefix}eq 2 3 0 8 0 5 0 -5 0 0"
eq_footer: "Resetar Equalizador • %{prefix}eq reset"
eq_on: "O EQ foi definido para **%{bands}**!"
eq_number: "Por favor, forneca um numero valido!"
eq_greater: "O numero deve ser maior que **-10**"
eq_than: "O numero deve ser menor que **10**"

