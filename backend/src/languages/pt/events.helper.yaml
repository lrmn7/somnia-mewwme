## RULES Events ##
rules_title: "Regras do Servidor para a Comunidade %{guild}!"
rules_desc: |
  - **Seja respeitoso**
    Sempre siga os [Termos de Servico](https://discord.com/terms) e as [Diretrizes](https://discord.com/guidelines) do Discord.
  - **Codigo de Ajuda**
    Quando estiver pedindo ajuda, certifique-se de fornecer o maximo de detalhes possivel com os erros.
  - **Sem Discurso de Odio ou Assedio**
    Nenhuma conversa contendo discurso de odio ou assedio contra individuos ou grupos.
  - **Sem Trollagem ou Provocacoes**
    Nenhuma acao com intencao de perturbar ou provocar conflitos de qualquer forma.
  - **Respeite a Propriedade Intelectual**
    Respeite os direitos de propriedade intelectual, incluindo, mas nao se limitando a, direitos autorais, marcas registradas e patentes.
  - **Sem Spoilers Sem Aviso**
    Se estiver discutindo conteudo ainda nao consumido por todos os membros, forneca avisos de spoiler para evitar decepcoes.
  - **Use os Canais Apropriados**
    Use os canais relevantes para topicos especificos, evite discussoes fora do topico em canais nao relacionados.
  - **Sem Uso Excessivo de Maiusculas ou Spam**
    Evite o uso excessivo de letras maiusculas ou o envio repetido e rapido de mensagens.
  - **Mantenha os Canais de Voz Limpos**
    Se estiver usando canais de voz, garanta que nao haja ruido perturbador e fale educadamente.
  - **Sem Bots ou Automacao Nao Autorizados**
    Apenas bots autorizados pelos moderadores podem operar no servidor.
  - **Denuncie Violacoes**
    Se voce presenciar violacoes das regras, denuncie a um moderador ou administrador.
  - **Divirta-se!**
    O mais importante, aproveite seu tempo neste servidor respeitando todos os membros e mantendo um ambiente positivo.

  Obrigado por se juntar a nos, esperamos que voce tenha um otimo momento aqui.

