### Equalizer command!
eq_author: "Bộ cân bằng"
eq_icon: "https://i.pinimg.com/originals/cb/17/b8/cb17b80a942d7c317a35ff1324fae12f.gif"
eq_desc: |
  Có **10 Dải tần** có thể đặt từ **-10** đến **10**.
  Bạn không cần nhập tất cả, chỉ những dải bạn muốn thay đổi.
  Nếu bạn muốn bỏ qua một dải, bạn có thể để nó là **0**.
eq_field_title: "Ví dụ:"
eq_field_value: "%{prefix}eq 2 3 0 8 0 5 0 -5 0 0"
eq_footer: "Đặt lại bộ cân bằng • %{prefix}eq reset"
eq_on: "EQ đã được đặt thành **%{bands}**!"
eq_number: "Vui lòng cung cấp một số hợp lệ!"
eq_greater: "Số phải lớn hơn **-10**"
eq_than: "Số phải nhỏ hơn **10**"

