### About commands
about_desc1: "**Nơi những ai muốn hát luôn tìm thấy bài hát ♪\nTham gia giai điệu trong máy chủ Discord của bạn ngay hôm nay!**"
about_desc2: |
  ・Tiền tố bot cho máy chủ này là `%{prefix}`
  ・Thay đổi tiền tố bằng `%{prefix} prefix <tiền tố mới>`
  ・Phát bài hát bằng liên kết hoặc từ khóa tìm kiếm `%{prefix} play`
  Truy cập **[website](%{website})** của chúng tôi hoặc sử dụng lệnh `%{prefix} help` để xem thêm các lệnh.
about_desc3: |
  **Lưu ý!**
  Tôi ưu tiên cần quyền `Administrator`, nhưng...
  Ngay cả khi bạn không cấp quyền đó, tôi vẫn hoạt động được, nhưng có thể không làm được mọi thứ tôi có khả năng. Chỉ nói vậy thôi!

  **Trợ giúp và Hỗ trợ**
  Tham gia **[máy chủ hỗ trợ](%{serversupport})** của chúng tôi nếu bạn cần giúp đỡ, muốn nhận thông tin về cập nhật và sự cố hoặc muốn tham gia cộng đồng!

