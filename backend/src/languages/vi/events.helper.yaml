## RULES Events ##
rules_title: "Nội quy máy chủ cho Cộng đồng %{guild}!"
rules_desc: |
  - **Tôn trọng lẫn nhau**
    Luôn tuân thủ [Điều khoản dịch vụ](https://discord.com/terms) và [Nguyên tắc cộng đồng](https://discord.com/guidelines) của Discord.
  - **Mã trợ giúp**
    Khi bạn yêu cầu trợ giúp, hãy cung cấp càng nhiều chi tiết càng tốt cùng với lỗi.
  - **Không phát ngôn thù hận hoặc quấy rối**
    Không có cuộc trò chuyện chứa phát ngôn thù hận hoặc quấy rối đối với cá nhân hoặc nhóm.
  - **Không câu kéo hoặc gây hấn**
    Không có hành động cố tình gây rối hoặc kích động xung đột dưới bất kỳ hình thức nào.
  - **Tôn trọng quyền sở hữu trí tuệ**
    Tôn trọng quyền sở hữu trí tuệ, bao gồm nhưng không giới hạn ở bản quyền, nhãn hiệu và bằng sáng chế.
  - **Không tiết lộ nội dung mà không cảnh báo**
    Nếu thảo luận nội dung chưa được tất cả thành viên xem, hãy cảnh báo spoiler để tránh thất vọng.
  - **Sử dụng đúng kênh**
    Sử dụng các kênh phù hợp cho chủ đề cụ thể, tránh thảo luận lạc đề trong các kênh không liên quan.
  - **Không viết hoa quá mức hoặc spam**
    Tránh sử dụng quá nhiều chữ viết hoa hoặc gửi tin nhắn lặp đi lặp lại nhanh chóng.
  - **Giữ kênh thoại sạch sẽ**
    Nếu sử dụng kênh thoại, đảm bảo không có tiếng ồn gây rối và nói chuyện lịch sự.
  - **Không sử dụng bot hoặc tự động hóa trái phép**
    Chỉ có bot được quản trị viên cho phép mới được hoạt động trên máy chủ.
  - **Báo cáo vi phạm**
    Nếu bạn chứng kiến vi phạm nội quy, hãy báo cáo cho quản trị viên hoặc admin.
  - **Vui vẻ nhé!**
    Quan trọng nhất, hãy tận hưởng thời gian trên máy chủ này bằng cách tôn trọng tất cả thành viên và duy trì môi trường tích cực.

  Cảm ơn bạn đã tham gia, chúng tôi hy vọng bạn sẽ có thời gian vui vẻ ở đây.

