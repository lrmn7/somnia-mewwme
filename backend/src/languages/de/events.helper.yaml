## RULES Events ##
rules_title: "Serverregeln fuer die %{guild} Community!"
rules_desc: |
  - **Sei respektvoll**
    Befolge immer die Discord [Nutzungsbedingungen](https://discord.com/terms) und [Richtlinien](https://discord.com/guidelines).
  - **Hilfecode**
    Wenn du um Hilfe bittest, stelle sicher, dass du so viele Details wie moeglich mit Fehlermeldungen angibst.
  - **Keine Hassrede oder Belaestigung**
    Keine Gespraeche, die Hassrede oder Belaestigung gegenueber Einzelpersonen oder Gruppen enthalten.
  - **Kein Trolling oder Flammen**
    Keine Aktionen, die darauf abzielen, Stoerungen zu verursachen oder Konflikte in irgendeiner Weise zu provozieren.
  - **Geistiges Eigentum respektieren**
    Respektiere die Rechte an geistigem Eigentum, einschliesslich, aber nicht beschraenkt auf Urheberrechte, Marken und Patente.
  - **Keine Spoiler ohne Warnung**
    Wenn du ueber Inhalte diskutierst, die noch nicht von allen Mitgliedern konsumiert wurden, gib Spoiler-Warnungen, um Enttaeuschungen zu vermeiden.
  - **Verwende die richtigen Kanaele**
    Verwende relevante Kanaele fuer bestimmte Themen, vermeide Off-Topic-Diskussionen in nicht verwandten Kanaelen.
  - **Keine uebertriebene Grossschreibung oder Spam**
    Vermeide uebertriebene Verwendung von Grossbuchstaben oder das schnelle Senden wiederholter Nachrichten.
  - **Halte Sprachkanaele frei**
    Wenn du Sprachkanaele verwendest, stelle sicher, dass keine stoerenden Geraesche vorhanden sind und sprich hoeflich.
  - **Keine unautorisierten Bots oder Automatisierung**
    Nur von Moderatoren autorisierte Bots duerfen auf dem Server betrieben werden.
  - **Verstoesse melden**
    Wenn du Regelverstoesse beobachtest, melde sie einem Moderator oder Admin.
  - **Viel Spass!**
    Am wichtigsten ist, geniesse deine Zeit auf diesem Server, indem du alle Mitglieder respektierst und eine positive Atmosphaere aufrechterhaltst.

  Danke fuers Beitreten, wir hoffen, du wirst eine gute Zeit hier haben.

