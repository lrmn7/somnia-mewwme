### Equalizer command!
eq_author: "Equalizer"
eq_icon: "https://i.pinimg.com/originals/cb/17/b8/cb17b80a942d7c317a35ff1324fae12f.gif"
eq_desc: |
  Es gibt **10 Baender**, die von **-10** bis **10** eingestellt werden koennen.
  Du musst nicht alle eingeben, nur die, die du aendern moechtest.
  Wenn du also eines ueberspringen willst, kannst du es einfach als **0** lassen.
eq_field_title: "Beispiel:"
eq_field_value: "%{prefix}eq 2 3 0 8 0 5 0 -5 0 0"
eq_footer: "Equalizer zuruecksetzen • %{prefix}eq reset"
eq_on: "EQ wurde auf **%{bands}** gesetzt!"
eq_number: "Bitte gib eine gueltige Zahl ein!"
eq_greater: "Die Zahl muss groesser als **-10** sein"
eq_than: "Die Zahl muss kleiner als **10** sein"

