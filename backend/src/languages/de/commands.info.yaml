### About commands
about_desc1: "**Wo die, die singen wollen, immer ein Lied finden ♪\nTritt noch heute der Melodie auf deinem Discord-Server bei!**"
about_desc2: |
  ・Bot-Praefix fuer diesen Server ist `%{prefix}`
  ・Praefix aendern mit `%{prefix} prefix <neuer Praefix>`
  ・Spiele einen Track per Link oder Suchbegriff `%{prefix} play`
  Besuche unsere **[Webseite](%{website})** oder verwende den `%{prefix} help` Befehl fuer weitere Befehle.
about_desc3: |
  **Achtung!**
  Ich bevorzuge `Administrator`-Berechtigungen, aber...
  Auch wenn du mir diese Berechtigungen nicht gibst, kann ich trotzdem funktionieren, aber ich kann moeglicherweise nicht alles tun, wozu ich faehig bin. Nur so als Hinweis!

  **Hilfe und Support**
  Tritt unserem **[Support-Server](%{serversupport})** bei, wenn du Hilfe brauchst, Informationen ueber Updates und Probleme erhalten moechtest oder dich mit der Community austauschen willst!

