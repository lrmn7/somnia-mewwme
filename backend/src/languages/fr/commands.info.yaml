### About commands
about_desc1: "**La ou ceux qui souhaitent chanter trouvent toujours une chanson ♪\nRejoignez la melodie dans votre serveur Discord des aujourd'hui !**"
about_desc2: |
  ・Le prefixe du bot pour ce serveur est `%{prefix}`
  ・Changez le prefixe avec `%{prefix} prefix <nouveau prefixe>`
  ・Jouez un morceau par lien ou terme de recherche `%{prefix} play`
  Visitez notre **[site web](%{website})** ou utilisez la commande `%{prefix} help` pour plus de commandes.
about_desc3: |
  **Attention !**
  Je necessite de preference les permissions `Administrateur`, mais...
  Meme si vous ne me donnez pas ces permissions, je peux quand meme fonctionner, mais je ne pourrai peut-etre pas faire tout ce dont je suis capable. C'est tout !

  **Aide et support**
  Rejoignez notre **[serveur de support](%{serversupport})** si vous avez besoin d'aide, souhaitez obtenir des informations sur les mises a jour et les problemes ou si vous voulez interagir avec la communaute !

