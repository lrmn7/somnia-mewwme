### Bassboost command!
bassboost_set: "**Le Bassboost a ete regle a %{amount}dB**"
bassboost_limit: "Veuillez utiliser un nombre entre **-10** et **10**"

### Equalizer command!
eq_author: "Egaliseur"
eq_icon: "https://i.pinimg.com/originals/cb/17/b8/cb17b80a942d7c317a35ff1324fae12f.gif"
eq_desc: |
  Il y a **10 bandes** qui peuvent etre reglees de **-10** a **10**.
  Vous n'avez pas besoin de toutes les renseigner, juste celles que vous voulez modifier.
  Donc si vous voulez en sauter une, vous pouvez simplement la laisser a **0**.
eq_field_title: "Exemple :"
eq_field_value: "%{prefix}eq 2 3 0 8 0 5 0 -5 0 0"
eq_footer: "Reinitialiser l'egaliseur • %{prefix}eq reset"
eq_on: "L'EQ a ete regle sur **%{bands}** !"
eq_number: "Veuillez fournir un nombre valide !"
eq_greater: "Le nombre doit etre superieur a **-10**"
eq_than: "Le nombre doit etre inferieur a **10**"

