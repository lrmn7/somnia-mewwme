## RULES Events ##
rules_title: "Regles du serveur pour la communaute %{guild} !"
rules_desc: |
  - **Soyez respectueux**
    Suivez toujours les [CGU](https://discord.com/terms) et les [Directives](https://discord.com/guidelines) de Discord.
  - **Aide au code**
    Lorsque vous demandez de l'aide, veillez a fournir autant de details que possible avec les erreurs.
  - **Pas de discours haineux ni de harcelement**
    Aucune conversation contenant des discours haineux ou du harcelement envers des individus ou des groupes.
  - **Pas de provocation ni de conflits**
    Aucune action destinee a perturber ou a provoquer des conflits de quelque maniere que ce soit.
  - **Respectez la propriete intellectuelle**
    Respectez les droits de propriete intellectuelle, y compris mais sans s'y limiter les droits d'auteur, les marques et les brevets.
  - **Pas de spoilers sans avertissement**
    Si vous discutez de contenu que tous les membres n'ont pas encore consomme, fournissez des avertissements de spoiler pour eviter toute deception.
  - **Utilisez les canaux appropries**
    Utilisez les canaux pertinents pour des sujets specifiques, evitez les discussions hors sujet dans les canaux non lies.
  - **Pas d'utilisation excessive de majuscules ni de spam**
    Evitez l'utilisation excessive de lettres majuscules ou l'envoi rapide de messages repetes.
  - **Gardez les canaux vocaux clairs**
    Si vous utilisez les canaux vocaux, assurez-vous qu'il n'y a pas de bruit perturbateur et parlez poliment.
  - **Pas de bots ou d'automatisation non autorises**
    Seuls les bots autorises par les moderateurs sont autorises a fonctionner sur le serveur.
  - **Signalez les violations**
    Si vous etes temoin de violations des regles, signalez-les a un moderateur ou un administrateur.
  - **Amusez-vous !**
    Le plus important, profitez de votre temps sur ce serveur en respectant tous les membres et en maintenant un environnement positif.

  Merci de nous avoir rejoints, nous esperons que vous passerez un bon moment ici.

