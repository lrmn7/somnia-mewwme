### Equalizer command!
eq_author: "이퀄라이저"
eq_icon: "https://i.pinimg.com/originals/cb/17/b8/cb17b80a942d7c317a35ff1324fae12f.gif"
eq_desc: |
  **-10**에서 **10**까지 설정할 수 있는 **10개의 밴드**가 있습니다.
  모두 입력할 필요는 없으며, 변경하고 싶은 것만 입력하면 됩니다.
  건너뛰고 싶은 밴드는 **0**으로 남겨두면 됩니다.
eq_field_title: "예시:"
eq_field_value: "%{prefix}eq 2 3 0 8 0 5 0 -5 0 0"
eq_footer: "이퀄라이저 초기화 • %{prefix}eq reset"
eq_on: "EQ가 **%{bands}**(으)로 설정되었습니다!"
eq_number: "유효한 숫자를 입력해주세요!"
eq_greater: "숫자는 **-10**보다 커야 합니다"
eq_than: "숫자는 **10**보다 작아야 합니다"

