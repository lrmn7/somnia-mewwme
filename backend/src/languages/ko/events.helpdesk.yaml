### BUTTON HELPDESK 1 ###
helpdesk1_title: "노래하고 싶은 사람은 항상 노래를 찾습니다 ♪"
helpdesk1_desc: |
  **%{bot}은(는) Discord에서 음악을 경험하는 방식을 혁신하는 Discord 봇으로, 가장 깔끔한 사용자 인터페이스, 고품질 오디오, 다양한 음악 관련 기능을 제공합니다.**

  **왜 %{bot}인가요?**
  - **정기 업데이트**: %{bot}은(는) 지속적으로 업데이트되어 항상 최신 기능과 수정 사항을 제공합니다.
  - **종합적인 기능**: %{bot}의 간편한 음악 시스템으로 여러 소스에서 원활한 재생이 가능합니다.
  - **전담 지원 커뮤니티**: 저희는 Discord에서 비교적 새로운 봇이며, 여러분이 함께해 주시길 바랍니다! 봇이 원활하게 작동하도록 하는 것이 저희의 최우선 과제이며, 피드백과 제안에 도움이 필요합니다. 질문이 있으시면 언제든지 지원 티켓을 열어주세요.

  **유용한 링크**
  - %{server}
  - %{vote}
  - %{website}
  - %{premium}

  **지원이 필요하신가요?**
  - 추가 도움이 필요하시면 티켓을 제출해주세요

  **무엇을 기다리시나요? 오늘 %{bot}을(를) Discord 서버에 초대하고 비할 데 없는 무한한 음악 경험을 즐기세요!**
  **[여기를 클릭하여 초대하기](%{invite})**

helpdesk2_title: "%{bot}을(를) 서버에 추가하기"
helpdesk2_desc: |
  **이 [링크](%{invite})를 사용하여 %{bot}을(를) 초대할 수 있습니다.**
    추가하려는 서버를 선택하고 **승인**을 클릭하세요

  > %{bot}의 `관리자` 권한을 비활성화하면 기능에 영향을 줄 수 있습니다. 기본 음악 기능은 사용할 수 있지만, 일부 기능이 제대로 작동하지 않을 수 있습니다.

helpdesk3_title: "%{bot} 음악 봇을 사용하는 방법은?"
helpdesk3_desc: |
  음성 또는 스테이지 채널에 참여한 후 텍스트 채널에서 /play <노래 이름/URL>을 입력하세요.
  정지, 반복 등의 제어 버튼을 사용하여 직접 상호작용할 수 있습니다.
  / (또는 /help)를 입력하고 %{bot} 아이콘을 선택하면 사용 가능한 모든 명령어 목록을 볼 수 있습니다.

helpdesk4_title: "24/7 기능을 활성화하는 방법은?"
helpdesk4_desc: |
  음성 또는 스테이지 채널에 참여한 후 텍스트 채널에서 `/247 <enable/disable>`을 입력하세요.

  **참고:** *이 기능은 `서버 관리` 권한이 있는 경우 사용할 수 있으며, 봇이 현재 음악을 재생 중이어야 합니다.*

helpdesk5_title: "%{bot}이(가) 응답하지 않거나 오프라인입니다"
helpdesk5_desc: |
  명령어를 사용하려 하는데 계속 실패하나요? 응답할 수 없는 상태일 수 있지만, 아래 단계를 따라 해결해보세요.

  **%{bot}은(는) 이제 슬래시 명령어를 사용합니다!**
  Discord가 모든 봇에 슬래시 명령어 사용을 요구하므로 슬래시 명령어를 사용하고 있는지 확인하세요.
  `/play` 및 `/help`를 입력하여 시작하세요

  **%{bot}이(가) 여전히 응답하지 않나요?**
  이 상황에서 남은 유일한 시나리오는 Discord 또는 저희 측의 문제입니다. 서버에서 %{bot}이(가) 오프라인이 아닌지 확인하세요. 오프라인이라면 최대 5분 정도 기다렸다가 %{bot}이(가) 다시 온라인이 되는지 확인하세요. 온라인이고 필요한 모든 권한이 있다면, 저희 지원팀에 문의하시는 것이 좋습니다.

helpdesk6_title: "%{bot} 오디오 품질이 끊깁니다"
helpdesk6_desc: |
  끊기는 음악은 누구나 싫어하지만, Discord에서 음악 봇으로 음악을 들을 때 가끔 발생합니다. 이를 해결하기 위한 몇 가지 가능한 해결 방법을 소개합니다.

  **어떻게 해야 하나요?**
  먼저 인터넷 연결을 확인하세요. Discord는 왼쪽 하단에 마지막 및 평균 핑을 표시합니다. "음성 연결됨"을 클릭하고 핑이 안정적인지 확인하세요(빨간 그래프가 많이 흔들리면 불안정한 것입니다!). 마지막 핑과 평균 핑이 250밀리초 미만인지 확인하세요. 두 지표가 모두 연결 상태가 좋지 않다고 표시하면 WiFi/LAN을 확인해보세요. 라우터를 재시작하면 일부 문제가 해결될 수 있습니다.

  **5ms 핑에 GTA 5를 2분 안에 다운로드할 수 있다고요?**
  인터넷 연결이 문제가 아닌 것 같습니다. %{bot}이(가) 끊기는 경우의 95%는 Discord의 음성 서버에 일시적인 문제가 있는 것입니다. Discord가 보통 서버를 재시작하지만, [서버 지역을 전환](https://support.discord.com/hc/en-us/articles/1500007645701-Voice-Regions-on-Discord-FAQ#h_01F3RXJ4YCHYS652ETKWJ499Y3)하여 새로운 Discord 음성 서버를 사용할 수 있습니다.
  여전히 같은 문제가 있다면 /report를 입력하여 문제를 보고해주세요.

helpdesk7_title: "노래 요청 채널을 설정하는 방법은?"
helpdesk7_desc: |
  **요청 채널을 만드는 방법은?**
  %{bot}에게 `서버 관리` 권한을 부여한 후 `create` 옵션과 함께 /setup을 입력하면 봇이 자동으로 노래 요청을 위한 특별 채널을 생성합니다.

  ```참고: 정상적인 작동을 위해 %{bot}이(가) 만든 메시지를 삭제하지 마세요.```

  **요청 채널을 삭제하는 방법은?**
  이전과 동일하게 옵션에서 `delete`를 선택하면 됩니다.

helpdesk8_title: "%{bot}이(가) 권한이 없다고 계속 말합니다."
helpdesk8_desc: |
  특정 명령어를 실행하려 할 때 %{bot}에게 특정 권한이 없을 수 있습니다. 이 경우 %{bot}은(는) 이러한 문제가 해결될 때까지 명령어 실행을 거부합니다. 이 권한은 선택 사항이 아니며, %{bot}이(가) 명령어를 수행하는 데 필요합니다.

  봇에 필요한 권한이 있다고 생각되면 채널의 역할 재정의를 확인하세요. 이 재정의는 특정 채널에서 역할 권한을 변경할 수 있습니다.

  여전히 %{bot}에게 필요한 권한이 없는 이유를 알 수 없다면, %{bot}에게 관리자 권한을 부여하는 것을 고려해보세요. 이렇게 하면 모든 Discord 권한 문제가 해결될 것입니다.

helpdesk9_title: "Mewwme가 음성 채널에서 자동으로 나갑니다"
helpdesk9_desc: |
  매우 드문 경우이지만, 24/7 모드가 활성화되어 있어도 /stop이나 Discord의 연결 끊기 버튼을 사용하지 않았는데도 Mewwme가 음성 채널에서 나갈 수 있습니다. 가장 일반적인 원인과 잠재적 해결 방법은 아래에 나열되어 있습니다.

  **24/7 모드가 활성화되지 않았습니다.**
  기본적으로 Mewwme는 3분간 음성 채널이 비어 있으면 나갑니다.

  **해결 방법:** 24/7 모드를 활성화하려면 첫 번째 도움말 임베드의 "4. 24/7 기능을 활성화하는 방법은?"을 참조하세요.

  **권한 누락.**
  Discord가 서버 재시작이나 API 장애로 인해 음성 채널에 재연결을 요청할 때마다, 봇이 채널에 참여하고 말할 수 있는지 권한을 다시 확인합니다. 누락된 권한이 있으면, /play를 사용하여 필요한 권한을 추가한 후 봇을 다른 채널이나 동일한 채널에 초대해야 합니다.

  **해결 방법:** 봇을 다른 채널에서 이동하는 대신 /play 명령어를 사용하여 음성 채널에 추가하세요. 이렇게 하면 필요할 때 봇이 재연결하는 데 필요한 모든 권한이 보장됩니다.

  **서버 지역 문제.**
  일부 음성 지역에서 네트워크 및 안정성 문제가 발생하여 봇이 음성 채널에 참여하지 못할 수 있습니다.

  **해결 방법:** 음성 채널 설정을 사용하여 다른 음성 지역으로 전환하세요(해당 국가에 가장 가까운 지역을 선택하세요).

  **다른 문제가 발생했습니다.**
  위의 모든 해결 방법을 시도했는데도 문제가 지속된다면, `report`를 입력하거나 지원 서버에서 티켓을 열어주세요 https://discord.com/channels/1088032923443277824/1169558722738147378

helpdesk10_title: "프리미엄을 받거나 활성화하는 방법과 어떤 혜택을 받나요?"
helpdesk10_desc: |
  **프리미엄 혜택을 사용하는 방법은?**

  프리미엄 멤버십 혜택을 활성화하려면 다음 단계를 따라주세요:
  1. **먼저 Discord 계정을 연동하세요**
    - 구매하기 전에 사용하는 플랫폼(Patreon 또는 Ko-fi)에 Discord 계정이 연결되어 있는지 확인하세요.
    - 시스템이 결제를 자동으로 감지할 수 있도록 필요합니다.
  2. **멤버십을 구매하세요**
  - Discord를 연동한 후 원하는 플랜에 따라 멤버십 결제를 완료하세요.
  3. **동기화를 기다리세요**
    - 결제가 성공하면 시스템이 멤버십을 동기화하는 데 몇 분 정도 기다려주세요.
  4. **서버에서 프리미엄을 청구하세요**
    - 업그레이드하려는 Discord 서버로 이동한 후 다음 명령어를 사용하세요:
      `/premium claim`
      메시지가 표시되면 올바른 플랫폼 옵션(Patreon 또는 Ko-fi)을 선택하세요.
      프리미엄을 활성화하려는 서버에서 명령어를 실행하세요.
      청구하면 프리미엄이 즉시 활성화됩니다.

  위의 단계를 따르면 제공되는 모든 프리미엄 혜택을 활성화하고 즐길 수 있습니다. 문제가 발생하거나 추가 질문이 있으시면 지원팀에 문의해주세요.

helpdesk10_footer: "저희 여정에 함께해 주셔서 감사합니다! 즐거운 시간 되시길 바랍니다."
