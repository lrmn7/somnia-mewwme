## RULES Events ##
rules_title: "%{guild} 커뮤니티 서버 규칙!"
rules_desc: |
  - **상호 존중**
    항상 Discord [서비스 약관](https://discord.com/terms)과 [가이드라인](https://discord.com/guidelines)을 준수하세요.
  - **도움 요청 시 유의사항**
    도움을 요청할 때는 오류 내용과 함께 가능한 한 자세한 정보를 제공하세요.
  - **혐오 발언 및 괴롭힘 금지**
    개인이나 단체에 대한 혐오 발언이나 괴롭힘이 포함된 대화는 금지됩니다.
  - **트롤링 및 도발 금지**
    어떤 방식으로든 분쟁을 유발하거나 방해하려는 행위는 금지됩니다.
  - **지적 재산권 존중**
    저작권, 상표권, 특허 등 지적 재산권을 존중해주세요.
  - **스포일러 경고 없이 공개 금지**
    모든 멤버가 아직 소비하지 않은 콘텐츠를 논의할 때는 실망을 방지하기 위해 스포일러 경고를 제공하세요.
  - **적절한 채널 사용**
    특정 주제에 맞는 관련 채널을 사용하고, 관련 없는 채널에서 주제와 벗어난 토론을 피하세요.
  - **과도한 대문자 사용 또는 스팸 금지**
    과도한 대문자 사용이나 반복적인 메시지 빠르게 보내기를 피하세요.
  - **음성 채널 청결 유지**
    음성 채널을 사용할 때는 방해가 되는 소음이 없도록 하고 예의 바르게 말하세요.
  - **무단 봇 또는 자동화 금지**
    관리자가 승인한 봇만 서버에서 운영할 수 있습니다.
  - **위반 사항 신고**
    규칙 위반을 목격하면 관리자 또는 운영자에게 신고하세요.
  - **즐기세요!**
    가장 중요한 것은 모든 멤버를 존중하고 긍정적인 환경을 유지하면서 이 서버에서 즐거운 시간을 보내는 것입니다.

  참여해 주셔서 감사합니다. 즐거운 시간 되시길 바랍니다.

