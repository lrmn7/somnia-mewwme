### About commands
about_desc1: "**노래하고 싶은 사람은 항상 노래를 찾습니다 ♪\n오늘 당신의 Discord 서버에서 멜로디에 함께하세요!**"
about_desc2: |
  ・이 서버의 봇 접두사는 `%{prefix}`입니다
  ・접두사 변경은 `%{prefix} prefix <새 접두사>`로 합니다
  ・링크 또는 검색어로 트랙 재생 `%{prefix} play`
  저희 **[웹사이트](%{website})**를 방문하거나 `%{prefix} help` 명령어를 사용하여 더 많은 명령어를 확인하세요.
about_desc3: |
  **참고!**
  가급적 `관리자` 권한이 필요하지만...
  해당 권한을 부여하지 않아도 작동하지만, 일부 기능을 사용하지 못할 수 있습니다. 참고만 해주세요!

  **도움말 및 지원**
  도움이 필요하거나, 업데이트 및 문제에 대한 정보를 얻거나, 커뮤니티에 참여하고 싶다면 저희 **[지원 서버](%{serversupport})**에 참여하세요!

