### privacy policy commands
privacy_title: "%{bot}의 개인정보 처리방침"
privacy_label: 개인정보 처리방침
privacy_desc: |
  **사용자 동의**
  서버에서 [%{bot}](%{serversupport}) ("봇")을 사용하려면 특정 사용자 데이터의 수집이 필요합니다. 수집되는 데이터에는 사용자의 Discord ID, Discord 사용자명, 서버 역할이 포함되지만 이에 국한되지 않습니다. 봇을 사용하는 것은 이 정책 조건에 동의하는 것으로 간주됩니다.

  **데이터 접근**
  데이터 접근은 봇 개발자 및 호스팅 서비스에만 허용되며, 봇 개발, 테스트 및 기능 구현에 필요한 범위 내에서만 허용됩니다. 데이터는 법률이나 서비스 약관에 의해 요구되는 경우를 제외하고 제3자에게 판매, 제공 또는 공유되지 않습니다. [개발자](%{developer})에게 요청하여 데이터를 확인할 수 있습니다.

  **데이터 저장**
  데이터는 [MYSQL](https://www.mysql.com/) 데이터베이스에 저장됩니다. 데이터베이스는 외부 접근을 방지하도록 보호됩니다. 그러나 어떠한 보장도 제공되지 않으며, 봇 소유자는 의도치 않거나 악의적인 데이터 침해에 대해 책임지지 않습니다. 무단 데이터 접근이 발생할 경우, 서버 스태프가 지원 서버를 통해 사용자에게 알립니다.

  **사용자 권리**
  언제든지 Discord 계정 데이터 열람을 요청할 수 있습니다. 관련 데이터의 삭제를 요청할 수 있습니다. 이를 위해 사용자는 지원 서버를 통해 요청을 제출해야 합니다.

  **문의**
  계정에서 어떤 데이터가 저장될 수 있는지에 대한 질문이나 우려 사항이 있으시면 [스태프](%{serversupport})에게 문의해주세요. 자세한 내용은 Discord 서비스 약관을 확인하세요.

### The following terms and conditions apply to the use of the bot.
### terms of services commands
termsofservice_title: "%{bot}의 서비스 이용약관"
tos_label: "서비스 이용약관"
termsofservice_desc: |
  **사용 동의**
  [%{bot}](%{serversupport}) ("봇")을 초대하고 기능을 사용함으로써 봇의 서비스 이용약관 및 개인정보 처리방침에 동의합니다.

  봇을 공유하는 모든 Discord 서버에서 자유롭게 사용할 수 있음을 인정합니다. "서버 관리" 권한이 있는 모든 서버에 초대할 수 있으며, 이 봇의 서비스 이용약관이나 개인정보 처리방침, 또는 Discord Inc.의 서비스 약관, 개인정보 보호 정책, 커뮤니티 가이드라인을 위반하는 경우 이 권한이 취소될 수 있습니다.

  초대를 통해 봇은 개인정보 처리방침에 설명된 특정 데이터를 수집할 수 있습니다. 이 데이터의 사용 목적은 명령어 실행 등 봇의 핵심 기능을 위한 것입니다.

  **제휴**
  봇은 Discord Inc.와 제휴, 지원 또는 제작 관계가 없습니다. Discord 또는 그 상표 객체와의 직접적인 연결은 순전히 우연입니다. Discord의 자산, 상표 또는 기타 지적 재산에 대한 저작권 소유를 주장하지 않습니다.

  **미성년자 사용자**
  봇은 13세 미만 또는 해당 국가의 법적 동의 연령 미만의 미성년자에게는 사용이 허용되지 않습니다. 이는 Discord 서비스 약관을 준수합니다. 미성년자 사용자의 정보는 의도적으로 저장되지 않습니다. 사용자가 미성년자인 것이 발견되면 저장된 데이터를 삭제하기 위해 필요한 모든 조치를 취합니다.

  **책임**
  봇의 개발자 및 소유자는 이 약관을 위반하는 개인에 대해 어떤 시점에서도 책임을 지지 않습니다. 이 약관을 업데이트할 수 있는 권리가 있으며, 1주(7일)의 옵트아웃 기간을 제공합니다. 사용자는 봇을 제거할 수 있는 권한이 있는 모든 서버에서 봇을 제거함으로써 옵트아웃할 수 있습니다.
