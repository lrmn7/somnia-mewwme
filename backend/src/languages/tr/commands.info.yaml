### About commands
about_desc1: "**Sarki soylemek isteyenler her zaman bir sarki bulur ♪\nBugun Discord sunucunuzda melodiye katil!**"
about_desc2: |
  ・Bu sunucu icin bot oneki `%{prefix}`
  ・Oneki degistirmek icin `%{prefix} prefix <yeni onek>` yazin
  ・Baglanti veya arama terimiyle parca cal `%{prefix} play`
  Daha fazla komut icin **[web sitemizi](%{website})** ziyaret edin veya `%{prefix} help` komutunu kullanin.
about_desc3: |
  **Dikkat!**
  Tercihen `Administrator` yetkilerine ihtiyacim var, ama...
  Bu yetkileri vermezseniz bile calisabilirim, ancak yapabilecegim her seyi yapamayabilirim. Sadece soyleyeyim!

  **Yardim ve Destek**
  Yardima ihtiyaciniz varsa, guncellemeler ve sorunlar hakkinda bilgi almak istiyorsaniz veya toplulukla etkilesimde bulunmak istiyorsaniz **[destek sunucumuza](%{serversupport})** katilabilirsiniz!

