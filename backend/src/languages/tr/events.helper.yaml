## RULES Events ##
rules_title: "%{guild} Toplulugu Sunucu Kurallari!"
rules_desc: |
  - **Saygilii olun**
    Her zaman Discord [Hizmet Sartlari](https://discord.com/terms) ve [Yonergelere](https://discord.com/guidelines) uyun.
  - **Yardim Kurallari**
    Yardim isterken, hatalar hakkinda mumkun oldugunca fazla ayriinti saglaydiginizdari emin olun.
  - **Nefret Soylemi veya Taciz Yok**
    Bireylere veya gruplara yonelik nefret soylemi veya taciz iceren konusmalar yasaktir.
  - **Trolluk veya Provokasyon Yok**
    Herhangi bir sekilde catismalari bozmaya veya provoke etmeye yonelik eylemler yasaktir.
  - **Fikri Mulkiyete Saygi Gosterin**
    Telif haklari, ticari markalar ve patentler dahil ancak bunlarla sinirli olmamak uzere fikri mulkiyet haklarina saygi gosterin.
  - **Uyari Olmadan Spoiler Vermeyin**
    Tum uyeler tarafindan henuz tuketilmemis icerikler hakkinda konusurken, hayal kirikligi yaratmamak icin spoiler uyarilari verin.
  - **Uygun Kanallari Kullanin**
    Belirli konular icin ilgili kanallari kullanin, ilgisiz kanallarda konu disi tartismalardan kacinin.
  - **Asiri Buyuk Harf veya Spam Yok**
    Buyuk harflerin asiri kullanimindan veya hizli bir sekilde tekrarlanan mesajlar gondermekten kacinin.
  - **Ses Kanallarini Temiz Tutun**
    Ses kanallarini kullaniyorsaniz, rahatsiz edici gurultu olmadigrindan emin olun ve kibarca konusun.
  - **Yetkisiz Botlar veya Otomasyon Yok**
    Sunucuda yalnizca moderatorler tarafindan yetkilendirilen botlarin calismarina izin verilir.
  - **Ihlalleri Bildirin**
    Kural ihlallerine tanik olursaniz, bir moderator veya yoneticiye bildirin.
  - **Eglencenize Bakin!**
    En onemlisi, tum uyelere saygi gostererek ve olumlu bir ortam saglayarak bu sunucuda vaktinizin tadini cikarin.

  Katildiginiz icin tesekkurler, burada iyi vakit gecirmenizi umuyoruz.

