### About commands
about_desc1: "**Tam, gdzie ci, którzy chcą śpiewać, zawsze znajdą piosenkę ♪\nDołącz do melodii na swoim serwerze Discord już dziś!**"
about_desc2: |
  ・Prefix bota na tym serwerze to `%{prefix}`
  ・Zmień prefix za pomocą `%{prefix} prefix <nowy prefix>`
  ・Odtwórz utwór przez link lub wyszukiwanie `%{prefix} play`
  Odwiedź naszą **[stronę internetową](%{website})** lub użyj komendy `%{prefix} help`, aby poznać więcej komend.
about_desc3: |
  **Uwaga!**
  Najlepiej, jeśli otrzymam uprawnienia `Administrator`, ale...
  Nawet jeśli mi ich nie nadasz, nadal mogę działać, ale mogę nie być w stanie zrobić wszystkiego, co potrafię. Tylko mówię!

  **Pomoc i wsparcie**
  Dołącz do naszego **[serwera wsparcia](%{serversupport})**, jeśli potrzebujesz pomocy, chcesz uzyskać informacje o aktualizacjach i problemach lub chcesz zaangażować się w społeczność!

