## RULES Events ##
rules_title: "Regulamin serwera społeczności %{guild}!"
rules_desc: |
  - **Bądź szanujący**
    Zawsze przestrzegaj [Warunków korzystania](https://discord.com/terms) i [Wytycznych](https://discord.com/guidelines) Discorda.
  - **Kod pomocy**
    Kiedy prosisz o pomoc, upewnij się, że podajesz jak najwięcej szczegółów z błędami.
  - **Zakaz mowy nienawiści i nękania**
    Żadnych rozmów zawierających mowę nienawiści lub nękanie wobec osób lub grup.
  - **Zakaz trollowania i prowokowania**
    Żadnych działań mających na celu zakłócenie lub prowokowanie konfliktów w jakikolwiek sposób.
  - **Szanuj własność intelektualną**
    Szanuj prawa własności intelektualnej, w tym między innymi prawa autorskie, znaki towarowe i patenty.
  - **Zakaz spoilerów bez ostrzeżenia**
    Jeśli omawiasz treści, których nie wszyscy członkowie jeszcze skonsumowali, podaj ostrzeżenia o spoilerach, aby uniknąć rozczarowania.
  - **Używaj odpowiednich kanałów**
    Używaj odpowiednich kanałów do określonych tematów, unikaj dyskusji nie na temat na niepowiązanych kanałach.
  - **Zakaz nadmiernego pisania wielkimi literami i spamu**
    Unikaj nadmiernego używania wielkich liter lub szybkiego wysyłania powtarzających się wiadomości.
  - **Utrzymuj porządek na kanałach głosowych**
    Jeśli korzystasz z kanałów głosowych, upewnij się, że nie ma zakłócającego hałasu i mów uprzejmie.
  - **Zakaz nieautoryzowanych botów i automatyzacji**
    Tylko boty autoryzowane przez moderatorów mogą działać na serwerze.
  - **Zgłaszaj naruszenia**
    Jeśli widzisz naruszenia regulaminu, zgłoś je moderatorowi lub administratorowi.
  - **Baw się dobrze!**
    Co najważniejsze, ciesz się czasem spędzonym na tym serwerze, szanując wszystkich członków i utrzymując pozytywną atmosferę.

  Dziękujemy za dołączenie, mamy nadzieję, że będziesz się tu dobrze bawić.

