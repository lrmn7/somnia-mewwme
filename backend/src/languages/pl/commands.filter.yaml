### Equalizer command!
eq_author: "Korektor"
eq_icon: "https://i.pinimg.com/originals/cb/17/b8/cb17b80a942d7c317a35ff1324fae12f.gif"
eq_desc: |
  Jest **10 pasm**, które można ustawić od **-10** do **10**.
  Nie musisz wypełniać wszystkich, tylko te, które chcesz zmienić.
  Jeśli chcesz pominąć któreś, po prostu zostaw je jako **0**.
eq_field_title: "Przykład:"
eq_field_value: "%{prefix}eq 2 3 0 8 0 5 0 -5 0 0"
eq_footer: "Resetuj korektor • %{prefix}eq reset"
eq_on: "Korektor został ustawiony na **%{bands}**!"
eq_number: "Proszę podaj prawidłową liczbę!"
eq_greater: "Liczba musi być większa niż **-10**"
eq_than: "Liczba musi być mniejsza niż **10**"

