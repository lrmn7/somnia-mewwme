### privacy policy commands
privacy_title: "Політика конфіденційності %{bot}"
privacy_label: Політика конфіденційності
privacy_desc: |
  **Угода користувача**
  Використання [%{bot}](%{serversupport}) ("бот") на сервері вимагає збору певних даних користувача. Зібрані дані включають, але не обмежуються, ID Discord користувача, ім'я користувача Discord та ролі на сервері. Використання бота вважається прийняттям умов цієї політики.

  **Доступ до даних**
  Доступ до даних дозволений лише розробникам бота та хостинговим сервісам і лише в межах, необхідних для розробки, тестування та впровадження функцій бота. Дані не продаються, не передаються та не поширюються жодній третій стороні, за винятком випадків, передбачених законом або Угодою про умови обслуговування. Ви можете переглянути свої дані за запитом від [розробника](%{developer}).

  **Зберігання даних**
  Дані зберігаються в базі даних [MYSQL](https://www.mysql.com/). База даних захищена від зовнішнього доступу. Однак гарантії не надаються, і власник бота не несе відповідальності за ненавмисні або зловмисні витоки даних. У разі несанкціонованого доступу до даних, персонал сервера повідомить користувачів через сервер підтримки.

  **Права користувача**
  У будь-який час ви маєте право запитати перегляд даних вашого облікового запису Discord. Ви маєте право запитати видалення відповідних даних. Для цього користувачі повинні подати запит через сервер підтримки.

  **Запитання**
  Якщо у вас є запитання або занепокоєння щодо того, які дані можуть зберігатися з вашого облікового запису, зверніться до [персоналу](%{serversupport}). Для отримання додаткової інформації перегляньте Умови обслуговування Discord.

### The following terms and conditions apply to the use of the bot.
### terms of services commands
termsofservice_title: "Умови обслуговування %{bot}"
tos_label: "Умови обслуговування"
termsofservice_desc: |
  **Угода про використання**
  Запрошуючи [%{bot}](%{serversupport}) ("бот") та використовуючи його функції, ви погоджуєтесь з Умовами обслуговування та Політикою конфіденційності бота.

  Ви визнаєте, що можете вільно використовувати бота на будь-якому сервері Discord, який ви з ним поділяєте. Ви можете запросити його на будь-який сервер, де маєте право "Управління сервером", і ця привілея може бути відкликана, якщо ви порушите умови обслуговування або політику конфіденційності цього бота, або Умови обслуговування, Політику конфіденційності чи Правила спільноти Discord Inc.

  Через запрошення бот може збирати певні дані, описані в його Політиці конфіденційності. Ці дані призначені для основних функцій бота, таких як виконання команд.

  **Афіліація**
  Бот не є афілійованим, підтримуваним або створеним Discord Inc. Будь-який прямий зв'язок з Discord або будь-якими його товарними знаками є чисто випадковим. Ми не претендуємо на авторські права на активи, товарні знаки чи іншу інтелектуальну власність Discord.

  **Неповнолітні користувачі**
  Бот заборонений для неповнолітніх віком до 13 років або нижче віку законної згоди в їхній країні. Це відповідає Умовам обслуговування Discord. Жодна інформація не буде свідомо зберігатися від неповнолітнього користувача. Якщо буде виявлено, що користувач є неповнолітнім, ми вживемо всіх необхідних заходів для видалення збережених даних.

  **Відповідальність**
  Розробники та власник бота не можуть нести відповідальність за осіб, які порушують ці Умови в будь-який час. Право оновлювати ці умови зарезервоване на наш розсуд, з наданням 1-тижневого (7 днів) періоду для відмови від цих умов. Користувач може відмовитися, видаливши бота з будь-якого сервера, де користувач має право видалити бота.
