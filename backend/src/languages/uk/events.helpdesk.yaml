### BUTTON HELPDESK 1 ###
helpdesk1_title: "Ті, хто хоче співати, завжди знаходять пісню ♪"
helpdesk1_desc: |
  **%{bot} — це Discord бот, який змінює ваш досвід прослуховування музики в Discord, пропонуючи найчистіший інтерфейс, високоякісне аудіо та широкий спектр музичних функцій.**

  **Чому %{bot}?**
  - **Регулярні оновлення**: %{bot} постійно оновлюється, забезпечуючи вам завжди найкращі новітні функції та виправлення.
  - **Комплексні функції**: Проста музична система %{bot} забезпечує плавне відтворення з кількох джерел.
  - **Відданий спільноті підтримки**: Ми відносно новий бот у Discord, і будемо раді, якщо ви приєднаєтесь до нас! Забезпечення безперебійної роботи бота — наш пріоритет, тому нам потрібна ваша допомога з відгуками та пропозиціями. Якщо у вас є запитання, не соромтеся відкрити тікет підтримки.

  **Корисні посилання**
  - %{server}
  - %{vote}
  - %{website}
  - %{premium}

  **Потрібна підтримка?**
  - Створіть тікет для додаткової допомоги

  **Чого ви чекаєте? Запросіть %{bot} на свій сервер Discord сьогодні та насолоджуйтесь неперевершеним, безмежним музичним досвідом!**
  **[Натисніть тут, щоб запросити](%{invite})**

helpdesk2_title: "Додавання %{bot} на ваш сервер"
helpdesk2_desc: |
  **Ви можете запросити %{bot} за цим [посиланням](%{invite}).**
    Оберіть сервер, на який хочете додати, та натисніть **Авторизувати**

  > Зверніть увагу, що якщо ви вимкнете дозвіл `Administrator` для %{bot}, це може вплинути на його функціональність. Хоча ви все ще зможете використовувати базові музичні функції, деякі можливості можуть не працювати належним чином.

helpdesk3_title: "Як користуватися музичним ботом %{bot}?"
helpdesk3_desc: |
  Приєднайтесь до голосового або сценічного каналу, потім введіть /play <назва пісні/URL> у текстовому каналі.
  Ви можете взаємодіяти безпосередньо за допомогою кнопок керування для зупинки, зациклення тощо.
  Введіть / (або /help) та оберіть іконку %{bot}, щоб отримати список усіх доступних команд.

helpdesk4_title: "Як увімкнути функцію 24/7?"
helpdesk4_desc: |
  Приєднайтесь до голосового або сценічного каналу, потім введіть `/247 <enable/disable>` у текстовому каналі.

  **Примітка:** *Цю функцію можна використовувати, якщо у вас є дозвіл `manage server`, і попередньо переконайтесь, що бот наразі відтворює музику.*

helpdesk5_title: "%{bot} не відповідає/офлайн"
helpdesk5_desc: |
  Ви намагаєтесь використати команду, але вона постійно не працює? Ймовірно, бот не може відповісти, але виконайте наведені нижче кроки, щоб це виправити.

  **%{bot} тепер використовує слеш-команди!**
  Переконайтеся, що ви використовуєте слеш-команди, оскільки Discord тепер вимагає від усіх ботів їх використання.
  Почніть з введення `/play` та `/help`

  **%{bot} все ще не відповідає?**
  Єдиний залишений сценарій у цій ситуації — проблема з боку Discord або з нашого боку. Перевірте, чи %{bot} не офлайн на вашому сервері. Якщо він офлайн, найкращим варіантом буде зачекати до 5 хвилин і подивитися, чи %{bot} повернеться онлайн. Якщо він онлайн, має всі необхідні дозволи, вам обов'язково варто зв'язатися з одним із наших спеціалістів підтримки.

helpdesk6_title: "Якість звуку %{bot} з затримками"
helpdesk6_desc: |
  Ніхто не любить музику з затримками, але це іноді трапляється при прослуховуванні музичних ботів у Discord. Ось деякі можливі рішення, які допоможуть вам це виправити.

  **Що мені робити?**
  Перш за все, перевірте своє інтернет-з'єднання. Discord відображає ваш останній та середній пінг у нижньому лівому куті, просто натисніть на "Голосове з'єднання" та перевірте, чи ваш пінг стабільний (якщо червоний графік сильно стрибає, це означає нестабільність!) і останній, а також середній пінг нижче 250 мілісекунд. Якщо обидва ці показники свідчать про погане з'єднання, спробуйте перевірити ваш WiFi/LAN. Перезавантаження роутера також може вирішити деякі проблеми.

  **У вас пінг 5мс і ви можете завантажити GTA 5 за 2 хвилини?**
  Отже, ваше інтернет-з'єднання, здається, не є проблемою. У 95% випадків, коли %{bot} лагає, Discord має тимчасові проблеми з голосовими серверами. Зазвичай вони просто перезавантажують їх, але ви можете примусово переключитися на інший сервер у вашому регіоні. [Спробуйте змінити регіон сервера](https://support.discord.com/hc/en-us/articles/1500007645701-Voice-Regions-on-Discord-FAQ#h_01F3RXJ4YCHYS652ETKWJ499Y3), щоб отримати новий голосовий сервер Discord.
  Якщо у вас все ще та ж проблема, введіть /report для повідомлення про вашу проблему.

helpdesk7_title: "Як налаштувати канал запитів пісень?"
helpdesk7_desc: |
  **Як створити канал запитів?**
  Переконайтеся, що %{bot} має дозвіл `manage server`, потім введіть /setup з опцією `create`, і бот автоматично створить спеціальний канал для запитів пісень.

  ```Примітка: Не видаляйте жодне з повідомлень, які %{bot} створив, щоб я міг працювати належним чином.```

  **Як видалити канал запитів?**
  Як і раніше, тільки в опціях ви можете обрати `delete`.

helpdesk8_title: "%{bot} постійно каже, що йому бракує дозволів."
helpdesk8_desc: |
  При спробі виконати певні команди %{bot} може не мати певних дозволів. У таких випадках %{bot} відмовиться виконувати команду, доки ці проблеми не будуть вирішені. Важливо зауважити, що ці дозволи не є необов'язковими; %{bot} потребує їх для виконання команди.

  Якщо ви вважаєте, що бот має необхідні дозволи, обов'язково перевірте перевизначення ролей каналу. Ці перевизначення можуть змінювати дозволи ролей у конкретних каналах.

  Якщо ви все ще не можете визначити, чому %{bot} не має необхідних дозволів, спробуйте надати %{bot} дозвіл Адміністратора. Це повинно вирішити будь-які проблеми з дозволами Discord.

helpdesk9_title: "Mewwme самостійно відключається від голосового каналу"
helpdesk9_desc: |
  У дуже рідкісних випадках, навіть з увімкненим режимом 24/7, Mewwme може відключитися від голосового каналу без використання /stop або кнопки Відключити в Discord. Деякі з найпоширеніших причин та можливе рішення наведено нижче.

  **Режим 24/7 не увімкнено.**
  За замовчуванням Mewwme відключається від голосового каналу, коли він порожній протягом 3 хвилин.

  **Рішення:** Зверніться до "4. Як увімкнути функцію 24/7?" у першому ембеді допомоги, щоб увімкнути режим 24/7.

  **Відсутні дозволи.**
  Кожного разу, коли Discord просить нас повторно підключитися до голосового каналу, через перезавантаження серверів або збій API, ми повторно перевіряємо дозволи бота, щоб переконатися, що він може приєднатися та говорити в каналі. Якщо чогось не вистачає, вам доведеться знову використати /play, щоб додати бота до іншого або того ж каналу після додавання необхідних дозволів.

  **Рішення:** Обов'язково використовуйте команди /play для додавання бота до голосового каналу замість переміщення його з іншого. Таким чином ви переконаєтесь, що бот має всі необхідні дозволи для повторного підключення.

  **Проблеми з регіоном сервера.**
  У деяких випадках деякі голосові регіони можуть мати проблеми з мережею та стабільністю, які можуть перешкодити боту приєднатися до голосового каналу.

  **Рішення:** Переключіться на інший голосовий регіон у налаштуваннях голосового каналу (оберіть найближчий до вашої країни).

  **Щось інше пішло не так.**
  Якщо ви спробували всі вищезазначені рішення і проблема не зникає, введіть `report` або відкрийте тікет на сервері підтримки https://discord.com/channels/1088032923443277824/1169558722738147378

helpdesk10_title: "Як отримати/активувати Premium та які переваги я отримаю?"
helpdesk10_desc: |
  **Як активувати мої переваги Premium?**

  щоб активувати переваги вашого premium-членства, виконайте наступні кроки:
  1. **спочатку прив'яжіть свій обліковий запис discord**
    - перед покупкою переконайтеся, що ваш обліковий запис discord прив'язаний до платформи, яку ви використовуєте (patreon або ko-fi).
    - це необхідно для того, щоб система могла автоматично виявити ваш платіж.
  2. **придбайте членство**
  - після прив'язки discord завершіть оплату членства відповідно до обраного плану.
  3. **зачекайте на синхронізацію**
    - після успішної оплати зачекайте кілька хвилин, поки система синхронізує ваше членство.
  4. **активуйте premium на вашому сервері**
    - перейдіть на сервер discord, який хочете оновити, потім використайте цю команду:
      `/premium claim`
      оберіть правильну опцію платформи (patreon або ko-fi) при запиті.
      переконайтеся, що ви виконуєте команду на тому сервері, для якого хочете активувати premium.
      після активації premium буде увімкнено миттєво.

  Дотримуючись наведених вище кроків, ви зможете активувати та насолоджуватися всіма перевагами Premium. Якщо у вас виникнуть проблеми або додаткові запитання, не соромтеся звертатися до нашої команди підтримки.

helpdesk10_footer: "Дякуємо, що ви є частиною нашої подорожі! Ми сподіваємось, що вам тут буде добре."
