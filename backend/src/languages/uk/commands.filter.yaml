### Equalizer command!
eq_author: "Еквалайзер"
eq_icon: "https://i.pinimg.com/originals/cb/17/b8/cb17b80a942d7c317a35ff1324fae12f.gif"
eq_desc: |
  Є **10 смуг**, які можна встановити від **-10** до **10**.
  Вам не потрібно вводити всі, лише ті, які хочете змінити.
  Якщо хочете пропустити одну, просто залиште її як **0**.
eq_field_title: "Приклад:"
eq_field_value: "%{prefix}eq 2 3 0 8 0 5 0 -5 0 0"
eq_footer: "Скинути еквалайзер • %{prefix}eq reset"
eq_on: "Еквалайзер встановлено на **%{bands}**!"
eq_number: "Будь ласка, введіть дійсне число!"
eq_greater: "Число має бути більше за **-10**"
eq_than: "Число має бути менше за **10**"

