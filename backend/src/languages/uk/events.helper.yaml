## RULES Events ##
rules_title: "Правила сервера спільноти %{guild}!"
rules_desc: |
  - **Будьте поважними**
    Завжди дотримуйтесь [Умов використання](https://discord.com/terms) та [Правил](https://discord.com/guidelines) Discord.
  - **Код допомоги**
    Коли ви просите допомогу, надавайте якомога більше деталей разом з помилками.
  - **Жодної мови ненависті чи переслідувань**
    Жодних розмов, що містять мову ненависті або переслідування окремих осіб чи груп.
  - **Жодного тролінгу чи провокацій**
    Жодних дій, спрямованих на порушення спокою або провокацію конфліктів будь-яким чином.
  - **Повага до інтелектуальної власності**
    Поважайте права інтелектуальної власності, включаючи, але не обмежуючись, авторські права, товарні знаки та патенти.
  - **Жодних спойлерів без попередження**
    Якщо обговорюєте контент, який ще не переглянули всі учасники, надавайте попередження про спойлери.
  - **Використовуйте відповідні канали**
    Використовуйте відповідні канали для конкретних тем, уникайте офтопіків у непов'язаних каналах.
  - **Жодного надмірного використання великих літер чи спаму**
    Уникайте надмірного використання великих літер або надсилання повторюваних повідомлень.
  - **Тримайте голосові канали чистими**
    При використанні голосових каналів переконайтеся, що немає сторонніх шумів, і говоріть ввічливо.
  - **Жодних несанкціонованих ботів чи автоматизації**
    На сервері дозволено працювати лише ботам, авторизованим модераторами.
  - **Повідомляйте про порушення**
    Якщо ви бачите порушення правил, повідомте модератору або адміністратору.
  - **Розважайтесь!**
    Найважливіше — насолоджуйтесь часом на цьому сервері, поважаючи всіх учасників та підтримуючи позитивну атмосферу.

  Дякуємо за приєднання, сподіваємось, вам тут буде добре.

