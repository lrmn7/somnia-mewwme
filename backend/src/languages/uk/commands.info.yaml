### About commands
about_desc1: "**Там, де ті, хто хоче співати, завжди знаходять пісню ♪\nПриєднуйтесь до мелодії на вашому сервері Discord сьогодні!**"
about_desc2: |
  ・Префікс бота для цього сервера: `%{prefix}`
  ・Змінити префікс: `%{prefix} prefix <новий префікс>`
  ・Відтворити трек за посиланням або пошуковим запитом: `%{prefix} play`
  Відвідайте наш **[вебсайт](%{website})** або скористайтесь командою `%{prefix} help` для інших команд.
about_desc3: |
  **Зверніть увагу!**
  Мені бажано мати дозвіл `Administrator`, але...
  Навіть якщо ви не надасте мені цей дозвіл, я все одно працюватиму, але можливо не зможу виконати все, на що здатний. Просто кажу!

  **Допомога та підтримка**
  Приєднуйтесь до нашого **[сервера підтримки](%{serversupport})**, якщо вам потрібна допомога, хочете отримати інформацію про оновлення та проблеми, або хочете спілкуватися зі спільнотою!

