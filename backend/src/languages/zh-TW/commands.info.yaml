### About commands
about_desc1: "**願意歌唱的人總能找到一首歌 ♪\n今天就在你的 Discord 伺服器中加入這段旋律吧！**"
about_desc2: |
  ・此伺服器的機器人前綴為 `%{prefix}`
  ・使用 `%{prefix} prefix <新前綴>` 更改前綴
  ・使用連結或搜尋詞彙播放曲目 `%{prefix} play`
  造訪我們的**[網站](%{website})**或使用 `%{prefix} help` 指令來查看更多指令。
about_desc3: |
  **注意！**
  我最好能擁有 `管理員` 權限，但是...
  即使你不給我這些權限，我仍然可以運作，但我可能無法發揮所有功能。只是提醒一下！

  **幫助與支援**
  如果你需要幫助、想獲取更新與問題的資訊，或想與社群互動，請加入我們的**[支援伺服器](%{serversupport})**！

