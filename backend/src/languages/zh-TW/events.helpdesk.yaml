### BUTTON HELPDESK 1 ###
helpdesk1_title: "願意歌唱的人總能找到一首歌 ♪"
helpdesk1_desc: |
  **%{bot} 是一個 Discord 機器人，為你在 Discord 上的音樂體驗帶來革命，提供最簡潔的使用者介面、高品質音訊以及豐富的音樂相關功能。**

  **為什麼選擇 %{bot}？**
  - **定期更新**：%{bot} 持續更新，確保你始終享有最新的功能和修復。
  - **全面的功能**：%{bot} 簡單的音樂系統讓你能從多個來源順暢播放。
  - **專屬支援社群**：我們是 Discord 上較新的機器人，我們非常希望你能加入我們！確保機器人順暢運作是我們的優先事項，因此我們需要你的回饋和建議。如果你有任何問題，歡迎開啟支援工單。

  **實用連結**
  - %{server}
  - %{vote}
  - %{website}
  - %{premium}

  **需要支援？**
  - 提交工單以獲得額外協助

  **還在等什麼？立即邀請 %{bot} 到你的 Discord 伺服器，享受無與倫比、無限制的音樂體驗！**
  **[點此邀請](%{invite})**

helpdesk2_title: "將 %{bot} 加入你的伺服器"
helpdesk2_desc: |
  **你可以使用此[連結](%{invite})邀請 %{bot}。**
    選擇你要新增的伺服器，然後點擊**授權**

  > 請注意，如果你停用 %{bot} 的 `管理員` 權限，可能會影響其功能。雖然你仍然可以使用基本的音樂功能，但某些功能可能無法正常運作。

helpdesk3_title: "如何使用 %{bot} 音樂機器人？"
helpdesk3_desc: |
  加入語音頻道或舞台頻道，然後在文字頻道中輸入 /play <歌曲名稱/網址>。
  你可以直接使用控制按鈕來停止、循環等。
  輸入 /（或 /help）並選擇 %{bot} 的圖示以查看所有可用指令。

helpdesk4_title: "如何啟用 24/7 功能？"
helpdesk4_desc: |
  加入語音頻道或舞台頻道，然後在文字頻道中輸入 `/247 <enable/disable>`。

  **注意：** *此功能需要擁有 `管理伺服器` 權限才能使用，且需確保機器人目前正在播放音樂。*

helpdesk5_title: "%{bot} 無回應/離線"
helpdesk5_desc: |
  你嘗試使用指令但一直失敗？好吧，它可能無法回應，但請按照以下步驟來修復。

  **%{bot} 現在使用斜線指令！**
  確保你使用的是斜線指令，因為 Discord 現在要求所有機器人都使用斜線指令。
  開始使用 `/play` 和 `/help`

  **%{bot} 仍然沒有回應？**
  唯一剩下的可能是 Discord 或我們這邊出了問題。請確認 %{bot} 在你的伺服器中是否離線。如果它離線，最好的方法是等待最多 5 分鐘，看看 %{bot} 是否恢復上線。如果它在線上、擁有所有必要的權限，你應該聯繫我們的支援成員。

helpdesk6_title: "%{bot} 音質聽起來有延遲"
helpdesk6_desc: |
  沒有人喜歡延遲的音樂，但在 Discord 上使用音樂機器人時有時會發生這種情況。以下是一些可能的解決方案。

  **我該怎麼做？**
  首先，你應該檢查你的網路連線。Discord 在左下角顯示你的最新和平均延遲，只需點擊「已連線語音」，確認你的延遲是否穩定（如果紅色圖表跳動很大，表示不穩定！），並且最新和平均延遲低於 250 毫秒。如果這兩個指標都顯示你的連線不佳，你應該檢查你的 WiFi/有線網路。重啟路由器也可能解決一些問題。

  **你的延遲只有 5ms 而且可以在 2 分鐘內下載 GTA 5？**
  那麼你的網路連線似乎不是問題。在 95% 的 %{bot} 延遲案例中，Discord 的語音伺服器出現了暫時性問題。他們通常會在某個時間點重啟伺服器，但你可以嘗試[切換你的伺服器區域](https://support.discord.com/hc/en-us/articles/1500007645701-Voice-Regions-on-Discord-FAQ#h_01F3RXJ4YCHYS652ETKWJ499Y3)以強制切換到你所在區域的不同伺服器來獲得一個新的 Discord 語音伺服器。
  如果問題仍然存在，歡迎輸入 /report 回報你的問題。

helpdesk7_title: "如何設定點歌頻道？"
helpdesk7_desc: |
  **如何建立點歌頻道？**
  確保 %{bot} 擁有 `管理伺服器` 權限，然後輸入 /setup 並選擇 `create` 選項，機器人將自動建立一個專用的點歌頻道。

  ```注意：請勿刪除 %{bot} 所建立的任何訊息，以確保我能正常運作。```

  **如何刪除點歌頻道？**
  如同之前，只需在選項中選擇 `delete`。

helpdesk8_title: "%{bot} 一直說缺少權限。"
helpdesk8_desc: |
  當嘗試執行某些指令時，%{bot} 可能缺少某些權限。在這種情況下，%{bot} 會拒絕執行該指令直到問題解決。需要注意的是，這些權限不是可選的；%{bot} 需要它們來執行指令。

  如果你認為機器人擁有必要的權限，請確認檢查頻道的身分組覆寫。這些覆寫可以在特定頻道中修改身分組權限。

  如果你仍然無法確定為什麼 %{bot} 沒有所需的權限，請考慮給 %{bot} 管理員權限。這應該能解決任何 Discord 權限問題。

helpdesk9_title: "Mewwme 自行從語音頻道斷線"
helpdesk9_desc: |
  在極少數情況下，即使啟用了 24/7 模式，Mewwme 也可能在沒有人使用 /stop 或 Discord 斷線按鈕的情況下從語音頻道斷線。以下列出一些最常見的原因和可能的解決方案。

  **24/7 模式未啟用。**
  預設情況下，Mewwme 會在語音頻道空置 3 分鐘後自動斷線。

  **修復：** 參考第一個幫助嵌入中的「4. 如何啟用 24/7 功能？」來啟用 24/7 模式。

  **缺少權限。**
  每當 Discord 要求我們重新連接語音頻道時（無論是由於伺服器重啟還是 API 中斷），我們都會重新檢查機器人的權限以確保它可以加入和在頻道中發言。如果有缺少的權限，你需要再次使用 /play 來邀請機器人到不同的頻道或在新增所需權限後加入同一個頻道。

  **修復：** 確保使用 /play 指令將機器人加入語音頻道，而不是從其他頻道移動它。這樣可以確保機器人擁有在需要時重新連接的所有必要權限。

  **伺服器區域問題。**
  在某些情況下，某些語音區域可能會遇到網路和穩定性問題，這可能會阻止機器人加入語音頻道。

  **修復：** 使用語音頻道設定切換到另一個語音區域（選擇最接近你所在國家的區域）。

  **其他問題。**
  如果你已經嘗試了以上所有修復方法但問題仍然存在，請輸入 `report` 或在支援伺服器中開啟工單 https://discord.com/channels/1088032923443277824/1169558722738147378

helpdesk10_title: "如何取得/啟用進階版以及有哪些福利？"
helpdesk10_desc: |
  **如何兌換我的進階版福利？**

  要啟用你的進階版會員福利，請按照以下步驟操作：
  1. **先連結你的 Discord 帳戶**
    - 在購買之前，請確保你的 Discord 帳戶已連結到你使用的平台（Patreon 或 Ko-fi）。
    - 這是必要的，以便系統能自動偵測你的付款。
  2. **購買你的會員資格**
  - 連結 Discord 後，根據你想要的方案完成會員付款。
  3. **等待同步**
    - 付款成功後，請等待幾分鐘讓系統同步你的會員資格。
  4. **在你的伺服器中認領進階版**
    - 前往你想升級的 Discord 伺服器，然後使用此指令：
      `/premium claim`
      出現提示時選擇正確的平台選項（Patreon 或 Ko-fi）。
      確保你在想要啟用進階版的伺服器中執行此指令。
      認領後，進階版將立即啟用。

  按照以上步驟，你就能啟用並享受所有提供的進階版福利。如果你遇到任何問題或有其他疑問，歡迎聯繫我們的支援團隊。

helpdesk10_footer: "感謝你成為我們旅程的一部分！希望你在這裡度過愉快的時光。"
