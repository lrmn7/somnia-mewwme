## RULES Events ##
rules_title: "%{guild} 社群伺服器規則！"
rules_desc: |
  - **保持尊重**
    請始終遵守 Discord [服務條款](https://discord.com/terms)和[社群準則](https://discord.com/guidelines)。
  - **求助準則**
    當你請求幫助時，請盡可能提供詳細的錯誤資訊。
  - **禁止仇恨言論或騷擾**
    禁止包含對個人或群體的仇恨言論或騷擾的對話。
  - **禁止挑釁或引戰**
    禁止任何旨在擾亂或引發衝突的行為。
  - **尊重智慧財產權**
    尊重智慧財產權，包括但不限於著作權、商標和專利。
  - **劇透請附警告**
    如果討論尚未被所有成員觀看的內容，請提供劇透警告以避免掃興。
  - **使用適當的頻道**
    在相關頻道討論特定主題，避免在無關的頻道中發表離題內容。
  - **禁止過度使用大寫字母或洗版**
    避免過度使用大寫字母或快速傳送重複訊息。
  - **保持語音頻道清淨**
    使用語音頻道時，請確保沒有干擾性噪音並禮貌發言。
  - **禁止未授權的機器人或自動化**
    只有經過管理員授權的機器人才允許在伺服器上運作。
  - **舉報違規行為**
    如果你發現違規行為，請向管理員舉報。
  - **玩得開心！**
    最重要的是，請尊重所有成員並維持正面的環境，在這個伺服器上享受你的時光。

  感謝你的加入，希望你在這裡度過愉快的時光。

