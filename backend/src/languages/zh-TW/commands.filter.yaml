### Equalizer command!
eq_author: "等化器"
eq_icon: "https://i.pinimg.com/originals/cb/17/b8/cb17b80a942d7c317a35ff1324fae12f.gif"
eq_desc: |
  共有 **10 個頻段**，可以設定為 **-10** 到 **10**。
  你不必全部輸入，只需輸入你想更改的部分。
  如果你想跳過某一個，只需留為 **0** 即可。
eq_field_title: "範例："
eq_field_value: "%{prefix}eq 2 3 0 8 0 5 0 -5 0 0"
eq_footer: "重設等化器 • %{prefix}eq reset"
eq_on: "等化器已設為 **%{bands}**！"
eq_number: "請提供有效的數字！"
eq_greater: "數字必須大於 **-10**"
eq_than: "數字必須小於 **10**"

