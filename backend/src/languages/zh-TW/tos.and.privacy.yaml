### privacy policy commands
privacy_title: "%{bot} 隱私權政策"
privacy_label: 隱私權政策
privacy_desc: |
  **使用者協議**
  在伺服器上使用 [%{bot}](%{serversupport})（「機器人」）需要收集某些使用者資料。收集的資料包括但不限於使用者的 Discord ID、Discord 使用者名稱和伺服器身分組。使用機器人即視為接受這些政策條款。

  **資料存取**
  資料的存取僅限於機器人開發者和託管服務，且僅在機器人開發、測試和功能實作的必要範圍內。資料不會被出售、提供或與任何第三方共享，除非法律或服務條款協議要求。你可以透過[開發者](%{developer})請求查看你的資料。

  **資料儲存**
  資料儲存在 [MYSQL](https://www.mysql.com/) 資料庫中。資料庫受到安全防護以防止外部存取。然而，不提供任何保證，機器人擁有者對非故意或惡意的資料洩露不承擔責任。如果發生未經授權的資料存取，伺服器工作人員將透過支援伺服器通知使用者。

  **使用者權利**
  你隨時有權請求查看你的 Discord 帳戶資料。你有權請求刪除相關資料。若要執行此操作，使用者必須透過支援伺服器提交請求。

  **問題**
  如果你對可能從你的帳戶中儲存的資料有任何疑問或疑慮，請聯繫[工作人員](%{serversupport})。如需更多資訊，請查看 Discord 服務條款。

### The following terms and conditions apply to the use of the bot.
### terms of services commands
termsofservice_title: "%{bot} 服務條款"
tos_label: "服務條款"
termsofservice_desc: |
  **使用協議**
  透過邀請 [%{bot}](%{serversupport})（「機器人」）並使用其功能，你同意機器人的服務條款和隱私權政策。

  你確認可以在任何與你共享的 Discord 伺服器上自由使用機器人。你可以將其邀請到任何你擁有「管理伺服器」權限的伺服器，如果你違反本機器人的服務條款或隱私權政策，或 Discord Inc. 的服務條款、隱私權政策或社群準則，此權限可能會被撤銷。

  透過邀請，機器人可能會如其隱私權政策所述收集特定資料。這些資料的預定用途是用於機器人的核心功能，例如執行指令。

  **關聯聲明**
  本機器人與 Discord Inc. 沒有關聯、未受其支持或製作。任何與 Discord 或其任何商標物件的直接關聯純屬巧合。我們不主張 Discord 資產、商標或其他智慧財產的版權所有權。

  **未成年使用者**
  本機器人不允許 13 歲以下或未達其國家法定同意年齡的未成年人使用。這符合 Discord 服務條款。不會故意儲存任何未成年使用者的資訊。如果發現使用者為未成年人，我們將採取所有必要措施刪除已儲存的資料。

  **責任**
  機器人的開發者和擁有者不對任何時候違反這些條款的個人承擔責任。我們保留更新這些條款的權利，並提供 1 週（7 天）的退出期限。使用者可以透過從任何其有權移除機器人的伺服器中移除機器人來選擇退出。
