### About commands
about_desc1: "**Di mana mereka yang ingin bernyanyi selalu menemukan lagu ♪\nBergabunglah dengan melodi di server Discord-mu hari ini!**"
about_desc2: |
  ・Prefix bot untuk server ini adalah `%{prefix}`
  ・Ubah prefix dengan `%{prefix} prefix <prefix baru>`
  ・Putar lagu dengan link atau kata kunci `%{prefix} play`
  Kunjungi **[website](%{website})** kami atau gunakan perintah `%{prefix} help` untuk perintah lainnya.
about_desc3: |
  **Perhatian!**
  Saya lebih baik memiliki izin `Administrator`, tapi...
  Meskipun kamu tidak memberikan izin tersebut, saya masih bisa bekerja, tapi mungkin tidak bisa melakukan semua hal yang saya mampu. Hanya memberitahu!

  **Bantuan dan Dukungan**
  Bergabunglah ke **[server dukungan](%{serversupport})** kami jika kamu butuh bantuan, ingin mendapatkan informasi tentang pembaruan dan masalah, atau ingin berinteraksi dengan komunitas!

