### Equalizer command!
eq_author: "Equalizer"
eq_icon: "https://i.pinimg.com/originals/cb/17/b8/cb17b80a942d7c317a35ff1324fae12f.gif"
eq_desc: |
  Ada **10 Band** yang bisa diatur dari **-10** hingga **10**.
  Kamu tidak perlu memasukkan semuanya, cukup yang ingin kamu ubah.
  Jadi kalau mau melewati satu, cukup biarkan sebagai **0**.
eq_field_title: "Contoh:"
