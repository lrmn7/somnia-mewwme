## RULES Events ##
rules_title: "Aturan Server untuk Komunitas %{guild}!"
rules_desc: |
  - **Saling menghormati**
    Selalu ikuti [ToS](https://discord.com/terms) dan [Panduan](https://discord.com/guidelines) Discord.
  - **Kode Bantuan**
    Saat kamu meminta bantuan, pastikan memberikan detail sebanyak mungkin beserta error-nya.
  - **Dilarang Ujaran Kebencian atau Pelecehan**
    Dilarang percakapan yang mengandung ujaran kebencian atau pelecehan terhadap individu atau kelompok.
  - **Dilarang Trolling atau Flaming**
    Dilarang tindakan yang bertujuan mengganggu atau memprovokasi konflik dengan cara apapun.
  - **Hormati Kekayaan Intelektual**
    Hormati hak kekayaan intelektual, termasuk tetapi tidak terbatas pada hak cipta, merek dagang, dan paten.
  - **Dilarang Spoiler Tanpa Peringatan**
    Jika membahas konten yang belum dikonsumsi semua anggota, berikan peringatan spoiler untuk menghindari kekecewaan.
  - **Gunakan Channel yang Sesuai**
    Gunakan channel yang relevan untuk topik tertentu, hindari diskusi di luar topik di channel yang tidak terkait.
  - **Dilarang Kapitalisasi Berlebihan atau Spam**
    Hindari penggunaan huruf kapital secara berlebihan atau mengirim pesan berulang dengan cepat.
  - **Jaga Voice Channel Tetap Bersih**
    Jika menggunakan voice channel, pastikan tidak ada kebisingan yang mengganggu dan bicara dengan sopan.
  - **Dilarang Bot atau Automation Tidak Resmi**
    Hanya bot yang diotorisasi oleh moderator yang diizinkan beroperasi di server.
  - **Laporkan Pelanggaran**
    Jika kamu menyaksikan pelanggaran aturan, laporkan ke moderator atau admin.
  - **Bersenang-senanglah!**
    Yang terpenting, nikmati waktumu di server ini dengan menghormati semua anggota dan menjaga lingkungan yang positif.

  Terima kasih telah bergabung, kami harap kamu akan bersenang-senang di sini.

