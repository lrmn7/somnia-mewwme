### BUTTON HELPDESK 1 ###
helpdesk1_title: "愿歌者永远找到属于自己的歌 ♪"
helpdesk1_desc: |
  **%{bot} 是一款 Discord 机器人，它以最简洁的用户界面、高品质音频和丰富的音乐相关功能，彻底改变了你在 Discord 上体验音乐的方式。**

  **为什么选择 %{bot}？**
  - **定期更新**：%{bot} 会持续更新，确保你始终获得最新功能和修复。
  - **全面功能**：%{bot} 简洁的音乐系统支持从多个来源流畅播放。
  - **专属支持社区**：我们是 Discord 上相对较新的机器人，希望你能加入我们！确保机器人顺畅运行是我们的优先事项，因此我们需要你的反馈和建议。如有任何问题，请随时提交支持工单。

  **有用链接**
  - %{server}
  - %{vote}
  - %{website}
  - %{premium}

  **需要支持？**
  - 提交工单以获取额外帮助

  **你还在等什么？今天就邀请 %{bot} 到你的 Discord 服务器，享受无与伦比、无限制的音乐体验吧！**
  **[点击这里邀请](%{invite})**

helpdesk2_title: "将 %{bot} 添加到你的服务器"
helpdesk2_desc: |
  **你可以使用此 [链接](%{invite}) 邀请 %{bot}。**
    选择你想添加的服务器，然后点击**授权**

  > 请注意，如果你禁用 %{bot} 的 `Administrator` 权限，可能会影响其功能。虽然你仍然可以使用基本的音乐功能，但某些功能可能无法正常工作。

helpdesk3_title: "如何使用 %{bot} 音乐机器人？"
helpdesk3_desc: |
  加入语音频道或舞台频道，然后在文字频道中输入 /play <歌曲名称/链接>。
  你可以直接使用控制按钮进行停止、循环等操作。
  输入 /（或 /help）并选择 %{bot} 的图标以获取所有可用命令列表。

helpdesk4_title: "如何启用 24/7 功能？"
helpdesk4_desc: |
  加入语音频道或舞台频道，然后在文字频道中输入 `/247 <enable/disable>`。

  **注意：** *如果你拥有 `manage server` 权限，可以使用此功能，并且需要确保机器人当前正在播放音乐。*

helpdesk5_title: "%{bot} 没有响应/离线"
helpdesk5_desc: |
  你尝试使用命令但一直失败？好吧，它可能暂时无法回应，但请按照以下步骤解决。

  **%{bot} 现在使用斜杠命令！**
  请确保你使用的是斜杠命令，因为 Discord 现在要求所有机器人都使用它们。
  输入 `/play` 和 `/help` 开始使用

  **%{bot} 仍然没有回应？**
  在这种情况下，唯一剩下的可能是 Discord 或我们这边的问题。请检查 %{bot} 在你的服务器中是否离线。如果离线，最好等待最多 5 分钟，看看 %{bot} 是否恢复在线。如果在线并拥有所有必需权限，你应该联系我们的支持团队成员。

helpdesk6_title: "%{bot} 音质听起来卡顿"
helpdesk6_desc: |
  没有人喜欢卡顿的音乐，但在 Discord 上使用音乐机器人时有时会发生这种情况。以下是一些可能的解决方案来帮助你修复。

  **我应该怎么做？**
  首先，你应该检查你的网络连接。Discord 在左下角显示你的最新和平均延迟，只需点击"已连接语音"并确认你的延迟是否稳定（如果红色图表大幅波动则表示不稳定！），并且最新和平均延迟低于 250 毫秒。如果这两个指标都显示你的连接不佳，你应该检查你的 WiFi/网线。重启路由器也可能解决一些问题。

  **你的延迟只有 5ms，可以 2 分钟下载完 GTA 5？**
  那么你的网络连接应该不是问题。在 95% 的 %{bot} 卡顿案例中，Discord 的语音服务器出现了临时问题。他们通常会在某个时候重启，但你可以强制切换到你所在区域的其他服务器。[尝试切换服务器区域](https://support.discord.com/hc/en-us/articles/1500007645701-Voice-Regions-on-Discord-FAQ#h_01F3RXJ4YCHYS652ETKWJ499Y3) 以获取新的 Discord 语音服务器。
  如果你仍然遇到相同的问题，请输入 /report 报告你的问题。

helpdesk7_title: "如何设置歌曲点播频道？"
helpdesk7_desc: |
  **如何创建点播频道？**
  确保 %{bot} 被授予 `manage server` 权限，然后输入 /setup 并选择 `create` 选项，机器人将自动创建一个专门的歌曲点播频道。

  ```注意：请勿删除 %{bot} 创建的任何消息，以确保我能正常工作。```

  **如何删除点播频道？**
  和之前一样，只需在选项中选择 `delete`。

helpdesk8_title: "%{bot} 一直说缺少权限。"
helpdesk8_desc: |
  当尝试运行某些命令时，%{bot} 可能缺少某些权限。在这种情况下，%{bot} 将拒绝运行该命令，直到这些问题得到解决。需要注意的是，这些权限不是可选的；%{bot} 需要它们来执行命令。

  如果你认为机器人已经拥有必要的权限，请确保检查频道的身份组覆盖设置。这些覆盖可以修改特定频道中的身份组权限。

  如果你仍然无法确定为什么 %{bot} 没有所需的权限，请考虑给 %{bot} 管理员权限。这应该能解决所有 Discord 权限问题。

helpdesk9_title: "Mewwme 自己从语音频道断开连接"
helpdesk9_desc: |
  在非常少见的情况下，即使启用了 24/7 模式，Mewwme 也可能在没有人使用 /stop 或 Discord 的断开连接按钮的情况下从语音频道断开。以下列出了一些最常见的原因和可能的解决方案。

  **24/7 模式未启用。**
  默认情况下，Mewwme 在语音频道空闲 3 分钟后会断开连接。

  **解决方法：** 参考第一个帮助嵌入中的"4. 如何启用 24/7 功能？"来启用 24/7 模式。

  **缺少权限。**
  每当 Discord 要求我们重新连接语音频道时（由于服务器重启或 API 中断），我们会再次检查机器人权限，确保它可以加入并在频道中发言。如果缺少某些权限，你需要再次使用 /play 将机器人邀请到不同的频道或在添加所需权限后邀请到同一频道。

  **解决方法：** 确保使用 /play 命令将机器人添加到语音频道，而不是从其他频道移动它。这样可以确保机器人拥有在需要时重新连接所需的所有权限。

  **服务器区域问题。**
  在某些情况下，某些语音区域可能会遇到网络和稳定性问题，导致机器人无法加入语音频道。

  **解决方法：** 使用语音频道设置切换到另一个语音区域（选择最接近你所在国家的区域）。

  **其他问题。**
  如果你已尝试以上所有解决方法，问题仍然存在，请输入 `report` 或在支持频道提交工单 https://discord.com/channels/1088032923443277824/1169558722738147378

helpdesk10_title: "如何获取/激活 Premium，我能获得哪些福利？"
helpdesk10_desc: |
  **如何兑换我的 Premium 福利？**

  要激活你的 premium 会员福利，请按照以下步骤操作：
  1. **首先关联你的 discord 账户**
    - 购买前，请确保你的 discord 账户已连接到你使用的平台（patreon 或 ko-fi）。
    - 这是必需的，以便系统能够自动检测你的付款。
  2. **购买你的会员**
  - 关联 discord 后，根据你想要的方案完成会员付款。
  3. **等待同步**
    - 付款成功后，请等待几分钟让系统同步你的会员资格。
  4. **在你的服务器中领取 premium**
    - 前往你想升级的 discord 服务器，然后使用以下命令：
      `/premium claim`
      在提示时选择正确的平台选项（patreon 或 ko-fi）。
      确保你在想要激活 premium 的服务器中运行该命令。
      领取后，premium 将立即激活。

  按照以上步骤操作，你将能够激活并享受所提供的所有 Premium 福利。如果你遇到任何问题或有进一步的疑问，请随时联系我们的支持团队。

helpdesk10_footer: "感谢你成为我们旅程的一部分！希望你在这里度过愉快的时光。"
