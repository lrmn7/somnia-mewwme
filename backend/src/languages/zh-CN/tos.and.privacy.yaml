### privacy policy commands
privacy_title: "%{bot} 的隐私政策"
privacy_label: 隐私政策
privacy_desc: |
  **用户协议**
  在服务器上使用 [%{bot}](%{serversupport})（"机器人"）需要收集某些用户数据。收集的数据包括但不限于用户的 Discord ID、Discord 用户名和服务器身份组。使用该机器人即视为接受这些政策条款。

  **数据访问**
  只有机器人开发者和托管服务可以访问数据，并且仅限于机器人开发、测试和功能实现所必需的范围。数据不会被出售、赠予或与任何第三方共享，除非法律或服务条款协议要求。你可以通过 [开发者](%{developer}) 请求查看你的数据。

  **数据存储**
  数据存储在 [MYSQL](https://www.mysql.com/) 数据库中。数据库已进行安全防护以防止外部访问。但是，不提供任何保证，机器人所有者不对意外或恶意的数据泄露负责。如果发生未经授权的数据访问，服务器工作人员将通过支持服务器通知用户。

  **用户权利**
  你随时有权请求查看你的 Discord 账户数据。你有权请求删除相关数据。用户必须通过支持服务器提交请求。

  **问题**
  如果你对可能从你的账户存储的数据有疑问或顾虑，请联系 [工作人员](%{serversupport})。如需更多信息，请查阅 Discord 服务条款。

### The following terms and conditions apply to the use of the bot.
### terms of services commands
termsofservice_title: "%{bot} 的服务条款"
tos_label: "服务条款"
termsofservice_desc: |
  **使用协议**
  通过邀请 [%{bot}](%{serversupport})（"机器人"）并使用其功能，你同意该机器人的服务条款和隐私政策。

  你确认可以在你所在的任何 Discord 服务器上自由使用该机器人。你可以将其邀请到你拥有"管理服务器"权限的任何服务器，如果你违反了本机器人的服务条款或隐私政策，或 Discord Inc. 的服务条款、隐私政策或社区准则，此权限可能会被撤销。

  通过邀请，机器人可能会按照其隐私政策中描述的方式收集特定数据。这些数据的预期用途是用于机器人的核心功能，例如执行命令。

  **关联性**
  该机器人不隶属于 Discord Inc.，也不受其支持或由其制作。与 Discord 或其任何商标对象的任何直接关联纯属巧合。我们不主张对 Discord 的资产、商标或其他知识产权的版权所有权。

  **未成年用户**
  该机器人不允许 13 岁以下或未达到其所在国家法定同意年龄的未成年人使用。这符合 Discord 服务条款。不会故意存储任何来自未成年用户的信息。如果发现某用户未成年，我们将采取一切必要措施删除已存储的数据。

  **责任**
  在任何时候，机器人的开发者和所有者不对违反这些条款的个人承担责任。我们保留自行更新这些条款的权利，并提供 1 周（7 天）的期限来选择退出这些条款。用户可以通过从其有权移除机器人的任何服务器中移除机器人来选择退出。
