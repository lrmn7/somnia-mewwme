## RULES Events ##
rules_title: "%{guild} 社区服务器规则！"
rules_desc: |
  - **保持尊重**
    始终遵守 Discord [服务条款](https://discord.com/terms) 和 [社区准则](https://discord.com/guidelines)。
  - **求助规范**
    当你寻求帮助时，请确保提供尽可能多的错误细节。
  - **禁止仇恨言论或骚扰**
    不允许包含对个人或群体的仇恨言论或骚扰行为的对话。
  - **禁止恶意挑衅或攻击**
    不允许任何旨在破坏或挑起冲突的行为。
  - **尊重知识产权**
    尊重知识产权，包括但不限于版权、商标和专利。
  - **剧透需提前警告**
    如果讨论并非所有成员都已了解的内容，请提供剧透警告以避免不快。
  - **使用合适的频道**
    在相关频道讨论特定话题，避免在无关频道进行离题讨论。
  - **禁止过度使用大写字母或刷屏**
    避免过度使用大写字母或快速连续发送重复消息。
  - **保持语音频道整洁**
    如果使用语音频道，请确保没有干扰性噪音并礼貌发言。
  - **禁止未授权的机器人或自动化**
    只有经版主授权的机器人才能在服务器上运行。
  - **举报违规行为**
    如果你目睹违规行为，请向版主或管理员举报。
  - **享受乐趣！**
    最重要的是，通过尊重所有成员并维护积极的环境来享受在此服务器上的时光。

  感谢你的加入，希望你在这里度过愉快的时光。

