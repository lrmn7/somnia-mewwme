### Equalizer command!
eq_author: "均衡器"
eq_icon: "https://i.pinimg.com/originals/cb/17/b8/cb17b80a942d7c317a35ff1324fae12f.gif"
eq_desc: |
  共有 **10 个频段** 可以设置为 **-10** 到 **10**。
  你不需要全部输入，只需输入你想更改的即可。
  如果你想跳过某个频段，留 **0** 就行。
eq_field_title: "示例："
eq_field_value: "%{prefix}eq 2 3 0 8 0 5 0 -5 0 0"
eq_footer: "重置均衡器 • %{prefix}eq reset"
eq_on: "均衡器已设置为 **%{bands}**！"
eq_number: "请提供一个有效的数字！"
eq_greater: "数字必须大于 **-10**"
eq_than: "数字必须小于 **10**"

