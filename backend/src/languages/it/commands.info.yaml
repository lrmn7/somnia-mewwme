### About commands
about_desc1: "**Dove chi desidera cantare trova sempre una canzone ♪\nUnisciti alla melodia nel tuo server Discord oggi!**"
about_desc2: |
  ・Il prefisso del bot per questo server e' `%{prefix}`
  ・Cambia il prefisso con `%{prefix} prefix <nuovo prefisso>`
  ・Riproduci un brano tramite link o termine di ricerca `%{prefix} play`
  Visita il nostro **[sito web](%{website})** o usa il comando `%{prefix} help` per ulteriori comandi.
about_desc3: |
  **Attenzione!**
  Preferibilmente ho bisogno dei permessi `Amministratore`, ma...
  Anche se non mi concedi quei permessi, posso comunque funzionare, ma potrei non essere in grado di fare tutto cio' di cui sono capace. Solo per farti sapere!

  **Aiuto e Supporto**
  Unisciti al nostro **[server di supporto](%{serversupport})** se hai bisogno di aiuto, vuoi ricevere informazioni su aggiornamenti e problemi o vuoi interagire con la community!

