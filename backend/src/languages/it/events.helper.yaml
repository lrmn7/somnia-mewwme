## RULES Events ##
rules_title: "Regole del server per la Community di %{guild}!"
rules_desc: |
  - **Sii rispettoso**
    Segui sempre i [ToS](https://discord.com/terms) e le [Linee guida](https://discord.com/guidelines) di Discord.
  - **Codice di aiuto**
    Quando chiedi aiuto, assicurati di fornire il maggior numero di dettagli possibile con gli errori.
  - **Niente discorsi d'odio o molestie**
    Nessuna conversazione contenente discorsi d'odio o molestie verso individui o gruppi.
  - **Niente trolling o provocazioni**
    Nessuna azione intesa a disturbare o provocare conflitti in alcun modo.
  - **Rispetta la proprieta' intellettuale**
    Rispetta i diritti di proprieta' intellettuale, inclusi ma non limitati a diritti d'autore, marchi e brevetti.
  - **Niente spoiler senza avviso**
    Se si discute di contenuti non ancora visti da tutti i membri, fornisci avvisi di spoiler per evitare delusioni.
  - **Usa i canali appropriati**
    Usa i canali pertinenti per argomenti specifici, evita discussioni fuori tema in canali non correlati.
  - **Niente uso eccessivo di maiuscole o spam**
    Evita l'uso eccessivo di lettere maiuscole o l'invio rapido di messaggi ripetuti.
  - **Mantieni i canali vocali ordinati**
    Se usi i canali vocali, assicurati che non ci siano rumori molesti e parla educatamente.
  - **Niente bot o automazioni non autorizzati**
    Solo i bot autorizzati dai moderatori possono operare sul server.
  - **Segnala le violazioni**
    Se assisti a violazioni delle regole, segnalale a un moderatore o amministratore.
  - **Divertiti!**
    Soprattutto, goditi il tuo tempo su questo server rispettando tutti i membri e mantenendo un ambiente positivo.

  Grazie per esserti unito, speriamo che ti troverai bene qui.

