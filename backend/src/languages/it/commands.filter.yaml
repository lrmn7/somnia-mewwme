### Equalizer command!
eq_author: "Equalizzatore"
eq_icon: "https://i.pinimg.com/originals/cb/17/b8/cb17b80a942d7c317a35ff1324fae12f.gif"
eq_desc: |
  Ci sono **10 Bande** che possono essere impostate da **-10** a **10**.
  Non devi inserirle tutte, solo quelle che vuoi modificare.
  Quindi se vuoi saltarne una, puoi semplicemente lasciarla a **0**.
eq_field_title: "Esempio:"
eq_field_value: "%{prefix}eq 2 3 0 8 0 5 0 -5 0 0"
eq_footer: "Resetta Equalizzatore • %{prefix}eq reset"
eq_on: "L'EQ e' stato impostato su **%{bands}**!"
eq_number: "Per favore inserisci un numero valido!"
eq_greater: "Il numero deve essere maggiore di **-10**"
eq_than: "Il numero deve essere minore di **10**"

