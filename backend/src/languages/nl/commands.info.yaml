### About commands
about_desc1: "**Waar zij die willen zingen altijd een lied vinden ♪\nSluit je vandaag aan bij de melodie op je Discord-server!**"
about_desc2: |
  ・Bot-prefix voor deze server is `%{prefix}`
  ・Wijzig prefix met `%{prefix} prefix <nieuw prefix>`
  ・Speel een nummer af via link of zoekterm `%{prefix} play`
  Bezoek onze **[website](%{website})** of gebruik het `%{prefix} help` commando voor meer commando's.
about_desc3: |
  **Let op!**
  Ik heb bij voorkeur `Administrator`-rechten nodig, maar...
  Zelfs als je me die rechten niet geeft, kan ik nog steeds werken, maar ik kan mogelijk niet alles doen waartoe ik in staat ben. Gewoon even ter info!

  **Hulp en ondersteuning**
  Word lid van onze **[ondersteuningsserver](%{serversupport})** als je hulp nodig hebt, informatie wilt over updates en problemen, of als je deel wilt uitmaken van de community!

