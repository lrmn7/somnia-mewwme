## RULES Events ##
rules_title: "Serverregels voor de %{guild} community!"
rules_desc: |
  - **Wees respectvol**
    Volg altijd de Discord [Servicevoorwaarden](https://discord.com/terms) en [Richtlijnen](https://discord.com/guidelines).
  - **Hulpcode**
    Wanneer je om hulp vraagt, zorg er dan voor dat je zoveel mogelijk details geeft met foutmeldingen.
  - **Geen haatdragende taal of intimidatie**
    Geen gesprekken met haatdragende taal of intimidatie jegens individuen of groepen.
  - **Geen trollen of provoceren**
    Geen acties bedoeld om conflicten te verstoren of uit te lokken op welke manier dan ook.
  - **Respecteer intellectueel eigendom**
    Respecteer intellectuele eigendomsrechten, inclusief maar niet beperkt tot auteursrechten, handelsmerken en patenten.
  - **Geen spoilers zonder waarschuwing**
    Als je content bespreekt die nog niet door alle leden is bekeken, geef dan spoilerwaarschuwingen om teleurstelling te voorkomen.
  - **Gebruik de juiste kanalen**
    Gebruik relevante kanalen voor specifieke onderwerpen, vermijd off-topic gesprekken in niet-gerelateerde kanalen.
  - **Geen overmatig gebruik van hoofdletters of spam**
    Vermijd overmatig gebruik van hoofdletters of het snel achter elkaar versturen van herhaalde berichten.
  - **Houd spraakkanalen rustig**
    Als je spraakkanalen gebruikt, zorg er dan voor dat er geen storend geluid is en spreek beleefd.
  - **Geen ongeautoriseerde bots of automatisering**
    Alleen bots die door moderators zijn geautoriseerd mogen op de server draaien.
  - **Meld overtredingen**
    Als je regelovertredingen ziet, meld deze dan bij een moderator of beheerder.
  - **Veel plezier!**
    Het belangrijkste is dat je geniet van je tijd op deze server door alle leden te respecteren en een positieve omgeving te behouden.

  Bedankt voor je deelname, we hopen dat je hier een goede tijd zult hebben.

