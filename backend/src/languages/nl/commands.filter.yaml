### Equalizer command!
eq_author: "Equalizer"
eq_icon: "https://i.pinimg.com/originals/cb/17/b8/cb17b80a942d7c317a35ff1324fae12f.gif"
eq_desc: |
  Er zijn **10 banden** die ingesteld kunnen worden van **-10** tot **10**.
  Je hoeft ze niet allemaal in te voeren, alleen de banden die je wilt wijzigen.
  Als je er een wilt overslaan, kun je het gewoon op **0** laten staan.
eq_field_title: "Voorbeeld:"
eq_field_value: "%{prefix}eq 2 3 0 8 0 5 0 -5 0 0"
eq_footer: "Equalizer resetten • %{prefix}eq reset"
