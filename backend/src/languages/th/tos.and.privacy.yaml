### privacy policy commands
privacy_title: "นโยบายความเป็นส่วนตัวของ %{bot}"
privacy_label: นโยบายความเป็นส่วนตัว
privacy_desc: |
  **ข้อตกลงผู้ใช้**
  การใช้ [%{bot}](%{serversupport}) ("บอท") บนเซิร์ฟเวอร์จำเป็นต้องเก็บรวบรวมข้อมูลผู้ใช้บางอย่าง ข้อมูลที่เก็บรวบรวมรวมถึงแต่ไม่จำกัดเฉพาะ Discord ID ของผู้ใช้ ชื่อผู้ใช้ Discord และบทบาทในเซิร์ฟเวอร์ การใช้บอทถือว่ายอมรับข้อกำหนดนโยบายเหล่านี้

  **การเข้าถึงข้อมูล**
  การเข้าถึงข้อมูลอนุญาตเฉพาะนักพัฒนาบอทและบริการโฮสติ้ง และเฉพาะภายในขอบเขตที่จำเป็นสำหรับการพัฒนาบอท การทดสอบ และการนำฟีเจอร์ไปใช้ ข้อมูลจะไม่ถูกขาย มอบให้ หรือแบ่งปันกับบุคคลที่สามใดๆ ยกเว้นตามที่กฎหมายกำหนดหรือข้อตกลงเงื่อนไขการให้บริการ คุณสามารถดูข้อมูลของคุณได้โดยร้องขอจาก [ผู้พัฒนา](%{developer})

  **การจัดเก็บข้อมูล**
  ข้อมูลถูกจัดเก็บในฐานข้อมูล [MYSQL](https://www.mysql.com/) ฐานข้อมูลได้รับการรักษาความปลอดภัยเพื่อป้องกันการเข้าถึงจากภายนอก อย่างไรก็ตาม ไม่มีการรับประกัน และเจ้าของบอทไม่รับผิดชอบต่อการรั่วไหลของข้อมูลโดยไม่ตั้งใจหรือโดยเจตนาร้าย หากมีการเข้าถึงข้อมูลโดยไม่ได้รับอนุญาต ทีมงานเซิร์ฟเวอร์จะแจ้งให้ผู้ใช้ทราบผ่านเซิร์ฟเวอร์สนับสนุน

  **สิทธิ์ของผู้ใช้**
  คุณมีสิทธิ์ขอดูข้อมูลบัญชี Discord ของคุณได้ตลอดเวลา คุณมีสิทธิ์ขอลบข้อมูลที่เกี่ยวข้อง ในการดำเนินการนี้ ผู้ใช้ต้องส่งคำขอผ่านเซิร์ฟเวอร์สนับสนุน

  **คำถาม**
  หากคุณมีคำถามหรือข้อกังวลเกี่ยวกับข้อมูลที่อาจถูกจัดเก็บจากบัญชีของคุณ กรุณาติดต่อ [ทีมงาน](%{serversupport}) สำหรับข้อมูลเพิ่มเติม ตรวจสอบข้อกำหนดการให้บริการของ Discord

### The following terms and conditions apply to the use of the bot.
### terms of services commands
termsofservice_title: "เงื่อนไขการให้บริการของ %{bot}"
tos_label: "เงื่อนไขการให้บริการ"
termsofservice_desc: |
  **ข้อตกลงการใช้งาน**
  โดยการเชิญ [%{bot}](%{serversupport}) ("บอท") และใช้ฟีเจอร์ของมัน คุณยอมรับเงื่อนไขการให้บริการและนโยบายความเป็นส่วนตัวของบอท

  คุณรับทราบว่าคุณสามารถใช้บอทได้อย่างอิสระบนเซิร์ฟเวอร์ Discord ใดก็ตามที่คุณแบ่งปัน คุณสามารถเชิญบอทไปยังเซิร์ฟเวอร์ใดก็ตามที่คุณมีสิทธิ์ "Manage Server" และสิทธิพิเศษนี้อาจถูกเพิกถอนหากคุณละเมิดเงื่อนไขการให้บริการหรือนโยบายความเป็นส่วนตัวของบอทนี้ หรือเงื่อนไขการให้บริการ นโยบายความเป็นส่วนตัว หรือแนวทางปฏิบัติของชุมชนของ Discord Inc.

  โดยการเชิญ บอทอาจเก็บรวบรวมข้อมูลเฉพาะตามที่อธิบายในนโยบายความเป็นส่วนตัว ข้อมูลนี้มีวัตถุประสงค์เพื่อใช้สำหรับฟังก์ชันหลักของบอท เช่น การดำเนินการคำสั่ง

  **ความเกี่ยวข้อง**
  บอทไม่ได้เกี่ยวข้อง ได้รับการสนับสนุน หรือสร้างโดย Discord Inc. การเชื่อมต่อโดยตรงกับ Discord หรือวัตถุเครื่องหมายการค้าใดๆ เป็นเรื่องบังเอิญ เราไม่อ้างสิทธิ์ในลิขสิทธิ์ของทรัพย์สิน เครื่องหมายการค้า หรือทรัพย์สินทางปัญญาอื่นๆ ของ Discord

  **ผู้ใช้ที่ยังไม่บรรลุนิติภาวะ**
  บอทไม่อนุญาตให้ผู้เยาว์ที่อายุต่ำกว่า 13 ปีหรือต่ำกว่าอายุยินยอมตามกฎหมายของประเทศนั้นๆ ใช้งาน ซึ่งเป็นไปตามเงื่อนไขการให้บริการของ Discord จะไม่มีการจัดเก็บข้อมูลใดๆ จากผู้ใช้ที่ยังไม่บรรลุนิติภาวะโดยเจตนา หากพบว่าผู้ใช้ยังไม่บรรลุนิติภาวะ เราจะดำเนินการทุกอย่างที่จำเป็นเพื่อลบข้อมูลที่จัดเก็บ

  **ความรับผิด**
  นักพัฒนาและเจ้าของบอทไม่อาจถูกเรียกร้องความรับผิดสำหรับบุคคลที่ละเมิดเงื่อนไขเหล่านี้ในเวลาใดก็ตาม สิทธิ์ในการอัปเดตเงื่อนไขเหล่านี้สงวนไว้ตามดุลยพินิจของเรา โดยให้ระยะเวลา 1 สัปดาห์ (7 วัน) ในการเลือกออกจากเงื่อนไขเหล่านี้ ผู้ใช้สามารถเลือกออกได้โดยการลบบอทออกจากเซิร์ฟเวอร์ใดก็ตามที่ผู้ใช้มีสิทธิ์ลบบอท
