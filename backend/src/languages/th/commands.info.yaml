### About commands
about_desc1: "**ที่ซึ่งผู้ที่ปรารถนาจะร้องเพลงจะพบเพลงเสมอ ♪\nมาร่วมทำนองเพลงในเซิร์ฟเวอร์ Discord ของคุณวันนี้!**"
about_desc2: |
  ・คำนำหน้าบอทสำหรับเซิร์ฟเวอร์นี้คือ `%{prefix}`
  ・เปลี่ยนคำนำหน้าด้วย `%{prefix} prefix <คำนำหน้าใหม่>`
  ・เล่นเพลงด้วยลิงก์หรือคำค้นหา `%{prefix} play`
  เยี่ยมชม **[เว็บไซต์](%{website})** ของเราหรือใช้คำสั่ง `%{prefix} help` สำหรับคำสั่งเพิ่มเติม
about_desc3: |
  **หมายเหตุ!**
  ฉันต้องการสิทธิ์ `Administrator` เป็นอย่างยิ่ง แต่...
  แม้ว่าคุณจะไม่ให้สิทธิ์เหล่านั้น ฉันก็ยังทำงานได้ แต่อาจไม่สามารถทำทุกอย่างที่ฉันทำได้ แค่บอกให้รู้!

  **ความช่วยเหลือและการสนับสนุน**
  เข้าร่วม **[เซิร์ฟเวอร์สนับสนุน](%{serversupport})** ของเราหากคุณต้องการความช่วยเหลือ ต้องการรับข้อมูลเกี่ยวกับการอัปเดตและปัญหา หรือต้องการมีส่วนร่วมกับชุมชน!

