### BUTTON HELPDESK 1 ###
helpdesk1_title: "ผู้ที่ปรารถนาจะร้องเพลงจะพบเพลงเสมอ ♪"
helpdesk1_desc: |
  **%{bot} เป็นบอท Discord ที่ปฏิวัติวิธีที่คุณสัมผัสดนตรีบน Discord มอบอินเทอร์เฟซที่สะอาดที่สุด เสียงคุณภาพสูง และฟีเจอร์เกี่ยวกับดนตรีมากมาย**

  **ทำไมต้อง %{bot}?**
  - **อัปเดตสม่ำเสมอ**: %{bot} ได้รับการอัปเดตอย่างต่อเนื่อง ทำให้คุณได้รับฟีเจอร์ล่าสุดและการแก้ไขที่ดีที่สุดเสมอ
  - **ฟีเจอร์ครบครัน**: ระบบเพลงที่เรียบง่ายของ %{bot} ช่วยให้เล่นเพลงจากหลายแหล่งได้อย่างราบรื่น
  - **ชุมชนสนับสนุนที่ทุ่มเท**: เราเป็นบอทที่ค่อนข้างใหม่บน Discord และเราอยากให้คุณเข้าร่วมกับเรา! การทำให้บอททำงานได้อย่างราบรื่นคือสิ่งที่เราให้ความสำคัญ ดังนั้นเราต้องการความช่วยเหลือจากคุณในการให้ข้อเสนอแนะและคำแนะนำ หากมีคำถามใดๆ สามารถเปิดตั๋วสนับสนุนได้เลย

  **ลิงก์ที่มีประโยชน์**
  - %{server}
  - %{vote}
  - %{website}
  - %{premium}

  **ต้องการความช่วยเหลือ?**
  - ส่งตั๋วเพื่อขอรับความช่วยเหลือเพิ่มเติม

  **คุณรอรอะไรอยู่? เชิญ %{bot} เข้าเซิร์ฟเวอร์ Discord ของคุณวันนี้และเพลิดเพลินกับประสบการณ์ดนตรีที่ไร้ขีดจำกัด!**
  **[คลิกที่นี่เพื่อเชิญ](%{invite})**

helpdesk2_title: "การเพิ่ม %{bot} เข้าเซิร์ฟเวอร์ของคุณ"
helpdesk2_desc: |
  **คุณสามารถเชิญ %{bot} โดยใช้[ลิงก์](%{invite})นี้**
    เลือกเซิร์ฟเวอร์ที่คุณต้องการเพิ่มและคลิก **Authorize**

  > โปรดทราบว่าหากคุณต้องการปิดสิทธิ์ `Administrator` สำหรับ %{bot} อาจส่งผลต่อการทำงาน แม้ว่าคุณจะยังสามารถเข้าถึงฟีเจอร์เพลงพื้นฐานได้ แต่บางฟังก์ชันอาจทำงานไม่ถูกต้อง

helpdesk3_title: "จะใช้บอทเพลง %{bot} ได้อย่างไร?"
helpdesk3_desc: |
  เข้าร่วมห้องเสียงหรือห้องสเตจ แล้วพิมพ์ /play <ชื่อเพลง/URL> ในช่องข้อความ
  คุณสามารถโต้ตอบโดยตรงโดยใช้ปุ่มควบคุมสำหรับหยุด เล่นซ้ำ ฯลฯ
  พิมพ์ / (หรือ /help) และเลือกไอคอนของ %{bot} เพื่อดูรายการคำสั่งทั้งหมดที่ใช้ได้

helpdesk4_title: "จะเปิดใช้งานฟีเจอร์ 24/7 ได้อย่างไร?"
helpdesk4_desc: |
  เข้าร่วมห้องเสียงหรือห้องสเตจ แล้วพิมพ์ `/247 <enable/disable>` ในช่องข้อความ

  **หมายเหตุ:** *ฟีเจอร์นี้ใช้ได้หากคุณมีสิทธิ์ `manage server` และต้องแน่ใจว่าบอทกำลังเล่นเพลงอยู่ก่อน*

helpdesk5_title: "%{bot} ไม่ตอบสนอง/ออฟไลน์"
helpdesk5_desc: |
  คุณพยายามใช้คำสั่งแต่มันล้มเหลวตลอด? มันอาจไม่สามารถตอบได้ แต่ทำตามขั้นตอนด้านล่างเพื่อแก้ไข

  **%{bot} ใช้คำสั่ง slash แล้ว!**
  ตรวจสอบให้แน่ใจว่าคุณใช้คำสั่ง slash เพราะ Discord กำหนดให้บอททั้งหมดใช้คำสั่ง slash
  เริ่มต้นโดยพิมพ์ `/play` และ `/help`

  **%{bot} ยังคงไม่ตอบสนอง?**
  สถานการณ์เดียวที่เหลือคือปัญหาทางฝั่ง Discord หรือฝั่งเรา ตรวจสอบว่า %{bot} ไม่ได้ออฟไลน์ในเซิร์ฟเวอร์ของคุณ หากออฟไลน์ ทางเลือกที่ดีที่สุดคือรอสูงสุด 5 นาทีแล้วดูว่า %{bot} กลับมาออนไลน์หรือไม่ หากออนไลน์อยู่และมีสิทธิ์ที่จำเป็นทั้งหมด คุณควรติดต่อทีมสนับสนุนของเรา

helpdesk6_title: "คุณภาพเสียงของ %{bot} กระตุก"
helpdesk6_desc: |
  ไม่มีใครชอบเพลงที่กระตุก แต่บางครั้งก็เกิดขึ้นเมื่อฟังบอทเพลงบน Discord นี่คือวิธีแก้ไขที่เป็นไปได้

  **ฉันควรทำอย่างไร?**
  ก่อนอื่นคุณควรตรวจสอบการเชื่อมต่ออินเทอร์เน็ตของคุณ Discord แสดงค่า ping ล่าสุดและค่าเฉลี่ยที่มุมล่างซ้าย เพียงคลิกที่ "Voice Connected" และตรวจสอบว่า ping ของคุณเสถียร (ถ้ากราฟสีแดงกระตุกมาก หมายความว่าไม่เสถียร!) และ ping ล่าสุดและค่าเฉลี่ยต่ำกว่า 250 มิลลิวินาที หากตัวชี้วัดทั้งสองแสดงว่าการเชื่อมต่อของคุณไม่ดี คุณควรตรวจสอบ WiFi/LAN ของคุณ การรีสตาร์ทเราเตอร์อาจช่วยแก้ปัญหาบางอย่างได้

  **คุณมี ping 5ms และดาวน์โหลด GTA 5 ได้ใน 2 นาที?**
  ดังนั้นการเชื่อมต่ออินเทอร์เน็ตของคุณดูเหมือนจะไม่ใช่ปัญหา ใน 95% ของกรณีที่ %{bot} กระตุก Discord มีปัญหาชั่วคราวกับเซิร์ฟเวอร์เสียง โดยปกติพวกเขาจะรีสตาร์ทในบางจุด แต่คุณสามารถบังคับเปลี่ยนไปยังเซิร์ฟเวอร์อื่นในภูมิภาคของคุณ [ลองเปลี่ยนภูมิภาคเซิร์ฟเวอร์](https://support.discord.com/hc/en-us/articles/1500007645701-Voice-Regions-on-Discord-FAQ#h_01F3RXJ4YCHYS652ETKWJ499Y3) เพื่อรับเซิร์ฟเวอร์เสียง Discord ใหม่
  หากคุณยังคงมีปัญหาเดิม สามารถพิมพ์ /report เพื่อรายงานปัญหาของคุณ

helpdesk7_title: "จะตั้งค่าช่องขอเพลงได้อย่างไร?"
helpdesk7_desc: |
  **จะสร้างช่องขอเพลงได้อย่างไร?**
  ตรวจสอบให้แน่ใจว่า %{bot} ได้รับสิทธิ์ `manage server` แล้วพิมพ์ /setup พร้อมตัวเลือก `create` จากนั้นบอทจะสร้างช่องพิเศษสำหรับขอเพลงโดยอัตโนมัติ

  ```หมายเหตุ: อย่าลบข้อความใดๆ ที่ %{bot} สร้างขึ้นเพื่อให้ฉันทำงานได้ถูกต้อง```

  **จะลบช่องขอเพลงได้อย่างไร?**
  เหมือนก่อนหน้านี้ เพียงแต่ในตัวเลือกให้เลือก `delete`

helpdesk8_title: "%{bot} บอกว่าไม่มีสิทธิ์อยู่เรื่อย"
helpdesk8_desc: |
  เมื่อพยายามใช้คำสั่งบางอย่าง %{bot} อาจขาดสิทธิ์บางอย่าง ในกรณีดังกล่าว %{bot} จะปฏิเสธที่จะเรียกใช้คำสั่งจนกว่าปัญหาเหล่านี้จะได้รับการแก้ไข สิ่งสำคัญคือสิทธิ์เหล่านี้ไม่ใช่ทางเลือก %{bot} ต้องการสิทธิ์เหล่านี้เพื่อดำเนินการคำสั่ง

  หากคุณเชื่อว่าบอทมีสิทธิ์ที่จำเป็น ให้ตรวจสอบการแทนที่สิทธิ์ของบทบาทในช่อง การแทนที่เหล่านี้สามารถเปลี่ยนแปลงสิทธิ์ของบทบาทในช่องเฉพาะได้

  หากคุณยังไม่สามารถระบุได้ว่าทำไม %{bot} ไม่มีสิทธิ์ที่จำเป็น ให้พิจารณาให้สิทธิ์ Administrator แก่ %{bot} ซึ่งควรจะแก้ไขปัญหาสิทธิ์ Discord ใดๆ ได้

helpdesk9_title: "Mewwme ตัดการเชื่อมต่อจากห้องเสียงเอง"
helpdesk9_desc: |
  ในกรณีที่ไม่ค่อยเกิดขึ้น แม้จะเปิดโหมด 24/7 แล้ว Mewwme อาจตัดการเชื่อมต่อจากห้องเสียงโดยที่ไม่มีใครใช้ /stop หรือปุ่ม Disconnect ของ Discord สาเหตุที่พบบ่อยและวิธีแก้ไขมีดังนี้

  **ไม่ได้เปิดโหมด 24/7**
  ตามค่าเริ่มต้น Mewwme จะตัดการเชื่อมต่อจากห้องเสียงเมื่อไม่มีคนใน 3 นาที

  **วิธีแก้ไข:** ดูที่ "4. จะเปิดใช้งานฟีเจอร์ 24/7 ได้อย่างไร?" ใน embed ช่วยเหลือแรกเพื่อเปิดโหมด 24/7

  **ขาดสิทธิ์**
  เมื่อใดก็ตามที่ Discord ขอให้เราเชื่อมต่อใหม่กับห้องเสียง ไม่ว่าจะเนื่องจากการรีสตาร์ทเซิร์ฟเวอร์หรือ API ขัดข้อง เราจะตรวจสอบสิทธิ์บอทซ้ำเพื่อให้แน่ใจว่าสามารถเข้าร่วมและพูดในช่องได้ หากมีอะไรขาดหายไป คุณจะต้องใช้ /play อีกครั้งเพื่อเชิญบอทเข้าช่องอื่นหรือช่องเดิมหลังจากเพิ่มสิทธิ์ที่จำเป็น

  **วิธีแก้ไข:** ตรวจสอบให้แน่ใจว่าใช้คำสั่ง /play เพื่อเพิ่มบอทเข้าห้องเสียงแทนที่จะย้ายจากช่องอื่น เพื่อให้แน่ใจว่าบอทมีสิทธิ์ที่จำเป็นทั้งหมดในการเชื่อมต่อใหม่เมื่อจำเป็น

  **ปัญหาภูมิภาคเซิร์ฟเวอร์**
  ในบางกรณี ภูมิภาคเสียงบางแห่งอาจมีปัญหาเครือข่ายและความเสถียรที่อาจทำให้บอทไม่สามารถเข้าร่วมห้องเสียงได้

  **วิธีแก้ไข:** เปลี่ยนไปยังภูมิภาคเสียงอื่นโดยใช้การตั้งค่าห้องเสียง (เลือกภูมิภาคที่ใกล้ประเทศของคุณที่สุด)

  **มีอย่างอื่นผิดพลาด**
  หากคุณลองวิธีแก้ไขทั้งหมดข้างต้นแล้วปัญหายังคงอยู่ กรุณาพิมพ์ `report` หรือเปิดตั๋วในฝ่ายสนับสนุน https://discord.com/channels/1088032923443277824/1169558722738147378

helpdesk10_title: "จะรับ/เปิดใช้งาน Premium และได้รับสิทธิพิเศษอะไรบ้าง?"
helpdesk10_desc: |
  **จะแลกสิทธิพิเศษ Premium ของฉันได้อย่างไร?**

  เพื่อเปิดใช้งานสิทธิพิเศษสมาชิก Premium ของคุณ กรุณาทำตามขั้นตอนเหล่านี้:
  1. **เชื่อมต่อบัญชี Discord ของคุณก่อน**
    - ก่อนซื้อ ตรวจสอบให้แน่ใจว่าบัญชี Discord ของคุณเชื่อมต่อกับแพลตฟอร์มที่คุณใช้ (Patreon หรือ Ko-fi)
    - จำเป็นเพื่อให้ระบบตรวจจับการชำระเงินของคุณโดยอัตโนมัติ
  2. **ซื้อสมาชิกของคุณ**
  - หลังจากเชื่อมต่อ Discord แล้ว ทำการชำระเงินสมาชิกตามแผนที่คุณต้องการ
  3. **รอการซิงโครไนซ์**
    - เมื่อการชำระเงินสำเร็จ กรุณารอสักครู่เพื่อให้ระบบซิงค์สมาชิกของคุณ
  4. **เคลม Premium ในเซิร์ฟเวอร์ของคุณ**
    - ไปที่เซิร์ฟเวอร์ Discord ที่คุณต้องการอัปเกรด แล้วใช้คำสั่ง:
      `/premium claim`
      เลือกตัวเลือกแพลตฟอร์มที่ถูกต้อง (Patreon หรือ Ko-fi) เมื่อถูกถาม
      ตรวจสอบให้แน่ใจว่าคุณใช้คำสั่งภายในเซิร์ฟเวอร์ที่คุณต้องการเปิดใช้งาน Premium
      เมื่อเคลมแล้ว Premium จะเปิดใช้งานทันที

  โดยทำตามขั้นตอนข้างต้น คุณจะสามารถเปิดใช้งานและเพลิดเพลินกับสิทธิประโยชน์ Premium ทั้งหมดที่นำเสนอ หากคุณพบปัญหาหรือมีคำถามเพิ่มเติม สามารถติดต่อทีมสนับสนุนของเรา

