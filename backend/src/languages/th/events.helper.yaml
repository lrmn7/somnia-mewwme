## Helper setup ##
setup_helper_content: |
  ## ยินดีต้อนรับสู่ชุมชน %{guild}!
  *หากคุณเพิ่งเริ่มใช้ Discord คุณมาถูกที่แล้ว! ช่องนี้มีไว้เพื่อช่วยคุณสำรวจเซิร์ฟเวอร์*
  ⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤⏤
  %{bot} เป็นบอท Discord ที่ยกระดับประสบการณ์ดนตรีของคุณด้วยอินเทอร์เฟซที่สะอาด เสียงคุณภาพสูง และฟีเจอร์ดนตรีหลากหลาย

  เซิร์ฟเวอร์ Discord นี้คือสถานที่ที่สมบูรณ์แบบในการพักผ่อนในใจกลางชุมชน %{guild}
  สนุกกับการแชท แบ่งปันเพลงที่ชื่นชอบ และสำรวจฟีเจอร์ทั้งหมดที่บอท %{bots} นำเสนอ!

  อยากเชิญเพื่อนเข้าเซิร์ฟเวอร์ไหม? ส่งลิงก์นี้ให้พวกเขา: %{serversupport}

