## RULES Events ##
rules_title: "กฎเซิร์ฟเวอร์สำหรับชุมชน %{guild}!"
rules_desc: |
  - **เคารพผู้อื่น**
    ปฏิบัติตาม [ข้อกำหนดการให้บริการ](https://discord.com/terms) และ [แนวทางปฏิบัติ](https://discord.com/guidelines) ของ Discord เสมอ
  - **รหัสความช่วยเหลือ**
    เมื่อคุณขอความช่วยเหลือ ให้ระบุรายละเอียดให้มากที่สุดพร้อมข้อผิดพลาด
  - **ห้ามพูดจาเกลียดชังหรือคุกคาม**
    ห้ามการสนทนาที่มีเนื้อหาเกลียดชังหรือคุกคามต่อบุคคลหรือกลุ่ม
  - **ห้ามยั่วยุหรือก่อเรื่อง**
    ห้ามกระทำใดๆ ที่มีเจตนารบกวนหรือยั่วยุความขัดแย้ง
  - **เคารพทรัพย์สินทางปัญญา**
    เคารพสิทธิ์ในทรัพย์สินทางปัญญา รวมถึงแต่ไม่จำกัดเฉพาะลิขสิทธิ์ เครื่องหมายการค้า และสิทธิบัตร
  - **ห้ามสปอยล์โดยไม่เตือน**
    หากพูดถึงเนื้อหาที่สมาชิกทุกคนยังไม่ได้ดู กรุณาเตือนก่อนเพื่อหลีกเลี่ยงความผิดหวัง
  - **ใช้ช่องที่เหมาะสม**
    ใช้ช่องที่เกี่ยวข้องสำหรับหัวข้อเฉพาะ หลีกเลี่ยงการพูดคุยนอกหัวข้อในช่องที่ไม่เกี่ยวข้อง
  - **ห้ามใช้ตัวพิมพ์ใหญ่มากเกินไปหรือสแปม**
    หลีกเลี่ยงการใช้ตัวพิมพ์ใหญ่มากเกินไปหรือส่งข้อความซ้ำๆ อย่างรวดเร็ว
  - **รักษาความเรียบร้อยในห้องเสียง**
    หากใช้ห้องเสียง ตรวจสอบให้แน่ใจว่าไม่มีเสียงรบกวนและพูดจาสุภาพ
  - **ห้ามใช้บอทหรือระบบอัตโนมัติที่ไม่ได้รับอนุญาต**
    อนุญาตเฉพาะบอทที่ได้รับอนุญาตจากผู้ดูแลเท่านั้นที่สามารถทำงานบนเซิร์ฟเวอร์
  - **รายงานการละเมิด**
    หากคุณเห็นการละเมิดกฎ ให้รายงานต่อผู้ดูแลหรือแอดมิน
  - **สนุกให้เต็มที่!**
    สิ่งสำคัญที่สุดคือเพลิดเพลินกับเวลาบนเซิร์ฟเวอร์นี้โดยเคารพสมาชิกทุกคนและรักษาบรรยากาศที่ดี

  ขอบคุณที่เข้าร่วม เราหวังว่าคุณจะมีช่วงเวลาที่ดีที่นี่

