### Equalizer command!
eq_author: "Ekvalizér"
eq_icon: "https://i.pinimg.com/originals/cb/17/b8/cb17b80a942d7c317a35ff1324fae12f.gif"
eq_desc: |
  Existuje **10 pásem**, která lze nastavit od **-10** do **10**.
  Nemusíte zadávat všechna, pouze ta, která chcete změnit.
  Pokud tedy chcete jedno přeskočit, můžete ho jednoduše nechat na **0**.
eq_field_title: "Příklad:"
eq_field_value: "%{prefix}eq 2 3 0 8 0 5 0 -5 0 0"
eq_footer: "Resetovat ekvalizér • %{prefix}eq reset"
eq_on: "EQ byl nastaven na **%{bands}**!"
eq_number: "Prosím zadejte platné číslo!"
eq_greater: "Číslo musí být větší než **-10**"
eq_than: "Číslo musí být menší než **10**"

