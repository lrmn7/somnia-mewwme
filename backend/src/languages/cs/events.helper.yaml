## RULES Events ##
rules_title: "Pravidla serveru pro komunitu %{guild}!"
rules_desc: |
  - **Buďte ohleduplní**
    Vždy dodržujte [Podmínky služby](https://discord.com/terms) a [Pokyny](https://discord.com/guidelines) Discordu.
  - **Kód nápovědy**
    Když žádáte o pomoc, uveďte co nejvíce podrobností včetně chyb.
  - **Žádné nenávistné projevy nebo obtěžování**
    Žádné konverzace obsahující nenávistné projevy nebo obtěžování vůči jednotlivcům nebo skupinám.
  - **Žádné trollení nebo provokování**
    Žádné akce určené k narušení nebo vyvolání konfliktů jakýmkoli způsobem.
  - **Respektujte duševní vlastnictví**
    Respektujte práva duševního vlastnictví, včetně autorských práv, ochranných známek a patentů.
  - **Žádné spoilery bez varování**
    Pokud diskutujete o obsahu, který ještě nebyl všemi členy zhlédnut, uveďte varování před spoilery, abyste předešli zklamání.
  - **Používejte příslušné kanály**
    Používejte relevantní kanály pro konkrétní témata, vyhněte se diskusím mimo téma v nesouvisejících kanálech.
  - **Žádné nadměrné používání velkých písmen nebo spamování**
    Vyhněte se nadměrnému používání velkých písmen nebo rychlému odesílání opakovaných zpráv.
  - **Udržujte hlasové kanály čisté**
    Pokud používáte hlasové kanály, zajistěte, aby nedocházelo k rušivému hluku, a mluvte slušně.
  - **Žádní neautorizovaní boti nebo automatizace**
    Na serveru smějí fungovat pouze boti autorizovaní moderátory.
  - **Hlaste porušení pravidel**
    Pokud jste svědkem porušení pravidel, nahlaste to moderátorovi nebo administrátorovi.
  - **Bavte se!**
    Nejdůležitější je, abyste si na tomto serveru užívali čas, respektovali všechny členy a udržovali pozitivní prostředí.

  Děkujeme za připojení, doufáme, že se tu budete dobře bavit.

