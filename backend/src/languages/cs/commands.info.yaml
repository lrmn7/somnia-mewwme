### About commands
about_desc1: "**Kde ti, kdo chtějí zpívat, vždy najdou písničku ♪\nPřipojte se k melodii na svém Discord serveru ještě dnes!**"
about_desc2: |
  ・Prefix bota pro tento server je `%{prefix}`
  ・Změňte prefix pomocí `%{prefix} prefix <nový prefix>`
  ・Přehrajte skladbu pomocí odkazu nebo hledaného výrazu `%{prefix} play`
  Navštivte naše **[webové stránky](%{website})** nebo použijte příkaz `%{prefix} help` pro více příkazů.
about_desc3: |
  **Upozornění!**
  Ideálně potřebuji oprávnění `Administrator`, ale...
  I když mi tato oprávnění neudělíte, stále mohu fungovat, ale nemusím být schopen udělat vše, čeho jsem schopen. Jen říkám!

  **Nápověda a podpora**
  Připojte se k našemu **[serveru podpory](%{serversupport})**, pokud potřebujete pomoc, chcete získat informace o aktualizacích a problémech nebo se chcete zapojit do komunity!

