### Equalizer command!
eq_author: "المعادل"
eq_icon: "https://i.pinimg.com/originals/cb/17/b8/cb17b80a942d7c317a35ff1324fae12f.gif"
eq_desc: |
  يوجد **10 نطاقات** يمكن ضبطها من **-10** إلى **10**.
  لا تحتاج لإدخالها جميعاً، فقط التي تريد تغييرها.
  إذا أردت تخطي واحد، يمكنك تركه كـ **0**.
eq_field_title: "مثال:"
eq_field_value: "%{prefix}eq 2 3 0 8 0 5 0 -5 0 0"
eq_footer: "إعادة تعيين المعادل • %{prefix}eq reset"
eq_on: "تم ضبط المعادل على **%{bands}**!"
eq_number: "يرجى إدخال رقم صالح!"
eq_greater: "يجب أن يكون الرقم أكبر من **-10**"
eq_than: "يجب أن يكون الرقم أقل من **10**"

