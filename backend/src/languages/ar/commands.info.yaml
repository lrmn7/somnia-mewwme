### About commands
about_desc1: "**حيث يجد من يرغب في الغناء دائماً أغنية ♪\nانضم إلى اللحن في خادم Discord الخاص بك اليوم!**"
about_desc2: |
  ・بادئة البوت لهذا الخادم هي `%{prefix}`
  ・غيّر البادئة بـ `%{prefix} prefix <new prefix>`
  ・شغّل مقطعاً بالرابط أو مصطلح البحث `%{prefix} play`
  قم بزيارة **[موقعنا](%{website})** أو استخدم الأمر `%{prefix} help` لمزيد من الأوامر.
about_desc3: |
  **تنبيه!**
  أفضّل الحصول على صلاحيات `Administrator`، لكن...
  حتى لو لم تمنحني تلك الصلاحيات، يمكنني العمل، لكن قد لا أتمكن من فعل كل ما أستطيع. فقط للعلم!

  **المساعدة والدعم**
  انضم إلى **[خادم الدعم](%{serversupport})** إذا كنت بحاجة للمساعدة، أو تريد الحصول على معلومات حول التحديثات والمشكلات أو تريد التفاعل مع المجتمع!

