### BUTTON HELPDESK 1 ###
helpdesk1_title: "حيث يجد من يرغب في الغناء دائماً أغنية ♪"
helpdesk1_desc: |
  **%{bot} هو بوت Discord يُحدث ثورة في طريقة تجربتك للموسيقى على Discord، يقدم أنظف واجهة مستخدم، جودة صوت عالية، ومجموعة واسعة من الميزات المتعلقة بالموسيقى.**

  **لماذا %{bot}؟**
  - **تحديثات منتظمة**: يتم تحديث %{bot} باستمرار، مما يضمن حصولك دائماً على أفضل الميزات والإصلاحات الأخيرة.
  - **ميزات شاملة**: نظام الموسيقى البسيط في %{bot} يسمح بتشغيل سلس من مصادر متعددة.
  - **مجتمع دعم مُخصص**: نحن بوت جديد نسبياً على Discord، ونحب أن تنضم إلينا! ضمان عمل البوت بسلاسة هو أولويتنا، ولهذا نحتاج مساعدتك بالملاحظات والاقتراحات. إذا كان لديك أي أسئلة، لا تتردد في فتح تذكرة دعم.

  **روابط مفيدة**
  - %{server}
  - %{vote}
  - %{website}
  - %{premium}

  **هل تحتاج دعماً؟**
  - قدّم تذكرة للحصول على مساعدة إضافية

  **ماذا تنتظر؟ ادعُ %{bot} إلى خادم Discord الخاص بك اليوم واستمتع بتجربة موسيقية لا مثيل لها وبلا حدود!**
  **[اضغط هنا للدعوة](%{invite})**

helpdesk2_title: "إضافة %{bot} إلى خادمك"
helpdesk2_desc: |
  **يمكنك دعوة %{bot} باستخدام هذا [الرابط](%{invite}).**
    اختر الخادم الذي تريد إضافته إليه واضغط **تفويض**

  > لاحظ أنه إذا أردت تعطيل صلاحيات `Administrator` لـ %{bot}، فقد يؤثر ذلك على وظائفه. بينما ستظل قادراً على الوصول إلى ميزات الموسيقى الأساسية، قد لا تعمل بعض الوظائف بشكل صحيح.

helpdesk3_title: "كيف أستخدم بوت الموسيقى %{bot}؟"
helpdesk3_desc: |
  انضم إلى قناة صوتية أو قناة منصة ثم اكتب /play <اسم الأغنية/الرابط> في قناة نصية.
  يمكنك التفاعل مباشرة باستخدام أزرار التحكم للإيقاف، التكرار وغيرها.
  اكتب / (أو /help) واختر أيقونة %{bot} للحصول على قائمة بجميع الأوامر المتاحة.

helpdesk4_title: "كيف أفعّل ميزة 24/7؟"
helpdesk4_desc: |
  انضم إلى قناة صوتية أو قناة منصة ثم اكتب `/247 <enable/disable>` في قناة نصية.

  **ملاحظة:** *يمكن استخدام هذه الميزة إذا كان لديك صلاحية `manage server`، ويجب التأكد مسبقاً من أن البوت يشغل الموسيقى حالياً.*

helpdesk5_title: "%{bot} لا يستجيب/غير متصل"
helpdesk5_desc: |
  هل تحاول استخدام أمر لكنه يفشل باستمرار؟ حسناً، ربما لا يستطيع الرد، لكن اتبع الخطوات أدناه لإصلاح ذلك.

  **%{bot} يستخدم الآن أوامر السلاش!**
  تأكد من أنك تستخدم أوامر السلاش لأن Discord يتطلب الآن من جميع البوتات استخدامها.
  ابدأ بكتابة `/play` و `/help`

  **%{bot} لا يزال لا يستجيب؟**
  السيناريو المتبقي الوحيد في تلك الحالة هو مشكلة إما من جانب Discord أو من جانبنا. تحقق من أن %{bot} ليس غير متصل في خادمك. إذا كان غير متصل، أفضل خيار هو الانتظار حتى 5 دقائق ومعرفة ما إذا كان %{bot} سيعود متصلاً. إذا كان متصلاً ولديه جميع الصلاحيات المطلوبة، يجب عليك بالتأكيد التواصل مع أحد أعضاء فريق الدعم لدينا.

helpdesk6_title: "جودة صوت %{bot} متقطعة"
helpdesk6_desc: |
  لا أحد يحب الموسيقى المتقطعة، لكن ذلك يحدث أحياناً عند الاستماع إلى بوتات الموسيقى على Discord. إليك بعض الحلول الممكنة لمساعدتك في إصلاح ذلك.

  **ماذا يجب أن أفعل؟**
  أولاً وقبل كل شيء يجب عليك التحقق من اتصالك بالإنترنت. يعرض Discord آخر ومتوسط وقت الاستجابة في الزاوية السفلية اليسرى، فقط اضغط على "متصل بالصوت" وتحقق من أن وقت الاستجابة مستقر (إذا كان الرسم البياني الأحمر يتقطع كثيراً فهذا يعني أنه غير مستقر!) وأن آخر ومتوسط وقت الاستجابة أقل من 250 ميلي ثانية. إذا أظهر كلا المؤشرين أن اتصالك سيئ، يجب عليك التحقق من WiFi/LAN. إعادة تشغيل جهاز التوجيه قد يحل بعض المشاكل أيضاً.

  **لديك وقت استجابة 5ms ويمكنك تحميل GTA 5 في دقيقتين؟**
  إذاً يبدو أن اتصالك بالإنترنت ليس المشكلة. في 95% من الحالات التي يتقطع فيها %{bot}، يعاني Discord من مشاكل مؤقتة في خوادم الصوت. عادةً ما يعيدون تشغيلها في مرحلة ما، لكن يمكنك فرض التبديل إلى خادم مختلف في منطقتك.[جرب تغيير منطقة الخادم](https://support.discord.com/hc/en-us/articles/1500007645701-Voice-Regions-on-Discord-FAQ#h_01F3RXJ4YCHYS652ETKWJ499Y3) للحصول على خادم صوت Discord جديد.
  إذا كنت لا تزال تواجه نفس المشكلة، لا تتردد في كتابة /report للإبلاغ عن مشكلتك.

helpdesk7_title: "كيف أعدّ قناة طلب الأغاني؟"
helpdesk7_desc: |
  **كيف أنشئ قناة طلب؟**
  تأكد من منح %{bot} صلاحية `manage server` ثم اكتب /setup مع خيار `create` وسيقوم البوت تلقائياً بإنشاء قناة خاصة لطلبات الأغاني.

  ```ملاحظة: لا تحذف أي رسالة أنشأها %{bot} حتى أعمل بشكل صحيح.```

  **كيف أحذف قناة الطلب؟**
  كما سبق، فقط في الخيارات يمكنك اختيار `delete`.

helpdesk8_title: "%{bot} يقول باستمرار أن الصلاحيات ناقصة."
helpdesk8_desc: |
  عند محاولة تشغيل أوامر معينة، قد يفتقر %{bot} إلى صلاحيات معينة. في هذه الحالات، سيرفض %{bot} تشغيل الأمر حتى يتم حل هذه المشاكل. من المهم ملاحظة أن هذه الصلاحيات ليست اختيارية؛ %{bot} يحتاجها لتنفيذ الأمر.

  إذا كنت تعتقد أن البوت لديه الصلاحيات اللازمة، تأكد من التحقق من تجاوزات أدوار القناة. يمكن لهذه التجاوزات تعديل صلاحيات الأدوار في قنوات محددة.

  إذا كنت لا تزال غير قادر على تحديد سبب عدم امتلاك %{bot} للصلاحيات المطلوبة، فكر في منح %{bot} صلاحية Administrator. هذا من شأنه حل أي مشاكل صلاحيات Discord.

helpdesk9_title: "Mewwme يقطع الاتصال من القناة الصوتية من تلقاء نفسه"
helpdesk9_desc: |
  في حالات نادرة جداً، حتى مع تفعيل وضع 24/7، قد يقطع Mewwme الاتصال من القناة الصوتية دون أن يستخدم أحد /stop أو زر قطع الاتصال في Discord. بعض الأسباب الأكثر شيوعاً وحل محتمل مذكورة أدناه.

  **وضع 24/7 غير مُفعّل.**
  افتراضياً، يقطع Mewwme الاتصال من القناة الصوتية عندما تكون فارغة خلال 3 دقائق.

  **الحل:** ارجع إلى "4. كيف أفعّل ميزة 24/7؟" في أول تضمين مساعدة لتفعيل وضع 24/7.

  **صلاحيات ناقصة.**
  عندما يطلب منا Discord إعادة الاتصال بقناة صوتية، سواء بسبب إعادة تشغيل الخادم أو انقطاع API، نتحقق مرة أخرى من صلاحيات البوت للتأكد من قدرته على الانضمام والتحدث في القناة. إذا كان هناك شيء ناقص، ستحتاج لاستخدام /play مرة أخرى لدعوة البوت إلى قناة مختلفة أو نفس القناة بعد إضافة الصلاحيات المطلوبة.

  **الحل:** تأكد من استخدام أوامر /play لإضافة البوت إلى القناة الصوتية بدلاً من نقله من قناة مختلفة. بذلك، ستضمن أن البوت لديه جميع الصلاحيات المطلوبة لإعادة الاتصال عند الحاجة.

  **مشاكل منطقة الخادم.**
  في حالات معينة، قد تواجه بعض مناطق الصوت مشاكل في الشبكة والاستقرار قد تمنع البوت من الانضمام إلى القناة الصوتية.

  **الحل:** قم بالتبديل إلى منطقة صوت أخرى باستخدام إعدادات القناة الصوتية (اختر الأقرب إلى بلدك).

  **حدث خطأ آخر.**
  إذا جربت جميع الإصلاحات أعلاه واستمرت المشكلة، يرجى كتابة `report` أو فتح تذكرة في الدعم https://discord.com/channels/1088032923443277824/1169558722738147378

helpdesk10_title: "كيف أحصل على/أفعّل Premium وما المزايا التي أحصل عليها؟"
helpdesk10_desc: |
  **كيف أسترد مزايا Premium الخاصة بي؟**

  لتفعيل مزايا عضوية premium الخاصة بك، يرجى اتباع هذه الخطوات:
  1. **اربط حساب discord الخاص بك أولاً**
    - قبل الشراء، تأكد من ربط حساب discord الخاص بك بالمنصة التي تستخدمها (patreon أو ko-fi).
    - هذا مطلوب حتى يتمكن النظام من اكتشاف دفعتك تلقائياً.
  2. **اشترِ عضويتك**
  - بعد ربط discord الخاص بك، أكمل دفع العضوية حسب الخطة التي تريدها.
  3. **انتظر المزامنة**
    - بمجرد نجاح دفعتك، يرجى الانتظار بضع دقائق حتى يزامن النظام عضويتك.
  4. **اطلب premium في خادمك**
    - اذهب إلى خادم discord الذي تريد ترقيته، ثم استخدم هذا الأمر:
      `/premium claim`
      اختر خيار المنصة الصحيح (patreon أو ko-fi) عند المطالبة.
      تأكد من تشغيل الأمر داخل الخادم الذي تريد تفعيل premium فيه.
      بمجرد المطالبة، سيتم تفعيل premium فوراً.

  باتباع الخطوات أعلاه، ستتمكن من تفعيل والاستمتاع بجميع مزايا Premium المقدمة. إذا واجهت أي مشاكل أو لديك أسئلة إضافية، لا تتردد في التواصل مع فريق الدعم لدينا.

helpdesk10_footer: "شكراً لكونك جزءاً من رحلتنا! نأمل أن تقضي وقتاً ممتعاً هنا."
