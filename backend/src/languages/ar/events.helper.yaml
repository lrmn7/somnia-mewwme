## RULES Events ##
rules_title: "قوانين خادم مجتمع %{guild}!"
rules_desc: |
  - **كن محترماً**
    اتبع دائماً [شروط الخدمة](https://discord.com/terms) و[الإرشادات](https://discord.com/guidelines) الخاصة بـ Discord.
  - **قواعد المساعدة**
    عندما تطلب المساعدة، تأكد من تقديم أكبر قدر ممكن من التفاصيل مع الأخطاء.
  - **لا خطاب كراهية أو تحرش**
    لا محادثات تحتوي على خطاب كراهية أو تحرش تجاه الأفراد أو المجموعات.
  - **لا استفزاز أو إشعال فتن**
    لا أفعال تهدف إلى تعطيل أو إثارة النزاعات بأي شكل.
  - **احترم الملكية الفكرية**
    احترم حقوق الملكية الفكرية، بما في ذلك على سبيل المثال لا الحصر حقوق النشر والعلامات التجارية وبراءات الاختراع.
  - **لا حرق محتوى بدون تحذير**
    إذا كنت تناقش محتوى لم يشاهده جميع الأعضاء بعد، قدّم تحذيرات بالحرق لتجنب خيبة الأمل.
  - **استخدم القنوات المناسبة**
    استخدم القنوات ذات الصلة للمواضيع المحددة، تجنب النقاشات خارج الموضوع في قنوات غير ذات صلة.
  - **لا إفراط في الأحرف الكبيرة أو الرسائل المزعجة**
    تجنب الاستخدام المفرط للأحرف الكبيرة أو إرسال رسائل متكررة بسرعة.
  - **حافظ على نظافة القنوات الصوتية**
    إذا كنت تستخدم القنوات الصوتية، تأكد من عدم وجود ضوضاء مزعجة وتحدث بأدب.
  - **لا بوتات أو أتمتة غير مصرح بها**
    فقط البوتات المصرح بها من المشرفين مسموح لها بالعمل على الخادم.
  - **أبلغ عن المخالفات**
    إذا شاهدت مخالفات للقوانين، أبلغ عنها لمشرف أو مدير.
  - **استمتع!**
    الأهم من ذلك، استمتع بوقتك على هذا الخادم باحترام جميع الأعضاء والحفاظ على بيئة إيجابية.

  شكراً للانضمام، نأمل أن تقضي وقتاً ممتعاً هنا.

