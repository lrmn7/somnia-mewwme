### privacy policy commands
privacy_title: "سياسة الخصوصية لـ %{bot}"
privacy_label: سياسة الخصوصية
privacy_desc: |
  **اتفاقية المستخدم**
  يتطلب استخدام [%{bot}](%{serversupport}) ("البوت") على الخادم جمع بيانات مستخدم معينة. تشمل البيانات المجمعة على سبيل المثال لا الحصر معرّف Discord الخاص بالمستخدم، اسم مستخدم Discord، وأدوار الخادم. يُعتبر استخدام البوت قبولاً لشروط هذه السياسة.

  **الوصول إلى البيانات**
  يُسمح بالوصول إلى البيانات فقط لمطوري البوت وخدمات الاستضافة وفقط في النطاق اللازم لتطوير البوت واختباره وتنفيذ الميزات. لا يتم بيع البيانات أو تقديمها أو مشاركتها مع أي طرف ثالث، إلا كما يقتضيه القانون أو اتفاقية شروط الخدمة. يمكنك عرض بياناتك عند الطلب من [المطور](%{developer}).

  **تخزين البيانات**
  يتم تخزين البيانات في قاعدة بيانات [MYSQL](https://www.mysql.com/). قاعدة البيانات مؤمّنة لمنع الوصول الخارجي. ومع ذلك، لا يتم تقديم أي ضمانات، ومالك البوت غير مسؤول عن أي اختراقات بيانات غير مقصودة أو ضارة. في حالة وجود وصول غير مصرح به للبيانات، سيقوم فريق الخادم بإخطار المستخدمين من خلال خادم الدعم.

  **حقوق المستخدم**
  في أي وقت، لديك الحق في طلب عرض بيانات حساب Discord الخاص بك. لديك الحق في طلب حذف البيانات ذات الصلة. للقيام بذلك، يجب على المستخدمين تقديم طلب من خلال خادم الدعم.

  **الأسئلة**
  إذا كان لديك أسئلة أو مخاوف بشأن البيانات التي قد يتم تخزينها من حسابك، يرجى التواصل مع [فريق العمل](%{serversupport}). لمزيد من المعلومات، تحقق من شروط خدمة Discord.

### The following terms and conditions apply to the use of the bot.
### terms of services commands
termsofservice_title: "شروط الخدمة لـ %{bot}"
tos_label: "شروط الخدمة"
termsofservice_desc: |
  **اتفاقية الاستخدام**
  بدعوة [%{bot}](%{serversupport}) ("البوت") واستخدام ميزاته، فإنك توافق على شروط الخدمة وسياسة الخصوصية الخاصة بالبوت.

  أنت تقر بأنه يمكنك استخدام البوت بحرية على أي خادم Discord تشاركه فيه. يمكنك دعوته إلى أي خادم تملك فيه صلاحيات "Manage Server"، وقد يتم سحب هذا الامتياز إذا كنت عرضة لانتهاك شروط خدمة هذا البوت أو سياسة الخصوصية أو شروط الخدمة أو سياسة الخصوصية أو إرشادات المجتمع الخاصة بشركة Discord Inc.

  من خلال الدعوة، قد يجمع البوت بيانات محددة كما هو موصوف في سياسة الخصوصية الخاصة به. الاستخدام المقصود لهذه البيانات هو لوظائف البوت الأساسية، مثل تنفيذ الأوامر.

  **الانتماء**
  البوت غير تابع لشركة Discord Inc. أو مدعوم أو مُصنّع من قِبلها. أي اتصال مباشر بـ Discord أو أي من عناصر علاماتها التجارية هو مصادفة بحتة. نحن لا ندعي ملكية حقوق النشر لأصول Discord أو علاماتها التجارية أو ملكيتها الفكرية الأخرى.

  **المستخدمون القاصرون**
  لا يُسمح باستخدام البوت للقاصرين تحت سن 13 عاماً أو تحت سن الرشد القانوني في بلدهم. هذا يتوافق مع شروط خدمة Discord. لن يتم تخزين أي معلومات عن قصد من مستخدم قاصر. إذا تبيّن أن مستخدماً قاصر، سنتخذ جميع الإجراءات اللازمة لحذف البيانات المُخزّنة.

  **المسؤولية**
  لا يمكن تحميل مطوري ومالك البوت المسؤولية عن الأفراد الذين ينتهكون هذه الشروط في أي وقت. يحتفظ بالحق في تحديث هذه الشروط وفقاً لتقديرنا، مع منح فترة أسبوع واحد (7 أيام) للانسحاب من هذه الشروط. يمكن للمستخدم الانسحاب بإزالة البوت من أي خادم يملك فيه حق إزالة البوت.
