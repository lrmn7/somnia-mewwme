### Bassboost command!
bassboost_set: "**Bassboost has been set to %{amount}dB**"
bassboost_limit: "Please use a number between **-10** and **10**"

### Equalizer command!
eq_author: "Equalizer"
eq_icon: "https://i.pinimg.com/originals/cb/17/b8/cb17b80a942d7c317a35ff1324fae12f.gif"
eq_desc: |
  There are **10 Bands** that can be set from **-10** to **10**.
  You don't have to input all of them, just the ones you want to change.
  So if you wanna skip one, you can just leave it as a **0**.
eq_field_title: "Example:"
eq_field_value: "%{prefix}eq 2 3 0 8 0 5 0 -5 0 0"
eq_footer: "Reset Equalizer • %{prefix}eq reset"
eq_on: "EQ's been set to **%{bands}**!"
eq_number: "Please provide a valid number!"
eq_greater: "Number must be greater than **-10**"
eq_than: "Number must be lesser than **10**"

